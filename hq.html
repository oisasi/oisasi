        }

    </div>

    <script>
        // --- おいじぃ魔女音声合成システム ---
        function witchSpeak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 前の音声をクリア
                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = 'ja-JP';
                uttr.pitch = 1.6; // やや高音の魔女ボイス
                uttr.volume = 1.0;
                uttr.rate = 1.15;  
                window.speechSynthesis.speak(uttr);
            }
        }

        // --- 効果音ジェネレーター ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(550, now);
                osc.frequency.exponentialRampToValueAtTime(1100, now + 0.08);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'run') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(340, now + 0.1);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'open') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(70, now + 0.4);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'food') {
                osc.type = 'sine';
                [523, 659, 784, 1046].forEach((f, i) => { osc.frequency.setValueAtTime(f, now + i * 0.06); });
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'punch') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
                gain.gain.setValueAtTime(0.6, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'alarm') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            }
        }

        // --- ゲーム状態管理 ---
        let currentRankPlace = 4;
        let isFirstInteraction = true;
        const players = [
            { id: 0, name: ((window._playerName||"あなた") + "(P1)"), heart: 3, isDead: false, isDizzy: false, mesh: null, currentDoor: -1, stars: null, rankRegistered: false, rank: null },
            { id: 1, name: "CPU1(P2)", heart: 3, isDead: false, isDizzy: false, mesh: null, currentDoor: -1, stars: null, rankRegistered: false, rank: null },
            { id: 2, name: "CPU2(P3)", heart: 3, isDead: false, isDizzy: false, mesh: null, currentDoor: -1, stars: null, rankRegistered: false, rank: null },
            { id: 3, name: "CPU3(P4)", heart: 3, isDead: false, isDizzy: false, mesh: null, currentDoor: -1, stars: null, rankRegistered: false, rank: null }
        ];
        const doorPositions = [-4.8, 0, 4.8];
        const playerStartPositions = [-3.8, -1.3, 1.3, 3.8];
        const foods = ["🍖", "🍰", "🍕", "🍔", "🍣", "🥞", "🍩", "🍦"];
        let doorContents = [];

        let timeLeft = 5;
        let timerInterval = null;
        let hasUserSelected = false;

        // 【1位が上・最下位が下の完全ソート表示システム】
        function updateLeaderboard() {
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = '';
            
            // 生存者は上(0扱い)、確定順位は1位〜4位の順で上からきれいにソート
            const sortedPlayers = [...players].sort((a, b) => {
                const rA = a.rank === null ? 0 : a.rank;
                const rB = b.rank === null ? 0 : b.rank;
                return rA - rB;
            });

            sortedPlayers.forEach(p => {
                const rankBox = document.createElement('div');
                if (p.rank === null) {
                    rankBox.className = `rank-box rank-alive`;
                    // 「生存: ○○」の代わりに残りハート数を表示（改行でスマホ幅140pxにも綺麗に対応）
                    rankBox.innerHTML = `${"❤️".repeat(p.heart)}<br>${p.name}`;
                } else {
                    rankBox.className = `rank-box rank-${p.rank}`;
                    if (p.rank === 1) {
                        rankBox.innerHTML = `👑 1位 👑<br>${p.name}`;
                    } else {
                        rankBox.innerHTML = `□ ${p.rank}位<br>${p.name}`;
                    }
                }
                leaderboard.appendChild(rankBox);
            });
        }

        // --- タイマー＆同時リアルタイムCPU思考処理 ---
        function startCountdown() {
            if (players[0].isDead) {
                document.getElementById("timer-container").style.display = "none";
                return;
            }

            clearInterval(timerInterval);
            timeLeft = 5;
            hasUserSelected = false;
            
            players.forEach(p => p.currentDoor = -1);

            const timerContainer = document.getElementById("timer-container");
            const timerCountdown = document.getElementById("timer-countdown");
            timerContainer.style.display = "block";
            timerCountdown.innerText = timeLeft;

            // 煽りセリフ（ランダム）
            const startPhrases = [
                "ほれほれ、5秒で選ばんと置いていくぞい！",
                "さあ、どこのドアが安全かねぇ？ひっひっひ！",
                "迷っている時間は一瞬じゃぞ！早く選ばんか！"
            ];
            if (Math.random() < 0.4) {
                witchSpeak(startPhrases[Math.floor(Math.random() * startPhrases.length)]);
            }

            // CPUはカウントダウン中に各自勝手に選んで移動（ネット人間は除外）
            players.forEach((p) => {
                if (p.id === 0 || p.isDead) return;
                if (p._isNetHuman) return; // オンライン参加者は自分で選ぶ
                const decisionDelay = 0.4 + Math.random() * 3.6; 
                setTimeout(() => {
                    if (!hasUserSelected && timeLeft > 0 && !p.isDead && p.currentDoor === -1) {
                        let doorCounts = [0, 0, 0];
                        players.forEach(pl => { if(pl.currentDoor !== -1) doorCounts[pl.currentDoor]++; });
                        
                        let validChoices = [];
                        for(let d=0; d<3; d++) { if(doorCounts[d] < 2) validChoices.push(d); }
                        if(validChoices.length === 0) validChoices = [0,1,2];
                        
                        p.currentDoor = validChoices[Math.floor(Math.random() * validChoices.length)];
                        moveCharacterToDoor(p);
                    }
                }, decisionDelay * 1000);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                timerCountdown.innerText = timeLeft;
                playSound('alarm');
                gsap.fromTo(timerCountdown, { scale: 1.4 }, { scale: 1, duration: 0.2 });

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerContainer.style.display = "none";
                    handleTimeOut();
                }
            }, 1000);
        }


        // 左柵4枠・右柵4枠（場所は固定・重ならない）
        const fenceSlotsLeft = [
            { x: -7.2, z: 2.2 },
            { x: -5.6, z: 2.2 },
            { x: -7.2, z: 3.8 },
            { x: -5.6, z: 3.8 }
        ];
        const fenceSlotsRight = [
            { x:  5.6, z: 2.2 },
            { x:  7.2, z: 2.2 },
            { x:  5.6, z: 3.8 },
            { x:  7.2, z: 3.8 }
        ];
        const fenceSlotUsedLeft = [false, false, false, false];
        const fenceSlotUsedRight = [false, false, false, false];
        // 次に入れる側（左右交互でバランス）
        let fenceSideToggle = 0;

        function allocateFenceSlot(p) {
            // 空いている側を優先。両方空いてたら交互
            const leftFree = fenceSlotUsedLeft.findIndex(function(u) { return !u; });
            const rightFree = fenceSlotUsedRight.findIndex(function(u) { return !u; });
            let side = 'left';
            let idx = leftFree;
            if (leftFree >= 0 && rightFree >= 0) {
                side = (fenceSideToggle % 2 === 0) ? 'left' : 'right';
                fenceSideToggle++;
                idx = (side === 'left') ? leftFree : rightFree;
            } else if (rightFree >= 0 && leftFree < 0) {
                side = 'right';
                idx = rightFree;
            } else if (leftFree >= 0) {
                side = 'left';
                idx = leftFree;
            } else {
                // 満員時は右の最後に重ねないよう微オフセット
                side = 'right';
                idx = 3;
            }
            if (side === 'left') {
                fenceSlotUsedLeft[idx] = true;
                p.fenceSide = 'left';
                p.fenceSlot = idx;
                return fenceSlotsLeft[idx];
            } else {
                fenceSlotUsedRight[idx] = true;
                p.fenceSide = 'right';
                p.fenceSlot = idx;
                return fenceSlotsRight[idx];
            }
        }
        function clearFenceSlots() {
            for (let i = 0; i < 4; i++) {
                fenceSlotUsedLeft[i] = false;
                fenceSlotUsedRight[i] = false;
            }
            fenceSideToggle = 0;
            players.forEach(function(p) { p.fenceSlot = null; p.fenceSide = null; });
        }

        // 柵へ移動 → 着地後に「立ったまま」目が回る（着地後は完全停止）
        function blowToFenceAndDizzy(p) {
            if (!p || !p.mesh) return;
            p.isDead = true;
            p.isDizzy = false; // 移動中は目が回る扱いしない
            p.currentDoor = -1; // ドア所属を解除（他プレイヤー移動時に左右へ引っ張られない）
            if (p.stars) p.stars.visible = false;
            gsap.killTweensOf(p.mesh.position);
            gsap.killTweensOf(p.mesh.rotation);
            const slot = allocateFenceSlot(p);
            const landX = slot.x;
            const landZ = slot.z;
            gsap.timeline({
                onComplete: function() {
                    gsap.killTweensOf(p.mesh.position);
                    gsap.killTweensOf(p.mesh.rotation);
                    p.mesh.position.set(landX, 0, landZ);
                    p.mesh.rotation.set(0, 0, 0);
                    p.isDizzy = true;
                    if (p.stars) {
                        p.stars.visible = true;
                        p.stars.position.set(0, 2.35, 0);
                        p.stars.children.forEach(function(s) { s.scale.set(0.7, 0.7, 1); });
                    }
                }
            })
            .to(p.mesh.position, { x: landX, z: landZ, duration: 0.9, ease: "power2.out" }, 0)
            .to(p.mesh.position, { y: 4.2, duration: 0.35, ease: "power1.out" }, 0)
            .to(p.mesh.position, { y: 0, duration: 0.45, ease: "bounce.out" }, 0.35)
            .to(p.mesh.rotation, { x: 0, y: 0, z: 0, duration: 0.6, ease: "power2.out" }, 0);
        }

        function handleTimeOut() {
            hasUserSelected = true;
            lockButtons(true);
            document.getElementById("main-msg").innerText = "時間切れ！柵へ強制移動！";
            
            players[0].heart = 0;
            if (!players[0].rankRegistered) {
                players[0].rankRegistered = true;
                players[0].rank = currentRankPlace;
                currentRankPlace--;
                if (window.parent) {
                    window.parent.postMessage({ type: 'gameEnd', rank: players[0].rank }, '*');
                }
                updateLeaderboard();
            }
            playSound('punch');
            witchSpeak("時間切れじゃ！柵の中で目を回せぇ！");
            // 柵へ移動して立ったまま目が回る
            blowToFenceAndDizzy(players[0]);
            
            updateUI();
            
            setTimeout(() => {
                players.forEach(p => {
                    if(!p.isDead && p.currentDoor === -1) p.currentDoor = Math.floor(Math.random()*3);
                });
                executeRoundMovement();
            }, 1200);
        }

        function moveCharacterToDoor(p) {
            if(p.isDead || p.isDizzy || p.currentDoor === -1) return;
            p.stars.visible = false;
            p.isDizzy = false;

            let targetX = doorPositions[p.currentDoor];
            // 脱落者・目が回り中はルームメイト調整対象にしない（柵位置を左右に動かさない）
            let roomMates = players.filter(pl => pl.currentDoor === p.currentDoor && pl.id !== p.id && !pl.isDead && !pl.isDizzy);
            if(roomMates.length > 0) {
                targetX -= 0.55;
                gsap.to(roomMates[0].mesh.position, { x: doorPositions[p.currentDoor] + 0.55, duration: 0.3 });
            }

            playSound('run');
            gsap.to(p.mesh.position, { x: targetX, z: -3.0, duration: 0.6, ease: "power2.out" });
        }

        // --- Three.js 空間構築 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xbae1ff);
        scene.fog = new THREE.FogExp2(0xbae1ff, 0.025);

        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8.0, 16.5);
        camera.lookAt(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // === スマホ縦画面でも3つのドアが必ず画面に収まるようカメラを自動調整 ===
        function fitCameraToDoors() {
            const aspect = window.innerWidth / window.innerHeight;
            // ドアが並ぶ横幅の必要視野: doorPositions は -4.8, 0, 4.8。ドア幅 3.4 + マージン
            const sceneHalfWidth = 4.8 + 3.4 / 2 + 1.6; // 約 8.1
            const sceneHalfHeight = 5.0; // ドア高さ約5.4に少し余裕
            const fovRad = camera.fov * Math.PI / 180;
            // 縦方向で必要な距離
            const distV = sceneHalfHeight / Math.tan(fovRad / 2);
            // 横方向で必要な距離
            const distH = sceneHalfWidth / (Math.tan(fovRad / 2) * aspect);
            const dist = Math.max(distV, distH) * 1.1;
            // カメラを配置（少し高めに見下ろし）
            const camY = 8.0;
            const camZ = dist;
            camera.position.set(0, camY, camZ);
            camera.lookAt(0, 1.2, 0);
            camera.aspect = aspect;
            camera.updateProjectionMatrix();
        }
        fitCameraToDoors();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            fitCameraToDoors();
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                fitCameraToDoors();
            }, 200);
        });

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(5, 15, 8);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const wallGeo = new THREE.BoxGeometry(34, 16, 1);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfff9e6 });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(0, 8, -6);
        scene.add(wall);

        // ドア
        const doors = [];
        for (let i = 0; i < 3; i++) {
            const frameGeo = new THREE.BoxGeometry(3.4, 5.4, 0.6);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xd1c4e9 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(doorPositions[i], 2.7, -5.3);
            scene.add(frame);

            const doorPivot = new THREE.Group();
            doorPivot.position.set(doorPositions[i] - 1.5, 2.7, -4.9);
            scene.add(doorPivot);

            const panelGeo = new THREE.BoxGeometry(3.0, 5.0, 0.15);
            const panelMat = new THREE.MeshStandardMaterial({ color: 0xff6b81 });
            const panel = new THREE.Mesh(panelGeo, panelMat);
            panel.position.set(1.5, 0, 0);
            panel.castShadow = true;
            doorPivot.add(panel);
            doors.push(doorPivot);
        }

        // コマ生成
        const colors = [0xff4757, 0x2e86de, 0x2ed573, 0xffa502];

        function createStarSprite() {
            const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffea00';
            ctx.beginPath();
            for(let i=0; i<5; i++) {
                ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*13+16, -Math.sin((18+i*72)*Math.PI/180)*13+16);
                ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*5+16, -Math.sin((54+i*72)*Math.PI/180)*5+16);
            }
            ctx.closePath(); ctx.fill();
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.scale.set(0.4, 0.4, 1); return sprite;
        }

        players.forEach((p, i) => {
            const pGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.4, 16), new THREE.MeshStandardMaterial({ color: colors[i] }));
            body.position.y = 0.7; body.castShadow = true; pGroup.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffe2c4 }));
            head.position.y = 1.6; head.castShadow = true; pGroup.add(head);

            const starGroup = new THREE.Group(); starGroup.position.y = 2.3;
            for(let s=0; s<3; s++) {
                const star = createStarSprite(); let angle = (s/3)*Math.PI*2;
                star.position.set(Math.cos(angle)*0.4, 0, Math.sin(angle)*0.4); starGroup.add(star);
            }
            starGroup.visible = false; pGroup.add(starGroup); p.stars = starGroup;

            pGroup.position.set(playerStartPositions[i], 0, 6.5);
            scene.add(pGroup); p.mesh = pGroup;
        });

        const punchHand = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.0, 3.6), new THREE.MeshStandardMaterial({ color: 0xff1744 }));
        punchHand.position.set(0, -25, 0); scene.add(punchHand);

        // ===== 左柵・右柵（場所固定・各4人） =====
        function createFencePen(cx, cz, slots) {
            const pen = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0xA66B3A, roughness: 0.8, metalness: 0.05 });
            const woodDark = new THREE.MeshStandardMaterial({ color: 0x5C3A1E, roughness: 0.9 });
            const w = 3.8, d = 3.6, h = 1.35;
            const postR = 0.12, postH = h + 0.15;
            const corners = [
                [cx - w/2, cz - d/2], [cx + w/2, cz - d/2],
                [cx - w/2, cz + d/2], [cx + w/2, cz + d/2]
            ];
            corners.forEach(function(c) {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR*1.1, postH, 8), woodDark);
                post.position.set(c[0], postH/2, c[1]);
                post.castShadow = true;
                pen.add(post);
            });
            function addRail(x1,z1,x2,z2,y, thick) {
                const dx = x2-x1, dz = z2-z1;
                const len = Math.sqrt(dx*dx + dz*dz);
                const rail = new THREE.Mesh(new THREE.BoxGeometry(len, thick || 0.11, 0.09), woodMat);
                rail.position.set((x1+x2)/2, y, (z1+z2)/2);
                rail.rotation.y = Math.atan2(dx, dz) + Math.PI/2;
                rail.castShadow = true;
                pen.add(rail);
            }
            // 奥・左右は柵、手前は低くして中が見える
            addRail(corners[0][0], corners[0][1], corners[1][0], corners[1][1], 0.4, 0.12);
            addRail(corners[0][0], corners[0][1], corners[1][0], corners[1][1], 0.95, 0.12);
            addRail(corners[0][0], corners[0][1], corners[2][0], corners[2][1], 0.4, 0.12);
            addRail(corners[0][0], corners[0][1], corners[2][0], corners[2][1], 0.95, 0.12);
            addRail(corners[1][0], corners[1][1], corners[3][0], corners[3][1], 0.4, 0.12);
            addRail(corners[1][0], corners[1][1], corners[3][0], corners[3][1], 0.95, 0.12);
            addRail(corners[2][0], corners[2][1], corners[3][0], corners[3][1], 0.18, 0.14);

            const mat = new THREE.Mesh(
                new THREE.PlaneGeometry(w - 0.1, d - 0.1),
                new THREE.MeshStandardMaterial({ color: 0xC4A574, roughness: 0.95 })
            );
            mat.rotation.x = -Math.PI/2;
            mat.position.set(cx, 0.03, cz);
            mat.receiveShadow = true;
            pen.add(mat);

            (slots || []).forEach(function(s) {
                const mark = new THREE.Mesh(
                    new THREE.CircleGeometry(0.4, 16),
                    new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.12 })
                );
                mark.rotation.x = -Math.PI/2;
                mark.position.set(s.x, 0.04, s.z);
                pen.add(mark);
            });

            scene.add(pen);
            return pen;
        }
        // 左柵・右柵の位置は固定（移動しない）
        createFencePen(-6.4, 3.0, fenceSlotsLeft);
        createFencePen( 6.4, 3.0, fenceSlotsRight);

        // --- ロジックコア ---
        function initDoorContents() {
            let currentFoods = [foods[Math.floor(Math.random()*foods.length)], foods[Math.floor(Math.random()*foods.length)]];
            doorContents = [currentFoods[0], currentFoods[1], '<span class="witch-img" role="img" aria-label="魔女"></span>'];
            doorContents.sort(() => Math.random() - 0.5);
            for (let i = 0; i < 3; i++) {
                const el = document.getElementById(`html-emoji-${i}`);
                if (el) { el.innerHTML = doorContents[i]; el.classList.remove("show"); }
            }
        }

        function lockButtons(val) {
            document.getElementById("btn-0").disabled = val;
            document.getElementById("btn-1").disabled = val;
            document.getElementById("btn-2").disabled = val;
        }

        // 初回起動
        window.addEventListener('click', () => { if (isFirstInteraction) firstStart(); });
        window.addEventListener('touchstart', () => { if (isFirstInteraction) firstStart(); });

        function firstStart() {
            isFirstInteraction = false;
            audioCtx.resume();
            document.getElementById("main-msg").innerText = "ドアを1つ選べ！ (定員2人)";
            initDoorContents();
            updateLeaderboard();
            startCountdown();
        }

        function selectDoor(choice) {
            if(hasUserSelected) return;
            if (typeof Net !== 'undefined' && Net.online && !Net.isHost) {
                hasUserSelected = true;
                try { clearInterval(timerInterval); } catch(e){}
                var tc=document.getElementById("timer-container"); if(tc) tc.style.display="none";
                try { playSound('click'); } catch(e){}
                try { lockButtons(true); } catch(e){}
                if (Net.hostConn && Net.hostConn.open) Net.hostConn.send({t:'choice', slot: choice});
                var msg=document.getElementById('main-msg'); if(msg) msg.innerText='選択送信済み・待機中';
                return;
            }
            hasUserSelected = true;
            clearInterval(timerInterval);
            document.getElementById("timer-container").style.display = "none";
            playSound('click');
            lockButtons(true);

            players[0].currentDoor = choice;
            moveCharacterToDoor(players[0]);

            // 未決定CPUを即決させる
            players.forEach(p => {
                if(!p.isDead && p.currentDoor === -1) {
                    let doorCounts = [0,0,0];
                    players.forEach(pl => { if(pl.currentDoor !== -1) doorCounts[pl.currentDoor]++; });
                    let validChoices = [];
                    for(let d=0; d<3; d++) { if(doorCounts[d] < 2) validChoices.push(d); }
                    p.currentDoor = validChoices.length > 0 ? validChoices[Math.floor(Math.random()*validChoices.length)] : Math.floor(Math.random()*3);
                    moveCharacterToDoor(p);
                }
            });

            setTimeout(executeRoundMovement, 500);
        }

        function executeRoundMovement() {
            document.getElementById("main-msg").innerText = "全員位置についたねぇ...";
            setTimeout(revealDoors, 800);
        }

        function revealDoors() {
            document.getElementById("main-msg").innerText = "せーの、オープン！！";
            const openPhrases = ["ひっひっひ、開けるよぉ！", "さあて、誰がぶっ飛ぶかねぇ！開門！", "運命の瞬間じゃ！それオープン！"];
            witchSpeak(openPhrases[Math.floor(Math.random()*openPhrases.length)]);
            playSound('open');

            doors.forEach((door, i) => {
                gsap.to(door.rotation, { y: -Math.PI / 1.5, duration: 0.5, ease: "power2.inOut" });
                const el = document.getElementById(`html-emoji-${i}`);
                if (el) el.classList.add("show");
            });

            setTimeout(evaluateResults, 1000);
        }

        function evaluateResults() {
            let witchIndex = doorContents.indexOf('<span class="witch-img" role="img" aria-label="魔女"></span>');
            let hitWitch = false;
            let currentTurnDeadGroup = []; 

            players.forEach((p) => {
                if (p.isDead) return;

                if (p.currentDoor === witchIndex) {
                    p.heart--;
                    hitWitch = true;
                    updateUI();

                    if (p.heart > 0) {
                        // くらって目が回る間は完全停止（体は動かさず星だけ回す）
                        playSound('alarm');
                        p.isDizzy = true;
                        p.stars.visible = true;
                        p.stars.position.set(0, 2.35, 0);
                        gsap.killTweensOf(p.mesh.position);
                        gsap.killTweensOf(p.mesh.rotation);
                        p.mesh.rotation.set(0, 0, 0);
                        (function(char) {
                            setTimeout(function() {
                                if (char.isDead) return;
                                char.isDizzy = false;
                                if (char.stars) char.stars.visible = false;
                                char.mesh.rotation.set(0, 0, 0);
                            }, 1800);
                        })(p);
                    } else {
                        // ハート0：柵へ → 立ったまま目が回る
                        currentTurnDeadGroup.push(p);
                        blowToFenceAndDizzy(p);
                    }
                } else if (p.currentDoor !== -1) {
                    playSound('food');
                    gsap.to(p.mesh.position, { y: 1.2, duration: 0.2, yoyo: true, repeat: 3 });
                }
            });

            if (hitWitch) {
                playSound('punch');
                punchHand.position.set(doorPositions[witchIndex], 1.5, -5);
                gsap.to(punchHand.position, { z: -1.0, duration: 0.1, yoyo: true, repeat: 1, onComplete: () => { punchHand.position.y = -25; } });
                witchSpeak("みーつけたぁ！！ぶっ飛べぇい！！");
            }

            // 【〇〇は〇位確定じゃ ボイス＆自動ソートシステム】
            if (currentTurnDeadGroup.length > 0) {
                let tieRank = currentRankPlace - currentTurnDeadGroup.length + 1;
                
                currentTurnDeadGroup.forEach(p => {
                    if (!p.rankRegistered) {
                        p.rankRegistered = true;
                        p.rank = tieRank; // 順位確定
                        if (p.id === 0 && window.parent) {
                            window.parent.postMessage({ type: 'gameEnd', rank: tieRank }, '*');
                        }
                    }
                });
                currentRankPlace -= currentTurnDeadGroup.length;
                
                updateLeaderboard(); // 即座にソートして再描画

                // 魔女の順位確定セリフ
                let deadNames = currentTurnDeadGroup.map(p => p.name).join("と");
                setTimeout(() => { 
                    witchSpeak(`${deadNames}は${tieRank}位確定じゃ！`); 
                }, 1300);
            }

            setTimeout(checkGameProgress, 2500);
        }

        function checkGameProgress() {
            doors.forEach((d, i) => { gsap.to(d.rotation, { y: 0, duration: 0.4 }); const el = document.getElementById(`html-emoji-${i}`); if (el) el.classList.remove("show"); });

            const alivePlayers = players.filter(p => !p.isDead);

            // ゲーム終了判定
            if (alivePlayers.length <= 1) {
                if (alivePlayers.length === 1) {
                    document.getElementById("main-msg").innerText = `👑 勝者：${alivePlayers[0].name} 👑`;
                    if (!alivePlayers[0].rankRegistered) {
                        alivePlayers[0].rankRegistered = true;
                        alivePlayers[0].rank = 1;
                        if (alivePlayers[0].id === 0 && window.parent) {
                            window.parent.postMessage({ type: 'gameEnd', rank: 1 }, '*');
                        }
                    }
                    updateLeaderboard();
                    // 「勝ちは〇〇じゃ」のセリフ
                    witchSpeak(`勝負あった！勝ちは${alivePlayers[0].name}じゃ！`);
                } else {
                    document.getElementById("main-msg").innerText = "全員全滅！引き分け！";
                    witchSpeak("ひっひっひ！誰も残らなかったねぇ！勝ちはこのワシじゃ！");
                }
                
                // UIの切り替え（アクション非表示、もう一度遊ぶボタン表示）
                document.getElementById("action-bar").style.display = "none";
                document.getElementById("restart-container").style.display = "flex";
                return;
            }

            initDoorContents();

            // 生存者のみ初期位置へ戻す（脱落者・目が回り中は動かさない）
            players.forEach((p, i) => {
                if (p.isDead) return; // 柵エリアの脱落者は固定のまま
                p.isDizzy = false;
                if (p.stars) p.stars.visible = false;
                gsap.killTweensOf(p.mesh.position);
                gsap.killTweensOf(p.mesh.rotation);
                p.mesh.rotation.set(0, 0, 0);
                gsap.to(p.mesh.position, { x: playerStartPositions[i], y: 0, z: 6.5, duration: 0.6 });
            });

            if (!players[0].isDead) {
                document.getElementById("main-msg").innerText = "ドアを1つ選べ！ (定員2人)";
                lockButtons(false);
                startCountdown();
            } else {
                document.getElementById("main-msg").innerText = "観戦モード：CPU決戦を見守り中...";
                document.getElementById("action-bar").style.display = "none";
                setTimeout(() => {
                    hasUserSelected = true;
                    players.forEach(p => { if(!p.isDead) p.currentDoor = Math.floor(Math.random()*3); });
                    players.forEach(p => moveCharacterToDoor(p));
                    setTimeout(executeRoundMovement, 500);
                }, 1500);
            }
        }

        // --- 完全リセット（もう一度遊ぶ）システム ---
        function resetGame() {
            playSound('click');
            currentRankPlace = 4;
            hasUserSelected = false;
            isFirstInteraction = false; 

            // 全員のステータス、3D位置、エフェクトを完全初期化
            if (typeof clearFenceSlots === 'function') clearFenceSlots();
            players.forEach((p, i) => {
                p.heart = 3;
                p.isDead = false;
                p.isDizzy = false;
                p.rank = null;
                p.rankRegistered = false;
                p.currentDoor = -1;
                p.stars.visible = false;
                p.stars.position.set(0, 2.3, 0);
                p.stars.rotation.set(0, 0, 0);
                p.stars.children.forEach(function(s) { s.scale.set(0.4, 0.4, 1); });
                p.mesh.rotation.set(0, 0, 0);
                gsap.to(p.mesh.position, { x: playerStartPositions[i], y: 0, z: 6.5, duration: 0.5 });
            });

            // ドアを完全に閉じる
            doors.forEach((door) => { gsap.to(door.rotation, { y: 0, duration: 0.5 }); });

            // 絵文字レイヤーの非表示
            for (let i = 0; i < 3; i++) {
                const el = document.getElementById(`html-emoji-${i}`);
                if (el) el.classList.remove("show");
            }

            // UIボタン、メッセージの復元
            document.getElementById("restart-container").style.display = "none";
            document.getElementById("action-bar").style.display = "flex";
            lockButtons(false);
            
            updateUI();
            
            document.getElementById("main-msg").innerText = "ドアを1つ選べ！ (定員2人)";
            initDoorContents();
            startCountdown();
        }

        function updateUI() {
            // 上部の4人カードは削除したため、右側のランキングUIの更新に集約します
            updateLeaderboard();
        }

        function updateEmojiPositions() {
            const width = window.innerWidth; const height = window.innerHeight;
            const widthHalf = width / 2; const heightHalf = height / 2;
            for (let i = 0; i < 3; i++) {
                const pos = new THREE.Vector3(doorPositions[i], 2.6, -5.3); pos.project(camera);
                const x = (pos.x * widthHalf) + widthHalf; const y = -(pos.y * heightHalf) + heightHalf;
                const el = document.getElementById(`html-emoji-${i}`);
                if (el) { el.style.left = `${x}px`; el.style.top = `${y}px`; }
            }
        }

        // アニメーションループ
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            updateEmojiPositions();
            players.forEach((p) => {
                // 生存時のくらみ・死亡後の目が回る演出の両方で星を回す
                if (p.stars && p.stars.visible && p.isDizzy) {
                    // 星だけ回す（キャラ本体の位置・姿勢は一切いじらない）
                    p.stars.rotation.y = elapsedTime * 8;
                    p.stars.position.y = 2.35 + Math.sin(elapsedTime * 12) * 0.06;
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        if (location.search.includes('challenge=1')) {
            setTimeout(() => { if (isFirstInteraction) firstStart(); }, 300);
        }
    
        // ===== キーボード操作（ドア選択） =====
        (function setupHqKeyboard() {
            window.addEventListener('keydown', function(e) {
                if (e.repeat) return;
                const tag = (e.target && e.target.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                const b0 = document.getElementById('btn-0');
                const b1 = document.getElementById('btn-1');
                const b2 = document.getElementById('btn-2');
                if (!b0 || !b1 || !b2) return;
                // ボタンが無効なら選択フェーズ外
                if (b0.disabled && b1.disabled && b2.disabled) {
                    // リザルト画面の再スタート等
                    if (e.key === 'Enter' || e.key === ' ') {
                        const rb = document.getElementById('restart-btn');
                        if (rb && rb.offsetParent !== null) { e.preventDefault(); rb.click(); }
                    }
                    return;
                }
                const key = e.key;
                let choice = null;
                if (key === '1' || key === 'ArrowLeft' || key === 'a' || key === 'A' || key === 'ArrowLeft') choice = 0;
                else if (key === '2' || key === 'ArrowDown' || key === 's' || key === 'S' || key === 'ArrowUp') choice = 1;
                else if (key === '3' || key === 'ArrowRight' || key === 'd' || key === 'D') choice = 2;
                if (choice === null) return;
                const btn = [b0,b1,b2][choice];
                if (btn && !btn.disabled) {
                    e.preventDefault();
                    if (typeof selectDoor === 'function') selectDoor(choice);
                    else btn.click();
                }
            });
        })();

    </script>
