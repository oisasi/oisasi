/* ===== Online multiplayer overlay ===== */
#net-overlay{display:none;position:fixed;inset:0;background:rgba(6,2,16,.94);z-index:9999;align-items:center;justify-content:center;padding:16px;overflow:auto;}
#net-overlay.show{display:flex;}
.net-card{background:linear-gradient(165deg,#2e1550 0%,#1a0a30 55%,#12061f 100%);border:2px solid rgba(199,125,255,.5);border-radius:22px;padding:22px 20px 18px;max-width:440px;width:100%;color:#f4e9ff;box-shadow:0 12px 48px rgba(80,20,140,.45),inset 0 1px 0 rgba(255,255,255,.06);font-family:sans-serif;}
.net-card h2{margin:0 0 6px;font-size:22px;color:#ffd166;text-align:center;letter-spacing:1px;text-shadow:0 0 18px rgba(255,209,102,.35);}
.net-card .sub{color:#c7a0e8;font-size:13px;text-align:center;margin:0 0 14px;line-height:1.45;}
.net-tabs{display:flex;gap:8px;margin-bottom:12px;}
.net-tab{flex:1;padding:10px;border:1px solid rgba(199,125,255,.4);background:rgba(60,30,90,.5);color:#e0c4ff;border-radius:12px;cursor:pointer;font-size:13px;font-weight:700;}
.net-tab.active{background:linear-gradient(135deg,#9b59b6,#6c3483);color:#fff;border-color:#c77dff;}
.net-pane{display:none;}.net-pane.active{display:block;}
.net-field{margin:8px 0;}
.net-field label{display:block;font-size:12px;color:#c7a0e8;margin-bottom:4px;font-weight:700;}
.net-field input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(199,125,255,.4);background:rgba(20,10,40,.8);color:#fff;font-size:16px;box-sizing:border-box;letter-spacing:.08em;text-align:center;}
.net-btn{display:block;width:100%;margin:8px 0;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#9b59b6,#c77dff);color:#fff;box-shadow:0 6px 16px rgba(155,89,182,.35);}
.net-btn.secondary{background:rgba(50,25,80,.65);border:1px solid rgba(199,125,255,.4);color:#e0c4ff;box-shadow:none;}
.net-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.net-btn.danger{background:rgba(80,20,40,.7);border:1px solid rgba(255,100,120,.4);color:#ffb0bc;}
.net-code-wrap{background:rgba(0,0,0,.28);border:1px dashed rgba(255,209,102,.4);border-radius:16px;padding:12px 10px;margin:8px 0 12px;text-align:center;}
.net-code{font-size:36px;font-weight:900;letter-spacing:.28em;text-align:center;color:#ffd166;margin:4px 0 8px;font-family:monospace;text-shadow:0 0 20px rgba(255,209,102,.4);}
.net-code-hint{font-size:11px;color:#b89ad4;margin:0;}
.net-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 8px;}
.net-slot{background:rgba(30,14,55,.75);border:1.5px solid rgba(199,125,255,.28);border-radius:14px;padding:12px 10px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;transition:border-color .2s,background .2s;}
.net-slot.filled{border-color:rgba(199,125,255,.7);background:rgba(70,30,110,.45);box-shadow:0 0 16px rgba(155,89,182,.2);}
.net-slot.empty{opacity:.55;}
.net-slot .slot-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#1a0a2e;background:#c77dff;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.net-slot.empty .slot-avatar{background:rgba(100,70,130,.4);color:#c7a0e8;font-size:14px;}
.net-slot .slot-name{font-size:13px;font-weight:700;color:#f0e6ff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
.net-slot .slot-meta{font-size:10px;color:#b89ad4;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.net-slot .tag{font-size:10px;background:#c77dff;color:#1a0a2e;padding:2px 6px;border-radius:6px;font-weight:800;}
.net-slot .tag.host{background:#ffd166;}
.net-slot .tag.you{background:#7bed9f;}
.net-status-line{text-align:center;font-size:12px;color:#e0c4ff;min-height:18px;margin:4px 0 8px;}
.net-plist{list-style:none;padding:0;margin:10px 0;max-height:180px;overflow:auto;display:none;}
.net-plist li{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:4px 0;background:rgba(40,20,70,.6);border-radius:10px;font-size:14px;}
.net-plist .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.net-plist .tag{font-size:10px;background:#c77dff;color:#1a0a2e;padding:2px 6px;border-radius:6px;font-weight:700;}
#net-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(40,15,70,.95);color:#ffd166;padding:10px 18px;border-radius:12px;border:1px solid rgba(199,125,255,.5);opacity:0;transition:.25s;z-index:10000;pointer-events:none;font-size:14px;}
#net-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#start-online-btn{margin-top:10px;}
.net-lobby-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:rgba(155,89,182,.35);border:1px solid rgba(199,125,255,.45);color:#e0c4ff;margin:0 auto 8px;}
.net-lobby-head{text-align:center;margin-bottom:4px;}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おいじぃのデス・プレス順位決定戦</title>
    <style>
        body {
            background: radial-gradient(circle, #2c1a4d, #0b061a);
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-size: 24px;
            text-shadow: 0 0 10px #9b59b6;
            margin-bottom: 10px;
            text-align: center;
        }

        /* おいじぃのメッセージエリア */
        #wizard-box {
            background: rgba(20, 10, 35, 0.8);
            border: 2px solid #8e44ad;
            border-radius: 15px;
            padding: 15px;
            width: 90%;
            max-width: 600px;
            min-height: 100px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 0 20px rgba(142, 68, 173, 0.5);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        #wizard-emoji {
            font-size: 60px;
            animation: float 3s ease-in-out infinite;
        }

        #wizard-text {
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            color: #e0d0ff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 3Dステージの構築 */
        .stage-container {
            perspective: 1000px; /* 3Dの奥行き感 */
            width: 100%;
            max-width: 700px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .floor-3d {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            background: #1e1e24;
            padding: 40px 10px;
            border-radius: 20px;
            transform: rotateX(45deg); /* 床を斜めに倒して3Dに */
            transform-style: preserve-3d;
            box-shadow: 0 30px 50px rgba(0,0,0,0.9), inset 0 0 20px #000;
            border: 4px solid #3d3d4a;
            box-sizing: border-box;
        }

        /* 足場マス */
        .panel {
            width: 110px;
            height: 110px;
            background: #2d3436;
            border: 4px solid #636e72;
            position: relative;
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 8px 0 #1c1f22;
            transition: background 0.3s;
        }

        .panel-num {
            position: absolute;
            top: 5px;
            left: 8px;
            font-size: 16px;
            color: #b2bec3;
            font-weight: bold;
        }

        /* キャラクターの見た目（リアルな人間をCSSで表現） */
        .player-zone {
            position: absolute;
            width: 100%;
            bottom: 20px;
            text-align: center;
            transform-style: preserve-3d;
        }

        .player-token {
            transform: translateZ(25px); /* 足場から少し浮かせる */
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* リアルな人型シルエットスタイル */
        .human-silhouette {
            width: 24px;
            height: 42px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.2s;
        }

        .human-head {
            width: 12px;
            height: 12px;
            background: #ffdbac;
            border-radius: 50%;
            border: 1px solid #111;
            box-sizing: border-box;
        }

        .human-body {
            width: 18px;
            height: 20px;
            border-radius: 4px 4px 1px 1px;
            margin-top: 1px;
            border: 1px solid #111;
            box-sizing: border-box;
        }

        .human-legs {
            display: flex;
            justify-content: space-between;
            width: 14px;
            height: 10px;
        }

        .human-leg {
            width: 5px;
            height: 100%;
            background: #222;
            border-radius: 0 0 1px 1px;
        }

        .p-name {
            font-size: 11px;
            background: rgba(0, 0, 0, 0.85);
            padding: 2px 5px;
            border-radius: 4px;
            color: #fff;
            display: inline-block;
            margin-top: 5px;
            white-space: nowrap;
            border: 1px solid #444;
        }

        /* ペシャンコに潰れた状態 */
        .player-token.crushed .human-silhouette {
            transform: scaleY(0.05) scaleX(2.5);
            transform-origin: bottom;
            opacity: 0.7;
        }
        .player-token.crushed .p-name {
            transform: scaleY(0.5);
            opacity: 0.5;
        }

        /* ⚡ 巨大3Dプレス機 ⚡ */
        .press-machine {
            position: absolute;
            left: 8px;
            top: 8px;
            width: 90px;
            height: 90px;
            background: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 15px, #2c3e50 15px, #2c3e50 30px);
            border: 4px solid #111;
            border-bottom: 10px solid #7f8c8d;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            transform: translateZ(500px); 
            transition: transform 0.2s cubic-bezier(0.6, -0.28, 0.735, 0.045);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            box-sizing: border-box;
        }

        /* プレス落下状態 */
        .press-machine.fall {
            opacity: 1;
            transform: translateZ(10px); /* 足場の直上へ激突 */
            animation: shake 0.2s 0.2s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateZ(10px) translateY(0); }
            25% { transform: translateZ(10px) translateY(-5px); }
            75% { transform: translateZ(10px) translateY(5px); }
        }

        /* 操作UI */
        #ui-box {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 #6d3386;
            margin: 8px;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #6d3386;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 5px 0 #962d22;
        }

        .btn-action {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            box-shadow: 0 5px 0 #1e8449;
            font-size: 18px;
            padding: 15px 35px;
        }

        /* リザルト画面 */
        .results-box {
            background: rgba(0,0,0,0.85);
            border: 3px solid #f1c40f;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-out;
            width: 100%;
            box-sizing: border-box;
        }

        .rank-item {
            font-size: 20px;
            margin: 12px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        .rank-badge {
            background: #f1c40f;
            color: #000;
            padding: 2px 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b061a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        #special-badge {
            background: #e74c3c;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
            display: none;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* 📱 スマホ対応（レスポンシブ表示の強化） */
        @media (max-width: 600px) {
            h1 { font-size: 18px; }
            #wizard-box { padding: 10px; gap: 10px; }
            #wizard-emoji { font-size: 45px; }
            #wizard-text { font-size: 14px; }
            
            /* 3D床面をスマホ画面幅に合わせて安全にスケールダウン */
            .stage-container { height: 180px; margin-bottom: 10px; }
            .floor-3d { padding: 20px 5px; transform: rotateX(45deg) scale(0.85); }
            
            .panel { width: 78px; height: 78px; }
            .panel-num { font-size: 12px; top: 3px; left: 5px; }
            .press-machine { width: 60px; height: 60px; left: 5px; top: 5px; }
            
            .player-zone { bottom: 12px; }
            .human-silhouette { width: 18px; height: 32px; }
            .human-head { width: 9px; height: 9px; }
            .human-body { width: 14px; height: 15px; }
            .human-legs { width: 10px; height: 8px; }
            .human-leg { width: 4px; }
            .p-name { font-size: 9px; padding: 1px 3px; margin-top: 3px; }
            
            .btn { padding: 10px 16px; font-size: 14px; margin: 4px; }
            .btn-action { font-size: 16px; padding: 12px 25px; }
            .rank-item { font-size: 16px; }
        }

        /* ===== 📱 スマホ操作対応強化 ===== */
        button, .btn, [onclick] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(255,255,255,0.2);
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }
        @media (max-width: 600px), (hover: none) and (pointer: coarse) {
            .btn { min-height: 44px; font-size: 15px !important; padding: 12px 20px !important; }
            button { min-height: 40px; }
        }

    </style>

<!-- Online multiplayer UI -->

<p style="color: #a29bfe; font-size: 16px;" id="start-desc">※音声をONにしてお楽しみください。おいじぃが喋ります！</p>
        <button class="btn btn-action" id="start-btn" onclick="initGame()">おいじぃの部屋に入るぞい（ソロ）</button>

    <h1>🏗️ おいじぃのデス・プレス順位決定戦 🏗️</h1>

    <div id="wizard-box">
        <div id="wizard-emoji"><span class="witch-img" role="img" aria-label="魔女"></span></div>
        <p id="wizard-text">読み込み中じゃ...</p>
    </div>

    <div class="stage-container">
        <div class="floor-3d" id="stage-floor"></div>
    </div>

    <div id="ui-box"></div>

    <script>
        // プレイヤーデータ（絵文字を廃止し、CSS人型シルエットのカラーを設定）
        const playerInfo = {
            'oisashi': { name: (window._playerName||'あなた'), color: '#ff4757' },
            'cpu1': { name: 'CPU 1', color: '#1e90ff' },
            'cpu2': { name: 'CPU 2', color: '#2ed573' },
            'cpu3': { name: 'CPU 3', color: '#ffa502' }
        };

        let aliveIds = ['oisashi', 'cpu1', 'cpu2', 'cpu3'];
        let rankings = [];

        // 時間帯の状態を判定する関数
        function getTimeState() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const totalMinutes = hours * 60 + minutes;

            const startSpecial = 23 * 60;       // 23:00
            const startAssembly = 23 * 60 + 30;  // 23:30

            if (totalMinutes >= startAssembly) {
                return 'ASSEMBLY'; // 大規模なおいじぃ魔女会タイム
            } else if (totalMinutes >= startSpecial) {
                return 'SPECIAL';  // スペシャルタイム
            }
            return 'NORMAL'; // 通常時間
        }

        // ページ読み込み時に時間帯チェック
        window.onload = function() {
            const state = getTimeState();
            if (state === 'ASSEMBLY') {
                // 23:30以降の魔女会画面の構築
                document.getElementById('start-title').innerText = '🏰 大規模なおいじぃ魔女会 🏰';
                document.getElementById('start-desc').innerHTML = 'フォッフォッフォ！11時30分を過ぎたぞい！これより大規模な『おいじぃ魔女会』の始まりじゃ！<br>今夜は世界中から魔女が集まって大宴会を開くから、ゲームはお預けじゃな！お前も一緒に踊るかのぅ？';
                document.getElementById('start-btn').innerText = '宴に参加する（ゲーム終了）';
                document.getElementById('start-btn').onclick = function() {
                    speak("フォッフォッフォ！11時30分を過ぎたぞい！これより大規模な『おいじぃ魔女会』の始まりじゃ！今夜は世界中から魔女が集まって大宴会を開くから、ゲームはお預けじゃな！お前も一緒に踊るかのぅ？");
                };
            } else if (state === 'SPECIAL') {
                // 23:00〜23:30のスペシャルタイム演出
                document.getElementById('special-badge').style.display = 'block';
            }

            if (location.search.includes('challenge=1')) {
                initGame();
            }
        };

        // おいじぃのリアルな魔女ボイス関数（ピッチを上げて女性魔女風に）
        function speak(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel(); 
                
                let cleanText = text.replace(/[🏃‍♂️🤖👽👻🏆💥🏗️🏰⚠️]/g, '');
                const uttr = new SpeechSynthesisUtterance(cleanText);
                
                uttr.pitch = 1.4; // ピッチを高めにして、不気味で怪しい「女の魔女」感を演出
                uttr.rate = 0.95;  // 少しねっとり怪しく喋らせる
                uttr.lang = 'ja-JP';

                // 利用可能な場合は日本語の女性音声を割り当て
                const voices = speechSynthesis.getVoices();
                const femaleVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Haruka') || v.name.includes('Nanami')));
                if (femaleVoice) uttr.voice = femaleVoice;
                
                speechSynthesis.speak(uttr);
            }
        }

        function updateWizard(text) {
            document.getElementById('wizard-text').innerText = text;
            speak(text);
        }

        function initGame() {
            document.getElementById('start-screen').style.display = 'none';
            if (typeof Net !== 'undefined') Net.online = false;
            startRound();
        }

        function mySlotId() {
            if (!Net || !Net.online || !Net.slotMap) return 'oisashi';
            return Net.slotMap[Net.myId] || null;
        }
        /* 人間プレイヤーが誰も生き残っていない（CPUだけの状態） */
        function onlyCpusLeft() {
            if (Net && Net.online && Net.slotMap) {
                try {
                    return aliveHumanPeerIds().length === 0;
                } catch (e) { /* fallthrough */ }
            }
            return !aliveIds.includes('oisashi');
        }
        function canAutoAdvance() {
            if (!Net || !Net.online) return true;
            return !!Net.isHost;
        }
        function aliveHumanPeerIds() {
            if (!Net || !Net.online || !Net.slotMap) return [];
            return [...Net.players.keys()].filter(pid => {
                const slot = Net.slotMap[pid];
                return slot && aliveIds.includes(slot);
            });
        }

        window._netHostStart = function() {
            if (!Net.isHost) return;
            Net.online = true;
            const list = [...Net.players.entries()].map(([id,p]) => ({id, name:p.name, color:p.color}));
            const padded = list.slice(0, 4);
            let cpuN = 1;
            while (padded.length < 4) {
                padded.push({id: 'cpu_auto_'+cpuN, name: 'CPU '+cpuN, color: NetHelpers.NET_PALETTE[padded.length], isCpu: true});
                cpuN++;
            }
            Net.slotMap = {};
            const slots = ['oisashi', 'cpu1', 'cpu2', 'cpu3'];
            padded.forEach((p, i) => {
                Net.slotMap[p.id] = slots[i];
                playerInfo[slots[i]] = { name: p.name + '(' + (i+1) + 'P)', color: p.color };
            });
            aliveIds = slots.slice();
            rankings = [];
            NetHelpers.broadcast({t:'start', players: padded, slotMap: Net.slotMap});
            document.getElementById('net-overlay').classList.remove('show');
            document.getElementById('start-screen').style.display = 'none';
            startRound();
        };

        window._netBeginMatch = function(data) {
            Net.online = true;
            Net.slotMap = data.slotMap;
            const slots = ['oisashi', 'cpu1', 'cpu2', 'cpu3'];
            data.players.forEach((p, i) => {
                if (i < 4) playerInfo[slots[i]] = { name: p.name + '(' + (i+1) + 'P)', color: p.color };
            });
            aliveIds = slots.slice();
            rankings = [];
            document.getElementById('net-overlay').classList.remove('show');
            document.getElementById('start-screen').style.display = 'none';
            if (typeof updateWizard === 'function') updateWizard('ホストの合図を待つのじゃ…');
        };

        window._netStartRound = function() { if (Net.isHost) startRound(); };
        window._netRestart = function() {
            if (!Net.isHost) return;
            aliveIds = ['oisashi', 'cpu1', 'cpu2', 'cpu3'];
            rankings = [];
            startRound();
        };


        // ラウンド開始
        function startRound() {
            const count = aliveIds.length;
            const floor = document.getElementById('stage-floor');
            floor.innerHTML = '';
            
            // 原稿（テキストセリフ）は完全維持
            let msg = "";
            if (count === 4) {
                msg = "フォッフォッフォ！ワシは魔法使いの『おいじぃ』じゃ！お前たちの運の良さを、この特製デス・プレス機で試してやろうかのぅ！1つの足場には1人しか入れんぞい。さあ、選ぶのじゃ！";
            } else if (count === 3) {
                msg = "さあ、足場を3つに減らしたぞい。生き残った3人よ、次の足場を選ぶのじゃ！";
            } else if (count === 2) {
                msg = "ついに最後の2人、最終決戦じゃな……。勝てば天国、負ければペシャンコ！運命の2択じゃ、選べい！";
            }

            // スペシャルタイム時はシステム警告用テキストをUI側に追加（原稿は変更しない）
            updateWizard(msg);

            // 足場(3D)の配置
            for (let i = 0; i < count; i++) {
                const panel = document.createElement('div');
                panel.className = 'panel';
                panel.id = `panel-${i}`;
                panel.innerHTML = `
                    <div class="panel-num">${i+1}</div>
                    <div class="press-machine" id="press-${i}"></div>
                    <div class="player-zone" id="zone-${i}"></div>
                `;
                floor.appendChild(panel);
            }

            // ボタンUIの生成
            const uiBox = document.getElementById('ui-box');
            uiBox.innerHTML = '';

            // スペシャルタイム中の表示補足
            if (getTimeState() === 'SPECIAL') {
                const specialNotice = document.createElement('div');
                specialNotice.style.color = '#e74c3c';
                specialNotice.style.fontWeight = 'bold';
                specialNotice.style.marginBottom = '10px';
                specialNotice.innerText = '【スペシャルタイムルール：2箇所にプレスが同時落下！】';
                uiBox.appendChild(specialNotice);
            }

            if (Net && Net.online && Net.isHost) {
                Net.choices = new Map();
                NetHelpers.broadcast({t:'round', aliveIds: aliveIds.slice(), count: count, msg: msg});
            }
            const mySlot = mySlotId();
            const iAmAlive = mySlot && aliveIds.includes(mySlot);
            if (iAmAlive) {
                for (let i = 0; i < count; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = `${i+1}番の足場へ [キー${i+1}]`;
                    btn.onclick = () => selectPosition(i);
                    uiBox.appendChild(btn);
                }
            } else {
                const btn = document.createElement('button');
                btn.className = 'btn btn-action';
                if (onlyCpusLeft() && canAutoAdvance()) {
                    btn.innerText = 'CPU同士の対決を自動進行中…';
                    btn.disabled = true;
                    uiBox.appendChild(btn);
                    setTimeout(function () {
                        try { selectPosition(-1); } catch (e) { console.warn(e); }
                    }, 900);
                } else {
                    btn.innerText = (Net && Net.online) ? '観戦中…' : 'CPUの対決を見届ける';
                    if (!(Net && Net.online)) btn.onclick = () => selectPosition(-1);
                    else btn.disabled = true;
                    uiBox.appendChild(btn);
                }
            }
        }

        window._netApplyRound = function(data) {
            aliveIds = data.aliveIds.slice();
            const count = data.count;
            const floor = document.getElementById('stage-floor');
            floor.innerHTML = '';
            updateWizard(data.msg || '');
            for (let i = 0; i < count; i++) {
                const panel = document.createElement('div');
                panel.className = 'panel';
                panel.id = 'panel-' + i;
                panel.innerHTML = '<div class="panel-num">'+(i+1)+'</div><div class="press-machine" id="press-'+i+'"></div><div class="player-zone" id="zone-'+i+'"></div>';
                floor.appendChild(panel);
            }
            const uiBox = document.getElementById('ui-box');
            uiBox.innerHTML = '';
            const mySlot = mySlotId();
            const iAmAlive = mySlot && aliveIds.includes(mySlot);
            if (iAmAlive) {
                for (let i = 0; i < count; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = (i+1) + '番の足場へ [キー' + (i+1) + ']';
                    btn.onclick = () => selectPosition(i);
                    uiBox.appendChild(btn);
                }
            } else {
                const btn = document.createElement('button');
                btn.className = 'btn btn-action';
                btn.innerText = '観戦中…';
                btn.disabled = true;
                uiBox.appendChild(btn);
            }
        };
        window._netWaiting = function(data) {
            const uiBox = document.getElementById('ui-box');
            const info = document.createElement('div');
            info.style.color = '#c7a0e8';
            info.style.marginTop = '8px';
            info.textContent = data.msg || '他のプレイヤーの選択を待っているのじゃ…';
            if (![...uiBox.querySelectorAll('div')].some(d => d.textContent.includes('待って'))) {
                uiBox.appendChild(info);
            }
        };


        // ポジション決定
        function selectPosition(playerChoice) {
            if (Net && Net.online && !Net.isHost) {
                if (Net.hostConn && Net.hostConn.open) Net.hostConn.send({t:'choice', slot: playerChoice});
                const uiBox = document.getElementById('ui-box');
                uiBox.innerHTML = '<div style="color:#c7a0e8">選択を送信したぞい。他のプレイヤーを待つのじゃ…</div>';
                return;
            }
            if (Net && Net.online && Net.isHost) {
                Net.choices.set(Net.myId, playerChoice);
                const uiBox = document.getElementById('ui-box');
                uiBox.innerHTML = '<div style="color:#c7a0e8">選択を受け付けたぞい。他のプレイヤーを待つのじゃ…</div>';
                NetHelpers.broadcast({t:'waitingChoices', msg:'ホストが選択を待っているのじゃ…'});
                window._netAllChosen();
                return;
            }
            // Solo
            const count = aliveIds.length;
            let availableSlots = [];
            for(let i=0; i<count; i++) availableSlots.push(i);
            let assignments = {};
            if (playerChoice !== -1) {
                assignments['oisashi'] = playerChoice;
                availableSlots = availableSlots.filter(s => s !== playerChoice);
                let cpus = aliveIds.filter(id => id !== 'oisashi');
                cpus = shuffle(cpus);
                cpus.forEach((cpuId, idx) => { assignments[cpuId] = availableSlots[idx]; });
            } else {
                let cpus = [...aliveIds];
                cpus = shuffle(cpus);
                cpus.forEach((cpuId, idx) => { assignments[cpuId] = availableSlots[idx]; });
            }
            showAssignmentsAndLever(assignments);
        }

        window._netAllChosen = function() {
            if (!Net.isHost || !Net.online) return;
            const humans = aliveHumanPeerIds();
            for (const pid of humans) {
                if (!Net.choices.has(pid)) return;
            }
            const count = aliveIds.length;
            let availableSlots = [];
            for (let i = 0; i < count; i++) availableSlots.push(i);
            let assignments = {};
            const taken = new Set();
            humans.forEach(pid => {
                const slotId = Net.slotMap[pid];
                let choice = Net.choices.get(pid);
                if (choice < 0 || choice >= count || taken.has(choice)) {
                    choice = availableSlots.find(s => !taken.has(s));
                }
                assignments[slotId] = choice;
                taken.add(choice);
            });
            availableSlots = availableSlots.filter(s => !taken.has(s));
            const remaining = aliveIds.filter(id => assignments[id] === undefined);
            const shuffled = shuffle(remaining.slice());
            shuffled.forEach((cpuId, idx) => { assignments[cpuId] = availableSlots[idx]; });
            NetHelpers.broadcast({t:'assignments', assignments: assignments});
            showAssignmentsAndLever(assignments);
        };

        function showAssignmentsAndLever(assignments) {
            for (let id in assignments) {
                const pos = assignments[id];
                const zone = document.getElementById('zone-' + pos);
                const p = playerInfo[id];
                if (!zone || !p) continue;
                zone.innerHTML = '<div class="player-token" id="token-'+id+'"><div class="human-silhouette"><div class="human-head"></div><div class="human-body" style="background-color:'+p.color+'"></div><div class="human-legs"><div class="human-leg"></div><div class="human-leg"></div></div></div><span class="p-name">'+p.name+'</span></div>';
            }
            const uiBox = document.getElementById('ui-box');
            uiBox.innerHTML = '';
            updateWizard("ヒッヒッヒ、全員きれいにバラバラの場所に収まったようじゃな。では運命のレバーを引くぞい！誰が潰れるかのぅ？");
            window._pendingAssignments = assignments;
            if (!Net.online || Net.isHost) {
                if (onlyCpusLeft() && canAutoAdvance()) {
                    uiBox.innerHTML = '<div style="color:#c7a0e8">CPUだけの対決じゃ。自動でレバーを引くぞい…</div>';
                    setTimeout(function () {
                        try { executePress(assignments); } catch (e) { console.warn(e); }
                    }, 1200);
                } else {
                    const leverBtn = document.createElement('button');
                    leverBtn.className = 'btn btn-danger btn-action';
                    leverBtn.innerHTML = '<span class="witch-img" role="img" aria-label="魔女"></span> おいじぃにレバーを引かせる！ [Enter]';
                    leverBtn.onclick = () => executePress(assignments);
                    uiBox.appendChild(leverBtn);
                }
            } else {
                uiBox.innerHTML = '<div style="color:#c7a0e8">ホストがレバーを引くのを待つのじゃ…</div>';
            }
        }
        window._netApplyAssignments = function(data) { showAssignmentsAndLever(data.assignments); };
        window._netExecutePress = function() { if (window._pendingAssignments) executePress(window._pendingAssignments); };


        // プレス実行
        function executePress(assignments) {
            const count = aliveIds.length;
            const uiBox = document.getElementById('ui-box');
            uiBox.innerHTML = ''; 

            updateWizard("それっ！！ガシャーーーーン！！！");

            const state = getTimeState();
            let luckyStrikes = [];

            // ⚠️ スペシャルタイム用の超特別ルール分岐（23:00〜23:30は2箇所同時落下）
            if (state === 'SPECIAL' && count > 2) {
                let pool = [];
                for(let i=0; i<count; i++) pool.push(i);
                pool = shuffle(pool);
                luckyStrikes.push(pool[0], pool[1]); // 重複なしで2箇所選出
            } else {
                luckyStrikes.push(Math.floor(Math.random() * count)); // 通常は1箇所
            }

            if (Net && Net.online && Net.isHost) {
                NetHelpers.broadcast({t:'press', assignments: assignments, luckyStrikes: luckyStrikes, aliveIds: aliveIds.slice()});
            }
            applyPressAnimation(assignments, luckyStrikes);
        }

        window._netApplyPress = function(data) {
            aliveIds = data.aliveIds.slice();
            applyPressAnimation(data.assignments, data.luckyStrikes);
        };

        function applyPressAnimation(assignments, luckyStrikes) {
            const count = aliveIds.length;
            const uiBox = document.getElementById('ui-box');
            uiBox.innerHTML = '';

<script>window.OIJI_ROOM_PREFIX='OIJI-P-';</script>
<script>
/* =========================================================
   おいじぃ オンライン通信層 v5
   公開MQTTブローカーだけでロビー＆同期（WebRTCなし）
   作成できたネットなら参加も同じ経路で動く
   ========================================================= */
(function () {
'use strict';

var CODE_CHARS = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
var NET_PALETTE = ['#ff4757', '#1e90ff', '#2ed573', '#ffa502', '#e599f7', '#63e6be', '#ffd43b', '#ff8fa3'];
var ROOM_PREFIX = (window.OIJI_ROOM_PREFIX || 'OIJI-');

var MQTT_URLS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://broker.emqx.io:8083/mqtt'
];

function genShortCode(len) {
  var s = '';
  for (var i = 0; i < len; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return s;
}
function normalizeCode(codeRaw) {
  var code = String(codeRaw || '').trim().toUpperCase();
  code = code.replace(/^OIJI-[A-Z]?-?/, '').replace(/^OIJI-/, '');
  code = code.replace(/[^A-Z0-9]/g, '');
  return code;
}
function escapeNet(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function uid() {
  return 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}
function topicFor(code) {
  // プレフィックスと合言葉で部屋を一意に
  var p = String(ROOM_PREFIX || 'OIJI-').replace(/-$/, '');
  return 'oiji/v5/' + p + '/' + String(code).toUpperCase();
}

function netToast(msg) {
  var t = document.getElementById('net-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'net-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove('show'); }, 2800);
}
function netLog(msg) {
  try { console.log('[OIJI-Net]', msg); } catch (e) {}
  var el = document.getElementById('net-status');
  if (el) el.textContent = msg;
}

window.Net = {
  isHost: false,
  roomCode: null,
  myId: null,
  myName: 'ゲスト',
  online: false,
  players: new Map(),
  choices: new Map(),
  slotMap: null,
  mqtt: null,
  hostId: null,
  _joinTimer: null,
  _announce: null,
  _helloTimer: null
};

/* ---------- MQTT 最小実装 ---------- */
function strBytes(s) {
  var u = unescape(encodeURIComponent(s));
  var a = [];
  for (var i = 0; i < u.length; i++) a.push(u.charCodeAt(i));
  return a;
}
function bytesStr(arr) {
  var s = '';
  for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
  try { return decodeURIComponent(escape(s)); } catch (e) { return s; }
}
function mqttPacket(typeFlags, payloadArr) {
  var len = payloadArr.length;
  var header = [typeFlags];
  do {
    var enc = len % 128;
    len = Math.floor(len / 128);
    if (len > 0) enc |= 128;
    header.push(enc);
  } while (len > 0);
  return new Uint8Array(header.concat(payloadArr));
}
function makeMqttApi(ws) {
  return {
    ws: ws,
    subscribe: function (topic, cb) {
      var t = strBytes(topic);
      var payload = [0x00, 0x01];
      payload.push((t.length >> 8) & 0xff, t.length & 0xff);
      for (var i = 0; i < t.length; i++) payload.push(t[i]);
      payload.push(0x00);
      if (ws.readyState === 1) ws.send(mqttPacket(0x82, payload));
      // SUBACK を待たず短時間後にコールバック（公開ブローカー向け）
      if (cb) setTimeout(cb, 400);
    },
    publish: function (topic, obj) {
      var t = strBytes(topic);
      var m = strBytes(JSON.stringify(obj));
      var payload = [];
      payload.push((t.length >> 8) & 0xff, t.length & 0xff);
      for (var i = 0; i < t.length; i++) payload.push(t[i]);
      for (var j = 0; j < m.length; j++) payload.push(m[j]);
      if (ws.readyState === 1) {
        ws.send(mqttPacket(0x30, payload));
        return true;
      }
      return false;
    },
    close: function () {
      clearInterval(ws._ping);
      try { ws.close(); } catch (e) {}
    }
  };
}
function mqttConnect(urls, clientId, onMsg, onReady, onFail) {
  var idx = 0;
  function tryNext() {
    if (idx >= urls.length) {
      onFail && onFail(new Error('MQTT接続失敗'));
      return;
    }
    var url = urls[idx++];
    netLog('接続中… ' + url.replace(/^wss?:\/\//, '').split('/')[0]);
    var ws;
    try { ws = new WebSocket(url, 'mqtt'); } catch (e) { tryNext(); return; }
    ws.binaryType = 'arraybuffer';
    var opened = false;
    var timer = setTimeout(function () {
      if (!opened) { try { ws.close(); } catch (e) {} tryNext(); }
    }, 8000);
    ws.onopen = function () {
      var proto = strBytes('MQTT');
      var payload = [0x00, 0x04];
      for (var i = 0; i < proto.length; i++) payload.push(proto[i]);
      payload.push(0x04, 0x02, 0x00, 0x3c);
      var cid = strBytes(clientId.slice(0, 23));
      payload.push((cid.length >> 8) & 0xff, cid.length & 0xff);
      for (var j = 0; j < cid.length; j++) payload.push(cid[j]);
      ws.send(mqttPacket(0x10, payload));
    };
    ws.onmessage = function (ev) {
      var data = new Uint8Array(ev.data);
      if (!data.length) return;
      var type = data[0] >> 4;
      if (type === 2) {
        opened = true;
        clearTimeout(timer);
        if (data.length > 3 && data[3] !== 0) {
          try { ws.close(); } catch (e) {}
          tryNext();
          return;
        }
        netLog('マッチングサーバー接続OK');
        onReady && onReady(makeMqttApi(ws));
        ws._ping = setInterval(function () {
          if (ws.readyState === 1) ws.send(new Uint8Array([0xc0, 0x00]));
        }, 20000);
      } else if (type === 3) {
        var pos = 1, mul = 1, rl = 0, br;
        do {
          if (pos >= data.length) return;
          br = data[pos++];
          rl += (br & 127) * mul;
          mul *= 128;
        } while (br & 128);
        if (pos + 2 > data.length) return;
        var topicLen = (data[pos] << 8) | data[pos + 1];
        pos += 2;
        if (pos + topicLen > data.length) return;
        var topic = bytesStr(data.subarray(pos, pos + topicLen));
        pos += topicLen;
        var msgStr = bytesStr(data.subarray(pos));
        try {
          var obj = JSON.parse(msgStr);
          onMsg && onMsg(topic, obj);
        } catch (e) {}
      }
    };
    ws.onerror = function () {};
    ws.onclose = function () {
      clearTimeout(timer);
      clearInterval(ws._ping);
      if (!opened) tryNext();
    };
  }
  tryNext();
}

/* ---------- 送受信 ---------- */
function pub(type, extra) {
  if (!Net.mqtt || !Net.roomCode) return false;
  var msg = Object.assign({
    t: type,
    from: Net.myId,
    name: Net.myName,
    ts: Date.now()
  }, extra || {});
  return Net.mqtt.publish(topicFor(Net.roomCode), msg);
}

function onMessage(topic, msg) {
  if (!msg || !msg.t || !msg.from) return;
  if (msg.from === Net.myId) return;

  // ---- ホスト側 ----
  if (Net.isHost) {
    if (msg.t === 'hello' || msg.t === 'join') {
      netLog('参加者を検知: ' + (msg.name || msg.from));
      netToast((msg.name || 'ゲスト') + ' が来たぞい！');
      if (!Net.players.has(msg.from)) {
        var color = NET_PALETTE[Net.players.size % NET_PALETTE.length];
        Net.players.set(msg.from, {
          name: String(msg.name || 'ゲスト').slice(0, 10),
          color: color,
          ready: true
        });
      } else {
        Net.players.get(msg.from).name = String(msg.name || 'ゲスト').slice(0, 10);
      }
      // 歓迎 + 現在のロビー一覧を返す
      sendLobbyToAll();
      pub('welcome', { to: msg.from, hostId: Net.myId });
    } else if (msg.t === 'choice') {
      Net.choices.set(msg.from, msg.slot | 0);
      if (typeof window._netAllChosen === 'function') window._netAllChosen();
    } else if (msg.t === 'input') {
      if (typeof window._netOnInput === 'function') window._netOnInput(msg.from, msg);
    } else if (msg.t === 'lever') {
      if (typeof window._netExecutePress === 'function') window._netExecutePress();
    } else if (msg.t === 'nextRound') {
      if (typeof window._netStartRound === 'function') window._netStartRound();
    } else if (msg.t === 'retry') {
      if (typeof window._netRestart === 'function') window._netRestart();
    }
    return;
  }

  // ---- クライアント側 ----
  if (msg.t === 'welcome' || msg.t === 'host-alive') {
    if (msg.t === 'welcome' && msg.to && msg.to !== Net.myId) return;
    if (Net.hostId && msg.t === 'host-alive') {
      pub('join', {});
      return;
    }
    Net.hostId = msg.hostId || msg.from;
    clearTimeout(Net._joinTimer);
    if (Net._helloTimer) { clearInterval(Net._helloTimer); Net._helloTimer = null; }
    // 見つかった接続を本採用
    if (Net._searchApis && Net._searchApis.length) {
      /* 最初の mqtt を維持 */
    }
    netLog('ホストを発見したぞい');
    netToast('部屋に入ったぞい！');
    enterNetLobby();
    resetJoinBtn();
    pub('join', {});
  } else if (msg.t === 'lobby') {
    if (Array.isArray(msg.list)) {
      renderNetLobby(msg.list);
      // 自分の名前を反映させるため players も更新
      msg.list.forEach(function (p) {
        Net.players.set(p.id, { name: p.name, color: p.color, ready: true });
      });
    }
    // ロビーが来たら確実に入室扱い
    if (!document.getElementById('net-card-lobby') ||
        document.getElementById('net-card-lobby').style.display === 'none') {
      clearTimeout(Net._joinTimer);
      enterNetLobby();
      resetJoinBtn();
    }
  } else if (msg.t === 'start') {
    if (typeof window._netBeginMatch === 'function') window._netBeginMatch(msg);
  } else if (msg.t === 'round') {
    if (typeof window._netApplyRound === 'function') window._netApplyRound(msg);
  } else if (msg.t === 'assignments') {
    if (typeof window._netApplyAssignments === 'function') window._netApplyAssignments(msg);
  } else if (msg.t === 'press') {
    if (typeof window._netApplyPress === 'function') window._netApplyPress(msg);
  } else if (msg.t === 'results') {
    if (typeof window._netApplyResults === 'function') window._netApplyResults(msg);
  } else if (msg.t === 'waitingChoices') {
    if (typeof window._netWaiting === 'function') window._netWaiting(msg);
  } else if (msg.t === 'state') {
    if (typeof window._netApplyState === 'function') window._netApplyState(msg);
  } else if (msg.t === 'end') {
    if (typeof window._netApplyEnd === 'function') window._netApplyEnd(msg);
  }
}

function sendLobbyToAll() {
  var list = [];
  Net.players.forEach(function (p, id) {
    list.push({ id: id, name: p.name, color: p.color });
  });
  renderNetLobby(list);
  pub('lobby', { list: list });
}

/* ---------- 部屋作成 / 参加 ---------- */
function cleanup() {
  if (Net._announce) { clearInterval(Net._announce); Net._announce = null; }
  if (Net._helloTimer) { clearInterval(Net._helloTimer); Net._helloTimer = null; }
  clearTimeout(Net._joinTimer);
  if (Net.mqtt) { try { Net.mqtt.close(); } catch (e) {} Net.mqtt = null; }
  Net._lobbyVoiceDone = false;
}

function createRoom() {
  cleanup();
  Net.players = new Map();
  Net.choices = new Map();
  Net.isHost = true;
  Net.roomCode = genShortCode(4);
  Net.myId = uid();
  Net.hostId = Net.myId;
  Net.online = false;

  netLog('部屋を用意中…');
  netToast('マッチングサーバーに接続中じゃ…');

  mqttConnect(
    MQTT_URLS,
    'h' + Net.myId.slice(-12),
    onMessage,
    function (api) {
      Net.mqtt = api;
      api.subscribe(topicFor(Net.roomCode), function () {
        Net.players.set(Net.myId, { name: Net.myName, color: NET_PALETTE[0], ready: true });
        enterNetLobby();
        netToast('部屋を用意したぞい！合言葉: ' + Net.roomCode);
        netLog('合言葉 ' + Net.roomCode + ' で待機中');
        resetCreateBtn();
        // 生存アナウンス（参加側が後から来ても発見できる）
        Net._announce = setInterval(function () {
          if (Net.isHost && Net.mqtt) pub('host-alive', { hostId: Net.myId });
        }, 1500);
        pub('host-alive', { hostId: Net.myId });
      });
    },
    function () {
      netToast('サーバーに繋がらんかったのじゃ…ネットを確認して再試行じゃ。');
      resetCreateBtn();
    }
  );
}

function joinRoom(codeRaw) {
  var code = normalizeCode(codeRaw);
  if (!code || code.length < 3) {
    netToast('合言葉を入れておくれ（例: A3K9）');
    return;
  }

  cleanup();
  Net.players = new Map();
  Net.choices = new Map();
  Net.isHost = false;
  Net.roomCode = code;
  Net.myId = uid();
  Net.hostId = null;
  Net.online = false;
  Net._searchApis = [];

  var joinBtn = document.getElementById('net-btn-join');
  if (joinBtn) {
    joinBtn.disabled = true;
    joinBtn.textContent = '接続中じゃ…';
  }
  netToast('部屋【' + code + '】を探しているぞい…');
  netLog('参加: ' + code + ' topic=' + topicFor(code));

  Net._joinTimer = setTimeout(function () {
    netToast('部屋が見つからんかった。同じゲーム・合言葉・ホストがロビー待機中か確認じゃ');
    netLog('参加タイムアウト');
    resetJoinBtn();
  }, 20000);

  var topic = topicFor(code);
  var anyOk = false;
  var done = 0;

  function shoutAll() {
    var msgHello = { t: 'hello', from: Net.myId, name: Net.myName, ts: Date.now() };
    var msgJoin = { t: 'join', from: Net.myId, name: Net.myName, ts: Date.now() };
    (Net._searchApis || []).forEach(function (api) {
      try { api.publish(topic, msgHello); } catch (e) {}
      try { api.publish(topic, msgJoin); } catch (e) {}
    });
  }

  function onReady(api) {
    anyOk = true;
    Net._searchApis.push(api);
    if (!Net.mqtt) Net.mqtt = api;
    netLog('探索OK: 接続数' + Net._searchApis.length);
    if (Net._searchApis.length === 1) netToast('サーバー接続OK。ホストを探しているぞい…');
    api.subscribe(topic, function () {
      shoutAll();
      if (!Net._helloTimer) {
        var n = 0;
        Net._helloTimer = setInterval(function () {
          if (Net.hostId) {
            clearInterval(Net._helloTimer);
            Net._helloTimer = null;
            return;
          }
          n++;
          shoutAll();
          netLog('ホスト探索中… ' + n);
        }, 1000);
      }
    });
  }

  function onFail() {
    done++;
    if (done >= MQTT_URLS.length && !anyOk) {
      clearTimeout(Net._joinTimer);
      netToast('サーバーに繋がらんかったのじゃ…');
      resetJoinBtn();
    }
  }

  // 全ブローカー同時接続（ホストが別サーバーでも見つける）
  MQTT_URLS.forEach(function (url, idx) {
    // mqttConnect is sequential first-success; we need parallel one-shot
    // Use internal: connect via cloning mqttConnect pattern - call mqttConnect with single-url list
    (function (u, i) {
      mqttConnect([u], 'c' + Net.myId.slice(-10) + i, onMessage, onReady, onFail);
    })(url, idx);
  });
}

function resetCreateBtn() {
  var b = document.getElementById('net-btn-create');
  if (b) {
    b.disabled = false;
    b.textContent = b.getAttribute('data-label') || '部屋を作る';
  }
}
function resetJoinBtn() {
  var b = document.getElementById('net-btn-join');
  if (b) {
    b.disabled = false;
    b.textContent = '🚪 部屋に入る';
  }
}

/* ---------- ゲーム向け API ---------- */
function broadcast(msg) {
  // ホスト→全員（MQTTは全員が同じトピックを購読）
  if (!Net.mqtt || !Net.roomCode) return;
  var payload = Object.assign({}, msg, { from: Net.myId, name: Net.myName, ts: Date.now() });
  Net.mqtt.publish(topicFor(Net.roomCode), payload);
}
function sendToHost(msg) {
  if (Net.isHost) return;
  pub(msg.t || 'msg', msg);
}

function enterNetLobby() {
  var home = document.getElementById('net-card-home');
  var lobby = document.getElementById('net-card-lobby');
  if (home) home.style.display = 'none';
  if (lobby) lobby.style.display = 'block';
  var codeEl = document.getElementById('net-room-code');
  if (codeEl) codeEl.textContent = Net.roomCode || '----';
  var role = document.getElementById('net-lobby-role');
  if (role) role.textContent = Net.isHost ? '👑 ホスト' : '🎫 参加者';
  var sub = document.getElementById('net-lobby-sub');
  if (sub) {
    sub.textContent = Net.isHost
      ? '合言葉を仲間に教えて、そろったら開始じゃ'
      : 'ホストが対戦を始めるまで待つんじゃ';
  }
  var startBtn = document.getElementById('net-btn-start');
  var waitMsg = document.getElementById('net-wait-msg');
  if (startBtn) startBtn.style.display = Net.isHost ? 'block' : 'none';
  if (waitMsg) {
    waitMsg.style.display = Net.isHost ? 'none' : 'block';
    if (!Net.isHost) waitMsg.textContent = 'ホストが始めるのを待つのじゃ…';
  }
  netLog(Net.isHost ? 'ロビー待機中（ホスト）' : 'ロビー待機中（参加）');
  try {
    /* 入室ボイスは1回だけ（host-alive / lobby 再受信で連呼しない） */
    if (!Net._lobbyVoiceDone && typeof speak === 'function') {
      Net._lobbyVoiceDone = true;
      speak(Net.isHost
        ? 'ロビーじゃ。合言葉は ' + (Net.roomCode || '') + ' 。仲間を待つのじゃ。'
        : 'ロビーに入ったぞい。ホストが始めるまで待つのじゃ。');
    }
  } catch (e) {}
  if (Net.isHost) {
    renderNetLobby([{ id: Net.myId, name: Net.myName, color: NET_PALETTE[0] }]);
  } else {
    var arr = [];
    Net.players.forEach(function (p, id) { arr.push({ id: id, name: p.name, color: p.color }); });
    if (!arr.length) arr = [{ id: Net.myId, name: Net.myName, color: NET_PALETTE[1] || '#c77dff' }];
    renderNetLobby(arr);
  }
}

function renderNetLobby(list) {
  var slotsEl = document.getElementById('net-player-slots');
  var ul = document.getElementById('net-player-list');
  var players = list || [];
  var maxSlots = 4;

  if (slotsEl) {
    slotsEl.innerHTML = '';
    for (var i = 0; i < maxSlots; i++) {
      var p = players[i];
      var div = document.createElement('div');
      if (p) {
        div.className = 'net-slot filled';
        var tags = '<span class="tag">' + (i + 1) + 'P</span>';
        if (p.id === Net.myId) tags += '<span class="tag you">YOU</span>';
        if (i === 0) tags += '<span class="tag host">HOST</span>';
        var initial = escapeNet((p.name || '?').charAt(0));
        div.innerHTML =
          '<div class="slot-avatar" style="background:' + (p.color || '#c77dff') + '">' + initial + '</div>' +
          '<div class="slot-name">' + escapeNet(p.name || '？') + '</div>' +
          '<div class="slot-meta">' + tags + '</div>';
      } else {
        div.className = 'net-slot empty';
        div.innerHTML =
          '<div class="slot-avatar">空</div>' +
          '<div class="slot-name">空き席</div>' +
          '<div class="slot-meta"><span class="tag">' + (i + 1) + 'P</span></div>';
      }
      slotsEl.appendChild(div);
    }
  }

  if (ul) {
    ul.innerHTML = '';
    players.forEach(function (p, idx) {
      var li = document.createElement('li');
      var tags = ' <span class="tag">' + (idx + 1) + 'P</span>';
      if (p.id === Net.myId) tags += ' <span class="tag">YOU</span>';
      if (idx === 0) tags += ' <span class="tag">HOST</span>';
      li.innerHTML = '<span class="dot" style="background:' + (p.color || '#c77dff') + '"></span><span>' +
        escapeNet(p.name) + '</span>' + tags;
      ul.appendChild(li);
    });
  }

  var btn = document.getElementById('net-btn-start');
  var nPlayers = players.length;
  if (btn && Net.isHost) {
    btn.disabled = nPlayers < 2;
    btn.textContent = nPlayers < 2 ? 'あと' + (2 - nPlayers) + '人待っているぞい…' : '🎮 対戦開始！';
  }
  var waitMsg = document.getElementById('net-wait-msg');
  if (waitMsg && Net.isHost) {
    if (nPlayers < 2) {
      waitMsg.style.display = 'block';
      waitMsg.textContent = '2人以上そろったら開始できるぞい';
    } else {
      waitMsg.style.display = 'none';
    }
  }
  var status = document.getElementById('net-status');
  if (status) {
    status.textContent = nPlayers + ' / ' + maxSlots + ' 人 待機中';
  }
}

function bindNetUI() {
  /* 親（コレクション）からオンライン開始が指定された場合 → 新ロビーへ自動入室 */
  try {
    if (window._startOnline) {
      var nm = String(window._playerName || (window._oijiiUser && window._oijiiUser.name) || 'ゲスト').slice(0, 10);
      Net.myName = nm;
      var nameEl = document.getElementById('net-name');
      if (nameEl) {
        nameEl.value = nm;
        nameEl.readOnly = true;
        nameEl.style.opacity = '0.75';
      }
      try {
        var nameField = nameEl && nameEl.closest ? nameEl.closest('.net-field') : null;
        if (nameField) {
          nameField.innerHTML = '<label>名前（変更できません）</label><div style="padding:10px 12px;background:rgba(0,0,0,.28);border-radius:10px;color:#e0c4ff;font-weight:700;">' +
            nm.replace(/[<>&]/g,function(c){return ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c];}) + '</div>';
        }
      } catch (e) {}
      var ov = document.getElementById('net-overlay');
      if (ov) ov.classList.add('show');
      var h = document.getElementById('net-card-home');
      var l = document.getElementById('net-card-lobby');
      if (h) h.style.display = 'none';
      if (l) {
        l.style.display = 'block';
        var codeEl = document.getElementById('net-room-code');
        if (codeEl) codeEl.textContent = '…';
        var status = document.getElementById('net-status');
        if (status) status.textContent = '接続中…';
      }
      var action = window._onlineAction || 'create';
      setTimeout(function () {
        try {
          if (action === 'join') {
            var code = window._joinCode || '';
            var ci = document.getElementById('net-join-code');
            if (ci) ci.value = code;
            if (typeof joinRoom === 'function') joinRoom(code);
          } else {
            if (typeof createRoom === 'function') createRoom();
          }
        } catch (e) { console.warn(e); }
      }, 120);
    }
  } catch (e) { console.warn(e); }
  var onlineBtn = document.getElementById('start-online-btn');
  if (onlineBtn) {
    onlineBtn.style.display = 'none'; /* プレス内ボタンは廃止（ホームへ移動） */
    onlineBtn.onclick = function () {
      var ov = document.getElementById('net-overlay');
      if (ov) ov.classList.add('show');
      var h = document.getElementById('net-card-home');
      var l = document.getElementById('net-card-lobby');
      if (h) h.style.display = 'block';
      if (l) l.style.display = 'none';
    };
  }
  var cancelBtn = document.getElementById('net-btn-cancel');
  if (cancelBtn) {
    cancelBtn.onclick = function () {
      var ov = document.getElementById('net-overlay');
      if (ov) ov.classList.remove('show');
    };
  }
  document.querySelectorAll('.net-tab').forEach(function (tb) {
    tb.onclick = function () {
      document.querySelectorAll('.net-tab').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll('.net-pane').forEach(function (x) { x.classList.remove('active'); });
      tb.classList.add('active');
      var pane = document.getElementById('net-tab-' + tb.dataset.tab);
      if (pane) pane.classList.add('active');
    };
  });
  var createBtn = document.getElementById('net-btn-create');
  if (createBtn) {
    createBtn.setAttribute('data-label', createBtn.textContent);
    createBtn.onclick = function () {
      Net.myName = ((document.getElementById('net-name') || {}).value || 'ゲスト').slice(0, 10);
      createBtn.textContent = '部屋を用意中じゃ…';
      createBtn.disabled = true;
      createRoom();
    };
  }
  var joinBtn = document.getElementById('net-btn-join');
  if (joinBtn) {
    joinBtn.onclick = function () {
      Net.myName = ((document.getElementById('net-name') || {}).value || 'ゲスト').slice(0, 10);
      var codeInput = document.getElementById('net-join-code');
      joinRoom(codeInput ? codeInput.value : '');
    };
  }
  var codeInput = document.getElementById('net-join-code');
  if (codeInput) {
    codeInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (joinBtn) joinBtn.click();
      }
    });
  }
  var copyBtn = document.getElementById('net-btn-copy');
  if (copyBtn) {
    copyBtn.onclick = function () {
      if (!Net.roomCode) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(Net.roomCode).then(function () {
          netToast('合言葉をコピーしたぞい！');
        }).catch(function () { netToast(Net.roomCode); });
      } else {
        netToast(Net.roomCode);
      }
    };
  }
  
  var codeTap = document.getElementById('net-room-code');
  if (codeTap) {
    codeTap.style.cursor = 'pointer';
    codeTap.onclick = function () {
      var c = Net.roomCode || codeTap.textContent || '';
      if (!c || c === '----' || c === '…') return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(c).then(function () { netToast('合言葉をコピーしたぞい'); });
        } else {
          netToast('合言葉: ' + c);
        }
      } catch (e) { netToast('合言葉: ' + c); }
    };
  }

  var leaveBtn = document.getElementById('net-btn-leave');
  if (leaveBtn) {
    leaveBtn.onclick = function () {
      cleanup();
      location.reload();
    };
  }
  var startBtn = document.getElementById('net-btn-start');
  if (startBtn) {
    startBtn.onclick = function () {
      if (!Net.isHost) return;
      var n = 0;
      Net.players.forEach(function(){ n++; });
      if (n < 2) {
        netToast('2人以上そろってから開始じゃ');
        return;
      }
      startBtn.disabled = true;
      startBtn.textContent = '開始するぞい…';
      // 強制スタート
      if (typeof window._netHostStart === 'function') {
        try { window._netHostStart(); } catch (e) { netLog('start error: ' + e); }
      } else {
        netToast('このゲームの開始処理がまだないのじゃ…');
        startBtn.disabled = false;
      }
      // オーバーレイ強制クローズ
      var ov = document.getElementById('net-overlay');
      if (ov) ov.classList.remove('show');
      // ゲーム内ホーム/メニューも隠す
      ['menu','start-screen','title-screen','home-screen'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    };
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bindNetUI);
} else {
  bindNetUI();
}

window.createRoom = createRoom;
window.joinRoom = joinRoom;

window.NetHelpers = {
  broadcast: broadcast,
  sendTo: function () { /* 互換 */ },
  sendToHost: sendToHost,
  netToast: netToast,
  NET_PALETTE: NET_PALETTE,
  normalizeCode: normalizeCode
};

/* press 互換: Net.hostConn.send */
Object.defineProperty(Net, 'hostConn', {
  get: function () {
    if (Net.isHost) return null;
    return {
      open: !!Net.mqtt,
      send: function (msg) {
        if (!msg) return;
        if (msg.t) pub(msg.t, msg);
        else pub('msg', msg);
      }
    };
  }
});
Object.defineProperty(Net, 'conns', {
  get: function () {
    var m = new Map();
    Net.players.forEach(function (p, id) {
      if (id === Net.myId) return;
      m.set(id, {
        open: !!Net.mqtt,
        peer: id,
        send: function (msg) { broadcast(msg); }
      });
    });
    return m;
  }
});

})();


        // ===== キーボード操作（足場選択・レバー） =====
        (function setupPressKeyboard() {
            function activeChoiceButtons() {
                const box = document.getElementById('ui-box');
                if (!box) return [];
                return Array.from(box.querySelectorAll('button.btn')).filter(b => !b.disabled);
            }
            window.addEventListener('keydown', function(e) {
                if (e.repeat) return;
                const tag = (e.target && e.target.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                const key = e.key;
                const btns = activeChoiceButtons();
                if (!btns.length) return;

                // 数字キー 1-9 → 足場選択ボタン
                if (/^[1-9]$/.test(key)) {
                    const idx = parseInt(key, 10) - 1;
                    // 「N番の足場へ」系のボタンを優先
                    const choiceBtns = btns.filter(b => /足場|番/.test(b.innerText || ''));
                    const targetList = choiceBtns.length ? choiceBtns : btns;
                    if (idx >= 0 && idx < targetList.length) {
                        e.preventDefault();
                        targetList[idx].click();
                        return;
                    }
                }
                // Enter / Space → 危険アクション（レバー）や単独の進行ボタン
                if (key === 'Enter' || key === ' ') {
                    const lever = btns.find(b => /レバー|見届ける|自動進行|次へ|もう一度|再挑戦/.test(b.innerText || b.innerHTML || ''));
                    const action = lever || (btns.length === 1 ? btns[0] : null);
                    if (action) {
                        e.preventDefault();
                        action.click();
                    }
                }
            });
        })();
