<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>おいさしミュージック プレイヤー | Oisasi Music Player</title>
<meta name="description" content="oisasimusic公式ミュージックプレイヤー">
<meta name="theme-color" content="#061820">
<link rel="icon" type="image/jpeg" href="oisasi music.jpg">
<link rel="apple-touch-icon" href="oisasi music.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  --bg: #061018;
  --bg-elevated: #0a1a24;
  --surface: rgba(255,255,255,0.06);
  --surface-hover: rgba(255,255,255,0.11);
  --border: rgba(80,200,220,0.22);
  --text: #eef6f8;
  --muted: #8aadb8;
  --cyan: #2ec8e0;
  --teal: #0a9aaa;
  --sky: #5ee0f5;
  --header-bg: rgba(6,16,24,0.88);
  --shadow: 0 22px 55px rgba(0,0,0,0.5);
  --radius: 18px;
  --header-h: 56px;
}
[data-theme="light"] {
  --bg: #f0f7fa;
  --bg-elevated: #ffffff;
  --surface: rgba(10,100,120,0.05);
  --surface-hover: rgba(10,100,120,0.1);
  --border: rgba(10,140,160,0.2);
  --text: #1a2a30;
  --muted: #5a7080;
  --cyan: #0a8a9a;
  --teal: #087a88;
  --sky: #0a9aaa;
  --header-bg: rgba(255,255,255,0.92);
  --shadow: 0 18px 45px rgba(0,0,0,0.12);
}
@media (prefers-color-scheme: light) {
  [data-theme="auto"] {
    --bg: #f0f7fa; --bg-elevated: #ffffff;
    --surface: rgba(10,100,120,0.05); --surface-hover: rgba(10,100,120,0.1);
    --border: rgba(10,140,160,0.2); --text: #1a2a30; --muted: #5a7080;
    --cyan: #0a8a9a; --teal: #087a88; --sky: #0a9aaa;
    --header-bg: rgba(255,255,255,0.92); --shadow: 0 18px 45px rgba(0,0,0,0.12);
  }
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    --bg: #061018; --bg-elevated: #0a1a24;
    --surface: rgba(255,255,255,0.06); --surface-hover: rgba(255,255,255,0.11);
    --border: rgba(80,200,220,0.22); --text: #eef6f8; --muted: #8aadb8;
    --cyan: #2ec8e0; --teal: #0a9aaa; --sky: #5ee0f5;
    --header-bg: rgba(6,16,24,0.88); --shadow: 0 22px 55px rgba(0,0,0,0.5);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  font-size: 15px; line-height: 1.5; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background 0.4s, color 0.3s;
  display: flex; flex-direction: column;
}

.bg {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(ellipse 90% 55% at 12% -5%, color-mix(in srgb, var(--cyan) 28%, transparent), transparent 55%),
    radial-gradient(ellipse 70% 50% at 92% 8%, color-mix(in srgb, var(--teal) 18%, transparent), transparent 50%),
    radial-gradient(ellipse 50% 40% at 50% 105%, color-mix(in srgb, var(--sky) 10%, transparent), transparent 50%),
    var(--bg);
  animation: bgShift 18s ease-in-out infinite alternate;
}
@keyframes bgShift {
  0% { filter: hue-rotate(0deg) brightness(1); }
  100% { filter: hue-rotate(8deg) brightness(1.04); }
}
.orb {
  position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.22;
  pointer-events: none; z-index: -1; animation: orbFloat 22s ease-in-out infinite;
}
.orb-1 { width: 280px; height: 280px; background: var(--cyan); top: -90px; left: -70px; }
.orb-2 { width: 220px; height: 220px; background: var(--teal); bottom: 8%; right: -50px; animation-delay: -8s; }
@keyframes orbFloat {
  0%, 100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(20px,-28px) scale(1.05); }
}

/* Header */
.header {
  flex-shrink: 0; height: var(--header-h); z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
}
.logo {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
  font-weight: 900; font-size: 14px; flex-shrink: 0;
}
.logo-img {
  width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
  box-shadow: 0 3px 12px color-mix(in srgb, var(--cyan) 40%, transparent);
}
.logo-text span {
  background: linear-gradient(120deg, var(--text), var(--cyan) 50%, var(--sky));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  background-size: 200% auto; animation: textShine 6s linear infinite;
}
@keyframes textShine {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}
.header-spacer { flex: 1; }
.header-btn {
  width: 38px; height: 38px; border: none; border-radius: 12px;
  background: var(--surface); color: var(--text);
  display: grid; place-items: center; cursor: pointer; transition: all 0.25s;
  border: 1px solid transparent;
}
.header-btn:hover {
  background: var(--surface-hover);
  border-color: color-mix(in srgb, var(--cyan) 30%, transparent);
}
.header-btn svg { width: 18px; height: 18px; }
.track-count-badge {
  font-size: 12px; font-weight: 700; color: var(--cyan);
  background: color-mix(in srgb, var(--cyan) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--cyan) 28%, transparent);
  padding: 5px 12px; border-radius: 999px; white-space: nowrap;
}

/* ===== MAIN LAYOUT ===== */
.main {
  flex: 1; min-height: 0; display: flex; overflow: hidden;
}

/* LEFT: Playlist panel */
.panel-list {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  padding: 12px 14px 12px; overflow: hidden;
}
.search-row { flex-shrink: 0; margin-bottom: 10px; }
.search-box {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 11px 15px; color: var(--text);
  font-size: 14px; font-family: inherit; outline: none; transition: all 0.25s;
}
.search-box:focus {
  border-color: color-mix(in srgb, var(--cyan) 50%, transparent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 12%, transparent);
}
.search-box::placeholder { color: var(--muted); }

.playlist {
  flex: 1; overflow-y: auto; min-height: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
  scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--cyan) 35%, transparent) transparent;
}
.playlist::-webkit-scrollbar { width: 5px; }
.playlist::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--cyan) 35%, transparent); border-radius: 999px;
}

.track-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; cursor: pointer; transition: background 0.15s;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
}
.track-item:last-child { border-bottom: none; }
.track-item:hover { background: var(--surface-hover); }
.track-item.active {
  background: linear-gradient(90deg, color-mix(in srgb, var(--cyan) 16%, transparent), transparent);
  border-left: 3px solid var(--cyan); padding-left: 11px;
}
.track-num {
  width: 24px; text-align: center; font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0;
}
.track-item.active .track-num { color: var(--cyan); }
.track-name {
  flex: 1; font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-item.active .track-name { color: var(--cyan); }
.track-play-icon {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--teal));
  display: grid; place-items: center; flex-shrink: 0;
  opacity: 0; transform: scale(0.7); transition: all 0.2s;
}
.track-item:hover .track-play-icon,
.track-item.active .track-play-icon { opacity: 1; transform: scale(1); }
.track-play-icon svg { width: 11px; height: 11px; fill: #041018; }
.empty-state { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* RIGHT: Player panel (desktop always visible) */
.panel-player {
  display: none;
  width: 340px; flex-shrink: 0;
  border-left: 1px solid var(--border);
  flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 22px; overflow-y: auto;
  background: color-mix(in srgb, var(--surface) 50%, transparent);
}

/* ===== MOBILE POPUP PLAYER ===== */
.popup-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s, visibility 0.3s;
}
.popup-overlay.open { opacity: 1; visibility: visible; }

.popup-player {
  position: fixed; left: 50%; bottom: 0; z-index: 310;
  width: 100%; max-width: 440px;
  transform: translateX(-50%) translateY(110%);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.4);
  padding: 12px 22px 28px;
  transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
  max-height: 92vh; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
}
.popup-overlay.open .popup-player {
  transform: translateX(-50%) translateY(0);
}
.popup-handle {
  width: 40px; height: 4px; border-radius: 99px;
  background: var(--border); margin-bottom: 14px; flex-shrink: 0;
}
.popup-close {
  position: absolute; top: 14px; right: 16px;
  width: 36px; height: 36px; border: none; border-radius: 12px;
  background: var(--surface); color: var(--text); cursor: pointer;
  display: grid; place-items: center; border: 1px solid var(--border);
  transition: all 0.2s;
}
.popup-close:hover { background: var(--surface-hover); color: var(--cyan); }
.popup-close svg { width: 18px; height: 18px; }

/* Shared player UI parts */
.artwork-area {
  position: relative; margin-bottom: 12px;
  width: min(200px, 48vw); aspect-ratio: 1;
}
.panel-player .artwork-area { width: 180px; }
.vinyl-ring {
  position: absolute; inset: -9px; border-radius: 50%;
  border: 2px dashed color-mix(in srgb, var(--cyan) 35%, transparent);
  animation: spin 18s linear infinite; pointer-events: none;
  opacity: 0; transition: opacity 0.5s;
}
.artwork-area.playing .vinyl-ring { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.artwork {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  box-shadow: 0 14px 40px color-mix(in srgb, var(--cyan) 35%, transparent);
  border: 3px solid color-mix(in srgb, var(--cyan) 30%, transparent);
  display: block;
}
.artwork-area.playing .artwork {
  animation: floatArt 5s ease-in-out infinite;
  box-shadow: 0 18px 50px color-mix(in srgb, var(--sky) 45%, transparent);
}
@keyframes floatArt {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.eq {
  display: flex; align-items: flex-end; justify-content: center; gap: 4px;
  height: 24px; margin: 8px 0 4px; opacity: 0; transition: opacity 0.3s;
}
.eq.active { opacity: 1; }
.eq span {
  width: 3.5px; border-radius: 2px;
  background: linear-gradient(180deg, var(--sky), var(--cyan), var(--teal));
  animation: eqBeat 1.1s ease-in-out infinite; transform-origin: bottom;
}
.eq span:nth-child(1) { height: 10px; animation-delay: 0s; }
.eq span:nth-child(2) { height: 18px; animation-delay: 0.1s; }
.eq span:nth-child(3) { height: 24px; animation-delay: 0.2s; }
.eq span:nth-child(4) { height: 14px; animation-delay: 0.08s; }
.eq span:nth-child(5) { height: 20px; animation-delay: 0.16s; }
.eq span:nth-child(6) { height: 12px; animation-delay: 0.26s; }
.eq span:nth-child(7) { height: 17px; animation-delay: 0.12s; }
@keyframes eqBeat {
  0%, 100% { transform: scaleY(0.4); opacity: 0.65; }
  50% { transform: scaleY(1); opacity: 1; }
}

.now-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--cyan); margin-bottom: 3px;
}
.track-title {
  font-size: clamp(16px, 4.5vw, 22px); font-weight: 900; text-align: center;
  line-height: 1.3;
  background: linear-gradient(120deg, var(--text) 5%, var(--cyan) 50%, var(--sky) 95%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  background-size: 200% auto; animation: textShine 7s linear infinite;
  margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: min(320px, 85vw);
}
.panel-player .track-title { max-width: 300px; font-size: 18px; }
.track-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; text-align: center; }

.progress-wrap { width: min(340px, 85vw); margin-bottom: 3px; }
.panel-player .progress-wrap { width: 100%; max-width: 280px; }
.progress-bar {
  height: 9px; background: var(--surface); border-radius: 999px;
  cursor: pointer; position: relative;
  border: 1px solid var(--border);
  touch-action: none;
  transition: box-shadow 0.2s;
}
.progress-bar:hover, .progress-bar.dragging {
  box-shadow: 0 0 16px color-mix(in srgb, var(--cyan) 28%, transparent);
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--sky));
  border-radius: 999px; position: relative;
  pointer-events: none;
}
.progress-thumb {
  position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--sky);
  box-shadow: 0 0 10px var(--cyan), 0 0 0 3px color-mix(in srgb, var(--cyan) 22%, transparent);
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.progress-bar:hover .progress-thumb,
.progress-bar.dragging .progress-thumb { opacity: 1; }

.time-row {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted); margin-top: 5px;
  font-variant-numeric: tabular-nums;
  width: min(340px, 85vw);
}
.panel-player .time-row { width: 100%; max-width: 280px; }

.controls {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 10px; flex-wrap: wrap;
}
.ctrl-btn {
  width: 42px; height: 42px; border: none; border-radius: 13px;
  background: var(--surface); color: var(--text); cursor: pointer;
  display: grid; place-items: center; transition: all 0.25s;
  border: 1px solid var(--border);
}
.ctrl-btn:hover {
  background: var(--surface-hover);
  border-color: color-mix(in srgb, var(--cyan) 40%, transparent);
  color: var(--cyan); transform: scale(1.07);
}
.ctrl-btn svg { width: 18px; height: 18px; fill: currentColor; }
.ctrl-btn.active {
  background: color-mix(in srgb, var(--cyan) 20%, transparent);
  color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 45%, transparent);
}
.ctrl-btn.play-btn {
  width: 56px; height: 56px; border-radius: 18px;
  background: linear-gradient(135deg, var(--cyan), var(--teal));
  color: #041018; border: none;
  box-shadow: 0 6px 22px color-mix(in srgb, var(--cyan) 40%, transparent);
}
.ctrl-btn.play-btn:hover {
  transform: scale(1.07) translateY(-2px);
  box-shadow: 0 10px 30px color-mix(in srgb, var(--sky) 50%, transparent);
  color: #041018;
}
.ctrl-btn.play-btn svg { width: 24px; height: 24px; }

.volume-row {
  display: flex; align-items: center; gap: 8px; margin-top: 12px;
  width: min(240px, 70vw);
}
.panel-player .volume-row { width: 100%; max-width: 220px; }
.volume-row svg { width: 16px; height: 16px; fill: var(--muted); flex-shrink: 0; }
.volume-slider {
  flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
  background: var(--surface); border-radius: 999px; outline: none;
  border: 1px solid var(--border);
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--cyan); cursor: pointer;
  box-shadow: 0 0 8px color-mix(in srgb, var(--cyan) 50%, transparent);
}
.volume-slider::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--cyan); cursor: pointer; border: none;
}

/* Mini bar (mobile only, when list view) */
.mini-bar {
  flex-shrink: 0; height: 58px;
  background: var(--header-bg);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 0 14px;
  cursor: pointer;
  transform: translateY(100%); opacity: 0;
  transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), opacity 0.3s, background 0.25s;
}
.mini-bar.show { transform: translateY(0); opacity: 1; }
.mini-bar:hover { background: color-mix(in srgb, var(--cyan) 6%, var(--header-bg)); }
.mini-art {
  width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
  border: 2px solid color-mix(in srgb, var(--cyan) 30%, transparent);
  flex-shrink: 0;
}
.mini-info { flex: 1; min-width: 0; }
.mini-title {
  font-size: 13px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini-sub { font-size: 11px; color: var(--muted); }
.mini-play {
  width: 36px; height: 36px; border: none; border-radius: 11px;
  background: linear-gradient(135deg, var(--cyan), var(--teal));
  color: #041018; display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
}
.mini-play svg { width: 15px; height: 15px; fill: currentColor; }

/* Settings */
.settings-panel {
  position: fixed; top: calc(var(--header-h) + 8px); right: 12px;
  width: min(280px, calc(100vw - 24px));
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow); z-index: 400; padding: 18px;
  opacity: 0; visibility: hidden; transform: translateY(-12px) scale(0.95);
  transition: all 0.3s cubic-bezier(0.22,1,0.36,1); pointer-events: none;
}
.settings-panel.open {
  opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto;
}
.settings-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;
}
.settings-close {
  width: 28px; height: 28px; border: none; border-radius: 8px; background: var(--surface);
  color: var(--muted); font-size: 16px; cursor: pointer; display: grid; place-items: center;
}
.settings-close:hover { color: var(--text); }
.settings-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; display: block; }
.settings-group { margin-bottom: 14px; }
.settings-group:last-child { margin-bottom: 0; }
.settings-options { display: flex; gap: 6px; }
.settings-options button {
  flex: 1; padding: 10px 6px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 12px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: all 0.25s;
}
.settings-options button:hover { background: var(--surface-hover); }
.settings-options button.active {
  background: linear-gradient(135deg, var(--cyan), var(--teal)); border-color: transparent; color: #041018;
}

/* ===== DESKTOP (>= 900px) ===== */
@media (min-width: 900px) {
  .panel-player {
    display: flex;
  }
  .popup-overlay { display: none !important; }
  .mini-bar { display: none !important; }
  .panel-list { max-width: none; }
  .artwork-area { width: 170px; }
  .ctrl-btn.play-btn { width: 54px; height: 54px; }
  .ctrl-btn { width: 40px; height: 40px; }
}

/* Wide desktop */
@media (min-width: 1100px) {
  .panel-player { width: 380px; }
  .panel-player .artwork-area { width: 200px; }
  .panel-player .track-title { font-size: 20px; }
}

/* Short height on desktop */
@media (min-width: 900px) and (max-height: 700px) {
  .panel-player .artwork-area { width: 130px; margin-bottom: 6px; }
  .panel-player .eq { height: 16px; margin: 4px 0 2px; }
  .panel-player .ctrl-btn.play-btn { width: 48px; height: 48px; }
  .panel-player .ctrl-btn { width: 36px; height: 36px; }
}

@media (max-height: 560px) {
  .popup-player .artwork-area { width: min(120px, 30vw); }
  .popup-player .eq { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<header class="header">
  <a href="oisasi-music.html" class="logo">
    <img class="logo-img" src="oisasi music.jpg" alt="oisasimusic" width="34" height="34">
    <div class="logo-text"><span>oisasimusic</span></div>
  </a>
  <div class="header-spacer"></div>
  <div class="track-count-badge" id="trackCount">40 曲</div>
  <button class="header-btn" id="settingsBtn" aria-label="設定" title="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-title">
    <span data-i18n="settings">設定</span>
    <button class="settings-close" id="settingsClose">×</button>
  </div>
  <div class="settings-group">
    <span class="settings-label" data-i18n="theme">テーマ</span>
    <div class="settings-options" id="themeOptions">
      <button data-value="auto" class="active" data-i18n="auto">自動</button>
      <button data-value="dark" data-i18n="dark">ダーク</button>
      <button data-value="light" data-i18n="light">ライト</button>
    </div>
  </div>
  <div class="settings-group">
    <span class="settings-label" data-i18n="language">言語</span>
    <div class="settings-options" id="langOptions">
      <button data-value="auto" class="active" data-i18n="auto">自動</button>
      <button data-value="ja">日本語</button>
      <button data-value="en">English</button>
    </div>
  </div>
</div>

<div class="main">
  <!-- LEFT: Playlist -->
  <div class="panel-list">
    <div class="search-row">
      <input type="text" class="search-box" id="searchBox" placeholder="曲を検索..." data-i18n-placeholder="search_placeholder">
    </div>
    <div class="playlist" id="playlist"></div>
  </div>

  <!-- RIGHT: Desktop player (always visible on PC) -->
  <div class="panel-player" id="panelPlayer">
    <div class="artwork-area" id="artworkAreaDesk">
      <div class="vinyl-ring"></div>
      <img class="artwork" src="oisasi music.jpg" alt="artwork">
    </div>
    <div class="eq" id="eqDesk" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="now-label" data-i18n="now_playing">Now Playing</div>
    <div class="track-title" id="trackTitleDesk">曲を選択</div>
    <div class="track-meta" id="trackMetaDesk">Oisasi Music</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBarDesk">
        <div class="progress-fill" id="progressFillDesk"><div class="progress-thumb"></div></div>
      </div>
    </div>
    <div class="time-row">
      <span id="currentTimeDesk">0:00</span>
      <span id="durationDesk">0:00</span>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtnDesk" title="シャッフル"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button class="ctrl-btn" id="prevBtnDesk" title="前の曲"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ctrl-btn play-btn" id="playBtnDesk" title="再生"><svg id="playIconDesk" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctrl-btn" id="nextBtnDesk" title="次の曲"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="ctrl-btn" id="repeatBtnDesk" title="リピート"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
    <div class="volume-row">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <input type="range" class="volume-slider" id="volumeSliderDesk" min="0" max="1" step="0.01" value="0.85">
    </div>
  </div>
</div>

<!-- Mobile mini bar -->
<div class="mini-bar" id="miniBar">
  <img class="mini-art" src="oisasi music.jpg" alt="">
  <div class="mini-info">
    <div class="mini-title" id="miniTitle">—</div>
    <div class="mini-sub">Oisasi Music</div>
  </div>
  <button class="mini-play" id="miniPlayBtn" aria-label="再生">
    <svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<!-- Mobile popup player -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-player" id="popupPlayer">
    <div class="popup-handle"></div>
    <button class="popup-close" id="popupClose" aria-label="閉じる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="artwork-area" id="artworkAreaMob">
      <div class="vinyl-ring"></div>
      <img class="artwork" src="oisasi music.jpg" alt="artwork">
    </div>
    <div class="eq" id="eqMob" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="now-label" data-i18n="now_playing">Now Playing</div>
    <div class="track-title" id="trackTitleMob">—</div>
    <div class="track-meta" id="trackMetaMob">Oisasi Music</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBarMob">
        <div class="progress-fill" id="progressFillMob"><div class="progress-thumb"></div></div>
      </div>
    </div>
    <div class="time-row">
      <span id="currentTimeMob">0:00</span>
      <span id="durationMob">0:00</span>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtnMob" title="シャッフル"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button class="ctrl-btn" id="prevBtnMob" title="前の曲"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="ctrl-btn play-btn" id="playBtnMob" title="再生"><svg id="playIconMob" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctrl-btn" id="nextBtnMob" title="次の曲"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="ctrl-btn" id="repeatBtnMob" title="リピート"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
    <div class="volume-row">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <input type="range" class="volume-slider" id="volumeSliderMob" min="0" max="1" step="0.01" value="0.85">
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  const html = document.documentElement;
  const i18n = {
    ja: { settings:'設定', theme:'テーマ', language:'言語', auto:'自動', dark:'ダーク', light:'ライト', now_playing:'Now Playing', search_placeholder:'曲を検索...', tracks_unit:'曲' },
    en: { settings:'Settings', theme:'Theme', language:'Language', auto:'Auto', dark:'Dark', light:'Light', now_playing:'Now Playing', search_placeholder:'Search tracks...', tracks_unit:'tracks' }
  };
  function resolveLang(pref) {
    if (pref === 'ja' || pref === 'en') return pref;
    return (navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  }
  function applyLang(pref) {
    localStorage.setItem('oisasi-lang', pref);
    const lang = resolveLang(pref);
    html.setAttribute('lang', lang);
    document.querySelectorAll('#langOptions button').forEach(btn => btn.classList.toggle('active', btn.dataset.value === pref));
    const t = i18n[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (t[k] != null) el.textContent = t[k]; });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if (t[k] != null) el.placeholder = t[k]; });
    if (typeof window.updateTrackCount === 'function') window.updateTrackCount();
  }
  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    localStorage.setItem('oisasi-theme', theme);
    document.querySelectorAll('#themeOptions button').forEach(btn => btn.classList.toggle('active', btn.dataset.value === theme));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      if (theme === 'light') meta.content = '#f0f7fa';
      else if (theme === 'dark') meta.content = '#061820';
      else meta.content = window.matchMedia('(prefers-color-scheme: light)').matches ? '#f0f7fa' : '#061820';
    }
  }
  applyTheme(localStorage.getItem('oisasi-theme') || 'auto');
  applyLang(localStorage.getItem('oisasi-lang') || 'auto');
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (html.getAttribute('data-theme') === 'auto') applyTheme('auto');
  });

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  settingsBtn.addEventListener('click', e => { e.stopPropagation(); settingsPanel.classList.toggle('open'); });
  document.getElementById('settingsClose').addEventListener('click', () => settingsPanel.classList.remove('open'));
  document.addEventListener('click', e => {
    if (settingsPanel.classList.contains('open') && !settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) settingsPanel.classList.remove('open');
  });

  document.getElementById('themeOptions').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyTheme(b.dataset.value); });
  document.getElementById('langOptions').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyLang(b.dataset.value); });

  const tracks = [
    { title: "oisasi osoj", file: "oisasi osoj.wav" },
    { title: "oisasinews", file: "oisasinews.mp3" },
    { title: "Oi-Spa", file: "Oi-Spa.mp3" },
    { title: "ONTのホテル", file: "ONTのホテル.m4a" },
    { title: "ONTの歌", file: "ONTの歌.mp3" },
    { title: "Orua Shopping Day", file: "Orua Shopping Day.mp3" },
    { title: "ORUA STORE", file: "ORUA STORE.mp3" },
    { title: "おいさしCtrl", file: "おいさしCtrl.mp3" },
    { title: "おいさしPOP", file: "おいさしＰＯＰ.mp3" },
    { title: "おいさしアクセル", file: "おいさしアクセル.mp3" },
    { title: "おいさしアップデート", file: "おいさしアップデート.mp3" },
    { title: "おいさしエネルギー", file: "おいさしエネルギー.mp3" },
    { title: "おいさしクッキング", file: "おいさしクッキング.mp3" },
    { title: "おいさしサービス", file: "おいさしサービス.mp3" },
    { title: "おいさしジャンプ", file: "おいさしジャンプ.mp3" },
    { title: "おいさしシンプル", file: "おいさしシンプル.mp3" },
    { title: "おいさしタッチパネル", file: "おいさしタッチパネル.mp3" },
    { title: "おいさしダンス", file: "おいさしダンス.mp3" },
    { title: "おいさしテレビ", file: "おいさしテレビ.m4a" },
    { title: "おいさしとおいじい", file: "おいさしとおいじぃ.mp3" },
    { title: "おいさしファイナル", file: "おいさしファイナル.mp3" },
    { title: "おいさしポーズ", file: "おいさしポーズ.mp3" },
    { title: "おいさし音頭", file: "おいさし音頭.mp3" },
    { title: "おいさし時代", file: "おいさし時代.mp3" },
    { title: "おいさし節", file: "おいさし節.mp3" },
    { title: "おいさし体操", file: "おいさし体操.m4a" },
    { title: "おいさし大作戦", file: "おいさし大作戦.mp3" },
    { title: "おいさし大作戦2", file: "おいさし大作戦2.mp3" },
    { title: "おいさし美味しい", file: "おいさし美味しい.mp3" },
    { title: "おいじい魔女", file: "おいじぃ魔女.mp3" },
    { title: "おいじい魔女のヤバい雑学の歌", file: "おいじぃ魔女のヤバい雑学の歌.mp3" },
    { title: "おいじい魔女音頭", file: "おいじぃ魔女音頭.mp3" },
    { title: "きらめきダッシュ", file: "きらめきダッシュ.mp3" },
    { title: "げんきおいさし", file: "げんきおいさし.mp3" },
    { title: "ばっくっそん!", file: "ばっくっそん！.mp3" },
    { title: "ゆきだるまのベル", file: "ゆきだるまのベル.mp3" },
    { title: "夏おいさし", file: "夏おいさし.mp3" },
    { title: "急ぐ焦るおいさし", file: "急ぐ焦るおいさし.mp3" },
    { title: "秋おいさし", file: "秋おいさし.m4a" },
    { title: "新おいさし", file: "新おいさし.mp3" }
  ];

  const audio = document.getElementById("audio");
  const playlistEl = document.getElementById("playlist");
  const trackCountEl = document.getElementById("trackCount");
  const searchBox = document.getElementById("searchBox");
  const popupOverlay = document.getElementById("popupOverlay");
  const miniBar = document.getElementById("miniBar");
  const miniTitle = document.getElementById("miniTitle");
  const miniPlayBtn = document.getElementById("miniPlayBtn");
  const miniPlayIcon = document.getElementById("miniPlayIcon");

  // Dual UI refs
  const ui = {
    desk: {
      title: document.getElementById("trackTitleDesk"),
      meta: document.getElementById("trackMetaDesk"),
      fill: document.getElementById("progressFillDesk"),
      bar: document.getElementById("progressBarDesk"),
      cur: document.getElementById("currentTimeDesk"),
      dur: document.getElementById("durationDesk"),
      playIcon: document.getElementById("playIconDesk"),
      art: document.getElementById("artworkAreaDesk"),
      eq: document.getElementById("eqDesk"),
      shuffle: document.getElementById("shuffleBtnDesk"),
      prev: document.getElementById("prevBtnDesk"),
      play: document.getElementById("playBtnDesk"),
      next: document.getElementById("nextBtnDesk"),
      repeat: document.getElementById("repeatBtnDesk"),
      vol: document.getElementById("volumeSliderDesk")
    },
    mob: {
      title: document.getElementById("trackTitleMob"),
      meta: document.getElementById("trackMetaMob"),
      fill: document.getElementById("progressFillMob"),
      bar: document.getElementById("progressBarMob"),
      cur: document.getElementById("currentTimeMob"),
      dur: document.getElementById("durationMob"),
      playIcon: document.getElementById("playIconMob"),
      art: document.getElementById("artworkAreaMob"),
      eq: document.getElementById("eqMob"),
      shuffle: document.getElementById("shuffleBtnMob"),
      prev: document.getElementById("prevBtnMob"),
      play: document.getElementById("playBtnMob"),
      next: document.getElementById("nextBtnMob"),
      repeat: document.getElementById("repeatBtnMob"),
      vol: document.getElementById("volumeSliderMob")
    }
  };

  let currentIndex = -1, isPlaying = false, isShuffle = false, repeatMode = 0;
  let filteredTracks = [...tracks], playOrder = [], isDragging = false;

  function isDesktop() { return window.matchMedia("(min-width: 900px)").matches; }

  window.updateTrackCount = function () {
    const lang = resolveLang(localStorage.getItem('oisasi-lang') || 'auto');
    trackCountEl.textContent = tracks.length + ' ' + ((i18n[lang] && i18n[lang].tracks_unit) || '曲');
  };
  window.updateTrackCount();
  audio.volume = 0.85;
  renderPlaylist();

  // Popup
  function openPopup() {
    if (isDesktop()) return;
    popupOverlay.classList.add("open");
    miniBar.classList.remove("show");
  }
  function closePopup() {
    popupOverlay.classList.remove("open");
    if (currentIndex >= 0 && !isDesktop()) miniBar.classList.add("show");
  }
  document.getElementById("popupClose").addEventListener("click", closePopup);
  popupOverlay.addEventListener("click", e => { if (e.target === popupOverlay) closePopup(); });
  miniBar.addEventListener("click", e => { if (!e.target.closest("#miniPlayBtn")) openPopup(); });

  function renderPlaylist() {
    playlistEl.innerHTML = "";
    if (!filteredTracks.length) {
      playlistEl.innerHTML = '<div class="empty-state">該当する曲がありません</div>';
      return;
    }
    filteredTracks.forEach((track, i) => {
      const oi = tracks.indexOf(track);
      const item = document.createElement("div");
      item.className = "track-item" + (oi === currentIndex ? " active" : "");
      item.innerHTML = '<div class="track-num">' + String(i+1).padStart(2,"0") + '</div><div class="track-name">' + track.title + '</div><div class="track-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>';
      item.addEventListener("click", () => {
        playTrack(oi);
        if (!isDesktop()) openPopup();
      });
      playlistEl.appendChild(item);
    });
  }

  function setTitles(name) {
    ui.desk.title.textContent = name;
    ui.mob.title.textContent = name;
    miniTitle.textContent = name;
    ui.desk.meta.textContent = "Oisasi Music Collection";
    ui.mob.meta.textContent = "Oisasi Music Collection";
  }

  function playTrack(index) {
    if (index < 0 || index >= tracks.length) return;
    currentIndex = index;
    const track = tracks[index];
    audio.src = track.file;
    setTitles(track.title);
    audio.play().then(() => { isPlaying = true; updatePlayUI(); }).catch(() => {
      setTitles(track.title + " （ファイルなし）");
      isPlaying = false; updatePlayUI();
    });
    renderPlaylist();
  }

  function togglePlay() {
    if (currentIndex === -1) {
      playTrack(0);
      if (!isDesktop()) openPopup();
      return;
    }
    if (isPlaying) { audio.pause(); isPlaying = false; }
    else { audio.play().then(() => { isPlaying = true; }).catch(() => {}); }
    updatePlayUI();
  }

  function updatePlayUI() {
    const icon = isPlaying ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    ui.desk.playIcon.innerHTML = icon;
    ui.mob.playIcon.innerHTML = icon;
    miniPlayIcon.innerHTML = icon;
    [ui.desk.art, ui.mob.art].forEach(el => el.classList.toggle("playing", isPlaying));
    [ui.desk.eq, ui.mob.eq].forEach(el => el.classList.toggle("active", isPlaying));
    if (!isDesktop() && currentIndex >= 0 && !popupOverlay.classList.contains("open")) {
      miniBar.classList.add("show");
    }
  }

  function getNextIndex() {
    if (repeatMode === 2) return currentIndex;
    if (isShuffle) {
      if (!playOrder.length) {
        playOrder = [...Array(tracks.length).keys()].filter(i => i !== currentIndex);
        for (let i = playOrder.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [playOrder[i], playOrder[j]] = [playOrder[j], playOrder[i]];
        }
      }
      return playOrder.length ? playOrder.shift() : currentIndex;
    }
    const next = currentIndex + 1;
    if (next >= tracks.length) return repeatMode === 1 ? 0 : -1;
    return next;
  }
  function playNext() {
    if (currentIndex === -1) { playTrack(0); if (!isDesktop()) openPopup(); return; }
    const next = getNextIndex();
    if (next === -1) { isPlaying = false; updatePlayUI(); return; }
    playTrack(next);
  }
  function playPrev() {
    if (currentIndex === -1) { playTrack(0); if (!isDesktop()) openPopup(); return; }
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    playTrack((currentIndex - 1 + tracks.length) % tracks.length);
  }

  // Wire both UIs
  [ui.desk.play, ui.mob.play].forEach(b => b.addEventListener("click", togglePlay));
  miniPlayBtn.addEventListener("click", e => { e.stopPropagation(); togglePlay(); });
  [ui.desk.next, ui.mob.next].forEach(b => b.addEventListener("click", playNext));
  [ui.desk.prev, ui.mob.prev].forEach(b => b.addEventListener("click", playPrev));
  [ui.desk.shuffle, ui.mob.shuffle].forEach(b => b.addEventListener("click", () => {
    isShuffle = !isShuffle;
    ui.desk.shuffle.classList.toggle("active", isShuffle);
    ui.mob.shuffle.classList.toggle("active", isShuffle);
    playOrder = [];
  }));
  [ui.desk.repeat, ui.mob.repeat].forEach(b => b.addEventListener("click", () => {
    repeatMode = (repeatMode + 1) % 3;
    const on = repeatMode > 0;
    ui.desk.repeat.classList.toggle("active", on);
    ui.mob.repeat.classList.toggle("active", on);
    const t = repeatMode === 2 ? "1曲リピート" : repeatMode === 1 ? "全曲リピート" : "リピート";
    ui.desk.repeat.title = t; ui.mob.repeat.title = t;
  }));
  function syncVol(v) { audio.volume = v; ui.desk.vol.value = v; ui.mob.vol.value = v; }
  ui.desk.vol.addEventListener("input", () => syncVol(ui.desk.vol.value));
  ui.mob.vol.addEventListener("input", () => syncVol(ui.mob.vol.value));

  // Seek for both bars
  function bindSeek(bar, fill, curEl) {
    function seek(e) {
      if (!audio.duration) return;
      const rect = bar.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
      fill.style.width = (ratio * 100) + "%";
      ui.desk.fill.style.width = fill.style.width;
      ui.mob.fill.style.width = fill.style.width;
      const t = formatTime(audio.currentTime);
      ui.desk.cur.textContent = t; ui.mob.cur.textContent = t;
    }
    bar.addEventListener("mousedown", e => { isDragging = true; bar.classList.add("dragging"); seek(e); });
    bar.addEventListener("touchstart", e => { isDragging = true; bar.classList.add("dragging"); seek(e); }, { passive: true });
    document.addEventListener("mousemove", e => { if (isDragging) seek(e); });
    document.addEventListener("touchmove", e => { if (isDragging) seek(e); }, { passive: true });
    document.addEventListener("mouseup", () => { isDragging = false; bar.classList.remove("dragging"); });
    document.addEventListener("touchend", () => { isDragging = false; bar.classList.remove("dragging"); });
  }
  bindSeek(ui.desk.bar, ui.desk.fill, ui.desk.cur);
  bindSeek(ui.mob.bar, ui.mob.fill, ui.mob.cur);

  audio.addEventListener("timeupdate", () => {
    if (!audio.duration || isDragging) return;
    const pct = (audio.currentTime / audio.duration) * 100 + "%";
    ui.desk.fill.style.width = pct; ui.mob.fill.style.width = pct;
    const t = formatTime(audio.currentTime);
    ui.desk.cur.textContent = t; ui.mob.cur.textContent = t;
  });
  audio.addEventListener("loadedmetadata", () => {
    const d = formatTime(audio.duration);
    ui.desk.dur.textContent = d; ui.mob.dur.textContent = d;
  });
  audio.addEventListener("ended", () => {
    if (repeatMode === 2) { audio.currentTime = 0; audio.play(); }
    else playNext();
  });
  audio.addEventListener("play", () => { isPlaying = true; updatePlayUI(); });
  audio.addEventListener("pause", () => { isPlaying = false; updatePlayUI(); });

  searchBox.addEventListener("input", () => {
    const q = searchBox.value.trim().toLowerCase();
    filteredTracks = q ? tracks.filter(t => t.title.toLowerCase().includes(q)) : [...tracks];
    renderPlaylist();
  });

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); playNext(); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); playPrev(); }
    else if (e.code === "ArrowUp") { e.preventDefault(); syncVol(Math.min(1, +audio.volume + 0.05)); }
    else if (e.code === "ArrowDown") { e.preventDefault(); syncVol(Math.max(0, +audio.volume - 0.05)); }
    else if (e.code === "Escape") {
      settingsPanel.classList.remove("open");
      closePopup();
    }
  });

  function formatTime(sec) {
    if (isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ":" + String(s).padStart(2, "0");
  }
})();
</script>
</body>
</html>
