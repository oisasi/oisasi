<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>おいさしミュージック プレイヤー | Oisasi Music Player</title>
<meta name="description" content="oisasimusic公式ミュージックプレイヤー">
<meta name="theme-color" content="#061820">
<link rel="icon" type="image/jpeg" href="oisasi music.jpg">
<link rel="apple-touch-icon" href="oisasi music.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  --bg: #050d12;
  --bg-elevated: #0a1520;
  --surface: rgba(255,255,255,0.055);
  --surface-hover: rgba(255,255,255,0.1);
  --border: rgba(80,200,220,0.2);
  --text: #eef6f8;
  --muted: #7a9aa8;
  --cyan: #2ec8e0;
  --teal: #0a9aaa;
  --sky: #5ee0f5;
  --header-bg: rgba(5,13,18,0.9);
  --shadow: 0 24px 80px rgba(0,0,0,0.55);
  --radius: 20px;
  --header-h: 56px;
}
[data-theme="light"] {
  --bg: #eef5f8;
  --bg-elevated: #ffffff;
  --surface: rgba(10,100,120,0.05);
  --surface-hover: rgba(10,100,120,0.09);
  --border: rgba(10,140,160,0.18);
  --text: #15252c;
  --muted: #5a7080;
  --cyan: #0a8a9a;
  --teal: #087a88;
  --sky: #0a9aaa;
  --header-bg: rgba(255,255,255,0.94);
  --shadow: 0 20px 50px rgba(0,0,0,0.12);
}
@media (prefers-color-scheme: light) {
  [data-theme="auto"] {
    --bg: #eef5f8; --bg-elevated: #ffffff;
    --surface: rgba(10,100,120,0.05); --surface-hover: rgba(10,100,120,0.09);
    --border: rgba(10,140,160,0.18); --text: #15252c; --muted: #5a7080;
    --cyan: #0a8a9a; --teal: #087a88; --sky: #0a9aaa;
    --header-bg: rgba(255,255,255,0.94); --shadow: 0 20px 50px rgba(0,0,0,0.12);
  }
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    --bg: #050d12; --bg-elevated: #0a1520;
    --surface: rgba(255,255,255,0.055); --surface-hover: rgba(255,255,255,0.1);
    --border: rgba(80,200,220,0.2); --text: #eef6f8; --muted: #7a9aa8;
    --cyan: #2ec8e0; --teal: #0a9aaa; --sky: #5ee0f5;
    --header-bg: rgba(5,13,18,0.9); --shadow: 0 24px 80px rgba(0,0,0,0.55);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  font-size: 15px; line-height: 1.5; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background 0.4s, color 0.3s;
  display: flex; flex-direction: column;
}

.bg {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(ellipse 100% 60% at 20% -10%, color-mix(in srgb, var(--cyan) 22%, transparent), transparent 55%),
    radial-gradient(ellipse 80% 50% at 90% 10%, color-mix(in srgb, var(--teal) 14%, transparent), transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 110%, color-mix(in srgb, var(--sky) 8%, transparent), transparent 50%),
    var(--bg);
}

/* Header */
.header {
  flex-shrink: 0; height: var(--header-h); z-index: 100;
  background: var(--header-bg);
  backdrop-filter: blur(20px) saturate(1.3);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 14px;
}
.logo {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
  font-weight: 900; font-size: 15px; flex-shrink: 0;
}
.logo-img {
  width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
  box-shadow: 0 3px 14px color-mix(in srgb, var(--cyan) 40%, transparent);
}
.logo-text span {
  background: linear-gradient(120deg, var(--text), var(--cyan) 50%, var(--sky));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  background-size: 200% auto; animation: textShine 7s linear infinite;
}
@keyframes textShine {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}
.header-spacer { flex: 1; }
.header-btn {
  width: 40px; height: 40px; border: none; border-radius: 12px;
  background: var(--surface); color: var(--text);
  display: grid; place-items: center; cursor: pointer; transition: all 0.25s;
  border: 1px solid transparent;
}
.header-btn:hover, .header-btn:focus-visible {
  background: var(--surface-hover);
  border-color: color-mix(in srgb, var(--cyan) 35%, transparent);
  outline: none;
}
.header-btn svg { width: 18px; height: 18px; }
.track-count-badge {
  font-size: 13px; font-weight: 700; color: var(--cyan);
  background: color-mix(in srgb, var(--cyan) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--cyan) 28%, transparent);
  padding: 6px 14px; border-radius: 999px; white-space: nowrap;
}

/* List */
.panel-list {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding: 14px 18px 12px; overflow: hidden;
  max-width: 900px; margin: 0 auto; width: 100%;
}
.search-row { flex-shrink: 0; margin-bottom: 12px; }
.search-box {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 13px 18px; color: var(--text);
  font-size: 15px; font-family: inherit; outline: none; transition: all 0.25s;
}
.search-box:focus {
  border-color: color-mix(in srgb, var(--cyan) 50%, transparent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 12%, transparent);
}
.search-box::placeholder { color: var(--muted); }

.playlist {
  flex: 1; overflow-y: auto; min-height: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
  scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--cyan) 35%, transparent) transparent;
}
.playlist::-webkit-scrollbar { width: 6px; }
.playlist::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--cyan) 35%, transparent); border-radius: 999px;
}

.track-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; cursor: pointer; transition: background 0.15s;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
}
.track-item:last-child { border-bottom: none; }
.track-item:hover, .track-item:focus-visible {
  background: var(--surface-hover); outline: none;
}
.track-item.active {
  background: linear-gradient(90deg, color-mix(in srgb, var(--cyan) 16%, transparent), transparent);
  border-left: 3px solid var(--cyan); padding-left: 15px;
}
.track-num {
  width: 28px; text-align: center; font-size: 14px; color: var(--muted);
  font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0;
}
.track-item.active .track-num { color: var(--cyan); }
.track-name {
  flex: 1; font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-item.active .track-name { color: var(--cyan); }
.track-play-icon {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--teal));
  display: grid; place-items: center; flex-shrink: 0;
  opacity: 0; transform: scale(0.7); transition: all 0.2s;
}
.track-item:hover .track-play-icon,
.track-item.active .track-play-icon { opacity: 1; transform: scale(1); }
.track-play-icon svg { width: 13px; height: 13px; fill: #041018; }
.empty-state { padding: 48px 16px; text-align: center; color: var(--muted); font-size: 15px; }

/* ===== TV MEDIA PLAYER POPUP ===== */
.popup-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  opacity: 0; visibility: hidden;
  transition: opacity 0.35s, visibility 0.35s;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.popup-overlay.open { opacity: 1; visibility: visible; }

.popup-player {
  width: min(1100px, 96vw);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 28px;
  box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--cyan) 8%, transparent);
  position: relative;
  transform: scale(0.94) translateY(12px);
  opacity: 0;
  transition: transform 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.3s;
  overflow: hidden;
}
.popup-overlay.open .popup-player {
  transform: scale(1) translateY(0);
  opacity: 1;
}

/* Ambient glow behind art */
.popup-player::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 50% 70% at 18% 50%, color-mix(in srgb, var(--cyan) 12%, transparent), transparent 70%),
    radial-gradient(ellipse 40% 50% at 85% 80%, color-mix(in srgb, var(--teal) 8%, transparent), transparent 60%);
  pointer-events: none;
}

.popup-close {
  position: absolute; top: 18px; right: 18px; z-index: 10;
  width: 44px; height: 44px; border: none; border-radius: 14px;
  background: var(--surface); color: var(--text); cursor: pointer;
  display: grid; place-items: center; border: 1px solid var(--border);
  transition: all 0.25s;
}
.popup-close:hover, .popup-close:focus-visible {
  background: var(--surface-hover); color: var(--cyan);
  transform: rotate(90deg); outline: none;
}
.popup-close svg { width: 20px; height: 20px; }

.popup-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 28px 28px;
  position: relative;
  gap: 0;
}

/* Left: big art */
.popup-left {
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0;
  text-align: center;
  max-width: 100%;
}
.popup-left .now-label { margin-top: 14px; }
.popup-left .track-title { margin-top: 2px; }
.popup-left .track-meta { margin-bottom: 0; }
.artwork-area {
  position: relative;
  width: min(220px, 55vw);
  aspect-ratio: 1;
}
.vinyl-ring {
  position: absolute; inset: -12px; border-radius: 50%;
  border: 2px dashed color-mix(in srgb, var(--cyan) 30%, transparent);
  animation: spin 22s linear infinite; pointer-events: none;
  opacity: 0; transition: opacity 0.5s;
}
.artwork-area.playing .vinyl-ring { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.artwork {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  box-shadow:
    0 20px 60px color-mix(in srgb, var(--cyan) 30%, transparent),
    0 0 0 4px color-mix(in srgb, var(--cyan) 18%, transparent);
  display: block;
}
.artwork-area.playing .artwork {
  animation: floatArt 6s ease-in-out infinite;
  box-shadow:
    0 24px 70px color-mix(in srgb, var(--sky) 40%, transparent),
    0 0 0 4px color-mix(in srgb, var(--cyan) 25%, transparent);
}
@keyframes floatArt {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.eq {
  display: flex; align-items: flex-end; justify-content: center; gap: 5px;
  height: 28px; margin-top: 16px; opacity: 0; transition: opacity 0.3s;
}
.eq.active { opacity: 1; }
.eq span {
  width: 4px; border-radius: 2px;
  background: linear-gradient(180deg, var(--sky), var(--cyan), var(--teal));
  animation: eqBeat 1.1s ease-in-out infinite; transform-origin: bottom;
}
.eq span:nth-child(1) { height: 12px; animation-delay: 0s; }
.eq span:nth-child(2) { height: 22px; animation-delay: 0.1s; }
.eq span:nth-child(3) { height: 28px; animation-delay: 0.2s; }
.eq span:nth-child(4) { height: 16px; animation-delay: 0.08s; }
.eq span:nth-child(5) { height: 24px; animation-delay: 0.16s; }
.eq span:nth-child(6) { height: 14px; animation-delay: 0.26s; }
.eq span:nth-child(7) { height: 20px; animation-delay: 0.12s; }
@keyframes eqBeat {
  0%, 100% { transform: scaleY(0.35); opacity: 0.6; }
  50% { transform: scaleY(1); opacity: 1; }
}

/* Right: info + controls */
.popup-right {
  width: 100%;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  margin-top: 22px;
  gap: 0;
}
.now-label {
  font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--cyan); margin-bottom: 6px;
}
.track-title {
  font-size: clamp(20px, 4.5vw, 32px); font-weight: 900; text-align: center;
  line-height: 1.25;
  background: linear-gradient(120deg, var(--text) 10%, var(--cyan) 50%, var(--sky) 90%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  background-size: 200% auto; animation: textShine 8s linear infinite;
  margin-bottom: 4px;
  max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.track-meta {
  font-size: 14px; color: var(--muted); margin-bottom: 22px; text-align: center;
}

/* Wide progress */
.progress-wrap { width: 100%; max-width: 640px; margin-bottom: 4px; }
.progress-bar {
  height: 12px; background: var(--surface); border-radius: 999px;
  cursor: pointer; position: relative;
  border: 1px solid var(--border);
  touch-action: none;
  transition: box-shadow 0.2s, height 0.15s;
}
.progress-bar:hover, .progress-bar.dragging {
  height: 14px;
  box-shadow: 0 0 24px color-mix(in srgb, var(--cyan) 30%, transparent);
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--sky));
  border-radius: 999px; position: relative;
  pointer-events: none;
  box-shadow: 0 0 16px color-mix(in srgb, var(--cyan) 40%, transparent);
}
.progress-thumb {
  position: absolute; right: -9px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 14px var(--cyan), 0 0 0 4px color-mix(in srgb, var(--cyan) 30%, transparent);
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.progress-bar:hover .progress-thumb,
.progress-bar.dragging .progress-thumb { opacity: 1; }

.time-row {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--muted); margin-top: 8px;
  font-variant-numeric: tabular-nums;
  width: 100%; max-width: 640px;
  font-weight: 600;
}

/* Large TV-style controls */
.controls {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-top: 22px; flex-wrap: wrap;
}
.ctrl-btn {
  width: 52px; height: 52px; border: none; border-radius: 16px;
  background: var(--surface); color: var(--text); cursor: pointer;
  display: grid; place-items: center; transition: all 0.25s;
  border: 1px solid var(--border);
}
.ctrl-btn:hover, .ctrl-btn:focus-visible {
  background: var(--surface-hover);
  border-color: color-mix(in srgb, var(--cyan) 45%, transparent);
  color: var(--cyan); transform: scale(1.08); outline: none;
}
.ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }
.ctrl-btn.active {
  background: color-mix(in srgb, var(--cyan) 18%, transparent);
  color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 50%, transparent);
}
.ctrl-btn.play-btn {
  width: 76px; height: 76px; border-radius: 24px;
  background: linear-gradient(135deg, var(--cyan), var(--teal));
  color: #041018; border: none;
  box-shadow: 0 10px 36px color-mix(in srgb, var(--cyan) 45%, transparent);
}
.ctrl-btn.play-btn:hover, .ctrl-btn.play-btn:focus-visible {
  transform: scale(1.08) translateY(-2px);
  box-shadow: 0 14px 44px color-mix(in srgb, var(--sky) 55%, transparent);
  color: #041018; outline: none;
}
.ctrl-btn.play-btn svg { width: 32px; height: 32px; }

.volume-row {
  display: flex; align-items: center; gap: 10px; margin-top: 18px;
  width: min(280px, 70vw);
}

/* Playlist bar + track cards */
.popup-playlist-bar {
  width: 100%;
  margin-top: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.playlist-select {
  flex: 1;
  min-width: 120px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 9px 12px;
  outline: none;
  cursor: pointer;
}
.playlist-select:focus {
  border-color: color-mix(in srgb, var(--cyan) 45%, transparent);
}
.playlist-bar-btn {
  height: 38px;
  padding: 0 12px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.playlist-bar-btn:hover {
  background: var(--surface-hover);
  border-color: color-mix(in srgb, var(--cyan) 40%, transparent);
  color: var(--cyan);
}
.playlist-bar-btn.primary {
  background: linear-gradient(135deg, var(--cyan), var(--teal));
  border-color: transparent;
  color: #041018;
}
.playlist-bar-btn.primary:hover {
  filter: brightness(1.08);
  color: #041018;
}

/* Popup track list — horizontal 5 cards (lower) */
.popup-tracklist {
  width: 100%;
  margin-top: 28px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.popup-track-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 10px 6px;
  min-height: 64px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  text-align: center;
  overflow: hidden;
}
.popup-track-item:hover {
  background: var(--surface-hover);
  border-color: color-mix(in srgb, var(--cyan) 40%, transparent);
  transform: translateY(-2px);
}
.popup-track-item.active {
  background: linear-gradient(145deg, color-mix(in srgb, var(--cyan) 22%, transparent), color-mix(in srgb, var(--teal) 12%, transparent));
  border-color: color-mix(in srgb, var(--cyan) 55%, transparent);
  color: var(--cyan);
  box-shadow: 0 4px 16px color-mix(in srgb, var(--cyan) 20%, transparent);
}
.popup-track-item .pt-num {
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700;
}
.popup-track-item.active .pt-num { color: var(--cyan); }
.popup-track-item .pt-name {
  font-size: 11.5px; font-weight: 600; line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  width: 100%;
  word-break: break-all;
}
.volume-row svg { width: 20px; height: 20px; fill: var(--muted); flex-shrink: 0; }
.volume-slider {
  flex: 1; height: 6px; -webkit-appearance: none; appearance: none;
  background: var(--surface); border-radius: 999px; outline: none;
  border: 1px solid var(--border);
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--cyan); cursor: pointer;
  box-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 50%, transparent);
}
.volume-slider::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--cyan); cursor: pointer; border: none;
}

/* Mini bar */
.mini-bar {
  flex-shrink: 0; height: 64px;
  background: var(--header-bg);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px; padding: 0 18px;
  cursor: pointer;
  transform: translateY(100%); opacity: 0;
  transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), opacity 0.3s, background 0.25s;
}
.mini-bar.show { transform: translateY(0); opacity: 1; }
.mini-bar:hover { background: color-mix(in srgb, var(--cyan) 6%, var(--header-bg)); }
.mini-art {
  width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
  border: 2px solid color-mix(in srgb, var(--cyan) 30%, transparent);
  flex-shrink: 0;
}
.mini-info { flex: 1; min-width: 0; }
.mini-title {
  font-size: 14px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini-sub { font-size: 12px; color: var(--muted); }
.mini-play {
  width: 42px; height: 42px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--cyan), var(--teal));
  color: #041018; display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
}
.mini-play svg { width: 18px; height: 18px; fill: currentColor; }

/* Settings */
.settings-panel {
  position: fixed; top: calc(var(--header-h) + 8px); right: 14px;
  width: min(290px, calc(100vw - 28px));
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow); z-index: 400; padding: 18px;
  opacity: 0; visibility: hidden; transform: translateY(-12px) scale(0.95);
  transition: all 0.3s cubic-bezier(0.22,1,0.36,1); pointer-events: none;
}
.settings-panel.open {
  opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto;
}
.settings-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;
}
.settings-close {
  width: 28px; height: 28px; border: none; border-radius: 8px; background: var(--surface);
  color: var(--muted); font-size: 16px; cursor: pointer; display: grid; place-items: center;
}
.settings-close:hover { color: var(--text); }
.settings-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; display: block; }
.settings-group { margin-bottom: 14px; }
.settings-group:last-child { margin-bottom: 0; }
.settings-options { display: flex; gap: 6px; }
.settings-options button {
  flex: 1; padding: 10px 6px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 12px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: all 0.25s;
}
.settings-options button:hover { background: var(--surface-hover); }
.settings-options button.active {
  background: linear-gradient(135deg, var(--cyan), var(--teal)); border-color: transparent; color: #041018;
}

/* ===== TV / DESKTOP: wide horizontal media player ===== */
@media (min-width: 800px) {
  .popup-player { width: min(1080px, 94vw); }
  .popup-inner {
    flex-direction: row;
    align-items: center;
    gap: 48px;
    padding: 40px 48px 40px 44px;
  }
  .popup-left {
    margin: 0;
    align-items: center;
    max-width: 320px;
  }
  .artwork-area { width: 260px; }
  .popup-left .now-label { margin-top: 16px; text-align: center; width: 100%; }
  .popup-left .track-title {
    text-align: center;
    font-size: 26px;
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    max-width: 300px;
  }
  .popup-left .track-meta { text-align: center; font-size: 14px; margin-top: 4px; }
  .popup-right {
    flex: 1; min-width: 0; margin-top: 0;
    align-items: stretch;
    justify-content: center;
    padding-left: 8px;
  }
  .progress-wrap, .time-row { max-width: none; width: 100%; }
  .progress-bar { height: 14px; }
  .progress-bar:hover, .progress-bar.dragging { height: 16px; }
  .controls { justify-content: center; gap: 16px; margin-top: 22px; }
  .ctrl-btn { width: 54px; height: 54px; }
  .ctrl-btn.play-btn { width: 80px; height: 80px; border-radius: 26px; }
  .ctrl-btn.play-btn svg { width: 34px; height: 34px; }
  .volume-row { width: 260px; margin-top: 14px; margin-left: auto; margin-right: auto; }
  .eq { margin-top: 14px; }
  .popup-right {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .popup-playlist-bar { margin-top: 18px; }
  .popup-tracklist {
    margin-top: 24px;
  }
}

/* Large TV */
@media (min-width: 1200px) {
  .popup-player { width: min(1180px, 90vw); }
  .popup-inner { gap: 56px; padding: 44px 56px 44px 52px; }
  .artwork-area { width: 300px; }
  .popup-left .track-title { font-size: 28px; max-width: 320px; }
  .popup-left { max-width: 360px; }
  .ctrl-btn.play-btn { width: 88px; height: 88px; }
  .ctrl-btn { width: 58px; height: 58px; }
  .progress-bar { height: 16px; }
}

@media (max-width: 560px) {
  .popup-tracklist {
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }
  .popup-track-item {
    min-height: 52px;
    padding: 7px 3px;
  }
  .popup-track-item .pt-name { font-size: 10px; }
  .popup-track-item .pt-num { font-size: 10px; }
}

@media (max-height: 600px) and (min-width: 800px) {
  .artwork-area { width: 180px; }
  .popup-inner { padding: 28px 36px; gap: 32px; }
  .track-title { font-size: 24px; }
  .ctrl-btn.play-btn { width: 64px; height: 64px; }
  .ctrl-btn { width: 46px; height: 46px; }
  .eq { height: 20px; margin-top: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

<script>
(function () {
  const html = document.documentElement;
  const i18n = {
    ja: { settings:'設定', theme:'テーマ', language:'言語', auto:'自動', dark:'ダーク', light:'ライト', now_playing:'Now Playing', search_placeholder:'曲を検索...', tracks_unit:'曲' },
    en: { settings:'Settings', theme:'Theme', language:'Language', auto:'Auto', dark:'Dark', light:'Light', now_playing:'Now Playing', search_placeholder:'Search tracks...', tracks_unit:'tracks' }
  };
  function resolveLang(pref) {
    if (pref === 'ja' || pref === 'en') return pref;
    return (navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  }
  function applyLang(pref) {
    localStorage.setItem('oisasi-lang', pref);
    const lang = resolveLang(pref);
    html.setAttribute('lang', lang);
    document.querySelectorAll('#langOptions button').forEach(btn => btn.classList.toggle('active', btn.dataset.value === pref));
    const t = i18n[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (t[k] != null) el.textContent = t[k]; });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if (t[k] != null) el.placeholder = t[k]; });
    if (typeof window.updateTrackCount === 'function') window.updateTrackCount();
  }
  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    localStorage.setItem('oisasi-theme', theme);
    document.querySelectorAll('#themeOptions button').forEach(btn => btn.classList.toggle('active', btn.dataset.value === theme));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      if (theme === 'light') meta.content = '#eef5f8';
      else if (theme === 'dark') meta.content = '#050d12';
      else meta.content = window.matchMedia('(prefers-color-scheme: light)').matches ? '#eef5f8' : '#050d12';
    }
  }
  applyTheme(localStorage.getItem('oisasi-theme') || 'auto');
  applyLang(localStorage.getItem('oisasi-lang') || 'auto');
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (html.getAttribute('data-theme') === 'auto') applyTheme('auto');
  });

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  settingsBtn.addEventListener('click', e => { e.stopPropagation(); settingsPanel.classList.toggle('open'); });
  document.getElementById('settingsClose').addEventListener('click', () => settingsPanel.classList.remove('open'));
  document.addEventListener('click', e => {
    if (settingsPanel.classList.contains('open') && !settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) settingsPanel.classList.remove('open');
  });
  document.getElementById('themeOptions').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyTheme(b.dataset.value); });
  document.getElementById('langOptions').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyLang(b.dataset.value); });

  const tracks = [
    { title: "oisasi osoj", file: "oisasi osoj.wav" },
    { title: "oisasinews", file: "oisasinews.mp3" },
    { title: "Oi-Spa", file: "Oi-Spa.mp3" },
    { title: "ONTのホテル", file: "ONTのホテル.m4a" },
    { title: "ONTの歌", file: "ONTの歌.mp3" },
    { title: "Orua Shopping Day", file: "Orua Shopping Day.mp3" },
    { title: "ORUA STORE", file: "ORUA STORE.mp3" },
    { title: "おいさしCtrl", file: "おいさしCtrl.mp3" },
    { title: "おいさしPOP", file: "おいさしＰＯＰ.mp3" },
    { title: "おいさしアクセル", file: "おいさしアクセル.mp3" },
    { title: "おいさしアップデート", file: "おいさしアップデート.mp3" },
    { title: "おいさしエネルギー", file: "おいさしエネルギー.mp3" },
    { title: "おいさしクッキング", file: "おいさしクッキング.mp3" },
    { title: "おいさしサービス", file: "おいさしサービス.mp3" },
    { title: "おいさしジャンプ", file: "おいさしジャンプ.mp3" },
    { title: "おいさしシンプル", file: "おいさしシンプル.mp3" },
    { title: "おいさしタッチパネル", file: "おいさしタッチパネル.mp3" },
    { title: "おいさしダンス", file: "おいさしダンス.mp3" },
    { title: "おいさしテレビ", file: "おいさしテレビ.m4a" },
    { title: "おいさしとおいじい", file: "おいさしとおいじぃ.mp3" },
    { title: "おいさしファイナル", file: "おいさしファイナル.mp3" },
    { title: "おいさしポーズ", file: "おいさしポーズ.mp3" },
    { title: "おいさし音頭", file: "おいさし音頭.mp3" },
    { title: "おいさし時代", file: "おいさし時代.mp3" },
    { title: "おいさし節", file: "おいさし節.mp3" },
    { title: "おいさし体操", file: "おいさし体操.m4a" },
    { title: "おいさし大作戦", file: "おいさし大作戦.mp3" },
    { title: "おいさし大作戦2", file: "おいさし大作戦2.mp3" },
    { title: "おいさし美味しい", file: "おいさし美味しい.mp3" },
    { title: "おいじい魔女", file: "おいじぃ魔女.mp3" },
    { title: "おいじい魔女のヤバい雑学の歌", file: "おいじぃ魔女のヤバい雑学の歌.mp3" },
    { title: "おいじい魔女音頭", file: "おいじぃ魔女音頭.mp3" },
    { title: "きらめきダッシュ", file: "きらめきダッシュ.mp3" },
    { title: "げんきおいさし", file: "げんきおいさし.mp3" },
    { title: "ばっくっそん!", file: "ばっくっそん！.mp3" },
    { title: "ゆきだるまのベル", file: "ゆきだるまのベル.mp3" },
    { title: "夏おいさし", file: "夏おいさし.mp3" },
    { title: "急ぐ焦るおいさし", file: "急ぐ焦るおいさし.mp3" },
    { title: "秋おいさし", file: "秋おいさし.m4a" },
    { title: "新おいさし", file: "新おいさし.mp3" }
  ];

  const audio = document.getElementById("audio");
  const playlistEl = document.getElementById("playlist");
  const trackTitle = document.getElementById("trackTitle");
  const trackMeta = document.getElementById("trackMeta");
  const trackCountEl = document.getElementById("trackCount");
  const progressFill = document.getElementById("progressFill");
  const progressBar = document.getElementById("progressBar");
  const currentTimeEl = document.getElementById("currentTime");
  const durationEl = document.getElementById("duration");
  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const shuffleBtn = document.getElementById("shuffleBtn");
  const repeatBtn = document.getElementById("repeatBtn");
  const volumeSlider = document.getElementById("volumeSlider");
  const artworkArea = document.getElementById("artworkArea");
  const eq = document.getElementById("eq");
  const searchBox = document.getElementById("searchBox");
  const popupOverlay = document.getElementById("popupOverlay");
  const miniBar = document.getElementById("miniBar");
  const miniTitle = document.getElementById("miniTitle");
  const miniPlayBtn = document.getElementById("miniPlayBtn");
  const miniPlayIcon = document.getElementById("miniPlayIcon");
  const popupTracklist = document.getElementById("popupTracklist");
  const playlistSelect = document.getElementById("playlistSelect");
  const addToPlaylistBtn = document.getElementById("addToPlaylistBtn");
  const newPlaylistBtn = document.getElementById("newPlaylistBtn");
  const removeFromPlaylistBtn = document.getElementById("removeFromPlaylistBtn");

  let currentIndex = -1, isPlaying = false, isShuffle = false, repeatMode = 0;
  let filteredTracks = [...tracks], playOrder = [], isDragging = false;
  let activePlaylistId = "all";

  // ===== Custom playlists (localStorage) =====
  function loadPlaylists() {
    try {
      const raw = localStorage.getItem("oisasi-playlists");
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  }
  function savePlaylists(obj) {
    localStorage.setItem("oisasi-playlists", JSON.stringify(obj));
  }
  function getPlaylistTrackIndexes(id) {
    if (id === "all") return tracks.map((_, i) => i);
    const pls = loadPlaylists();
    const arr = pls[id] || [];
    // keep only valid indexes
    return arr.filter(i => i >= 0 && i < tracks.length);
  }
  function refreshPlaylistSelect() {
    const pls = loadPlaylists();
    const current = activePlaylistId;
    playlistSelect.innerHTML = "";
    const optAll = document.createElement("option");
    optAll.value = "all";
    optAll.textContent = "すべて (" + tracks.length + ")";
    playlistSelect.appendChild(optAll);
    Object.keys(pls).forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name + " (" + (pls[name] || []).length + ")";
      playlistSelect.appendChild(opt);
    });
    playlistSelect.value = pls[current] !== undefined || current === "all" ? current : "all";
    activePlaylistId = playlistSelect.value;
  }
  function applyActivePlaylist() {
    const indexes = getPlaylistTrackIndexes(activePlaylistId);
    filteredTracks = indexes.map(i => tracks[i]);
    const q = (searchBox.value || "").trim().toLowerCase();
    if (q) {
      filteredTracks = filteredTracks.filter(t => t.title.toLowerCase().includes(q));
    }
    playOrder = [];
    renderPlaylist();
  }

  window.updateTrackCount = function () {
    const lang = resolveLang(localStorage.getItem('oisasi-lang') || 'auto');
    trackCountEl.textContent = tracks.length + ' ' + ((i18n[lang] && i18n[lang].tracks_unit) || '曲');
  };
  window.updateTrackCount();
  audio.volume = 0.85;
  renderPlaylist();

  function openPopup() {
    popupOverlay.classList.add("open");
    miniBar.classList.remove("show");
  }
  function closePopup() {
    popupOverlay.classList.remove("open");
    if (currentIndex >= 0) miniBar.classList.add("show");
  }
  document.getElementById("popupClose").addEventListener("click", closePopup);
  popupOverlay.addEventListener("click", e => { if (e.target === popupOverlay) closePopup(); });
  miniBar.addEventListener("click", e => { if (!e.target.closest("#miniPlayBtn")) openPopup(); });

  function renderPopupTracklist() {
    if (!popupTracklist) return;
    popupTracklist.innerHTML = "";
    const indexes = getPlaylistTrackIndexes(activePlaylistId);
    const total = indexes.length;
    if (!total) {
      const empty = document.createElement("div");
      empty.className = "popup-track-item";
      empty.style.gridColumn = "1 / -1";
      empty.innerHTML = '<span class="pt-name">プレイリストに曲がありません</span>';
      popupTracklist.appendChild(empty);
      return;
    }

    // position of current track within playlist
    let centerPos = indexes.indexOf(currentIndex);
    if (centerPos < 0) centerPos = 0;
    let start = centerPos - 2;
    if (start < 0) start = 0;
    if (start + 5 > total) start = Math.max(0, total - 5);

    for (let i = 0; i < 5 && start + i < total; i++) {
      const idx = indexes[start + i];
      const track = tracks[idx];
      const item = document.createElement("div");
      item.className = "popup-track-item" + (idx === currentIndex ? " active" : "");
      item.innerHTML = '<span class="pt-num">' + String(start + i + 1).padStart(2, "0") + '</span><span class="pt-name">' + track.title + '</span>';
      item.addEventListener("click", () => { playTrack(idx); });
      popupTracklist.appendChild(item);
    }
  }

  function renderPlaylist() {
    playlistEl.innerHTML = "";
    if (!filteredTracks.length) {
      playlistEl.innerHTML = '<div class="empty-state">該当する曲がありません</div>';
      renderPopupTracklist();
      return;
    }
    filteredTracks.forEach((track, i) => {
      const oi = tracks.indexOf(track);
      const item = document.createElement("div");
      item.className = "track-item" + (oi === currentIndex ? " active" : "");
      item.tabIndex = 0;
      item.innerHTML = '<div class="track-num">' + String(i+1).padStart(2,"0") + '</div><div class="track-name">' + track.title + '</div><div class="track-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>';
      const activate = () => { playTrack(oi); openPopup(); };
      item.addEventListener("click", activate);
      item.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); } });
      playlistEl.appendChild(item);
    });
    renderPopupTracklist();
  }

  function playTrack(index) {
    if (index < 0 || index >= tracks.length) return;
    currentIndex = index;
    const track = tracks[index];
    audio.src = track.file;
    trackTitle.textContent = track.title;
    trackMeta.textContent = "Oisasi Music Collection";
    miniTitle.textContent = track.title;
    audio.play().then(() => { isPlaying = true; updatePlayUI(); }).catch(() => {
      trackTitle.textContent = track.title + " （ファイルなし）";
      isPlaying = false; updatePlayUI();
    });
    renderPlaylist();
  }

  function togglePlay() {
    if (currentIndex === -1) { playTrack(0); openPopup(); return; }
    if (isPlaying) { audio.pause(); isPlaying = false; }
    else { audio.play().then(() => { isPlaying = true; }).catch(() => {}); }
    updatePlayUI();
  }

  function updatePlayUI() {
    const icon = isPlaying
      ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    playIcon.innerHTML = icon;
    miniPlayIcon.innerHTML = icon;
    if (isPlaying) { artworkArea.classList.add("playing"); eq.classList.add("active"); }
    else { artworkArea.classList.remove("playing"); eq.classList.remove("active"); }
    if (currentIndex >= 0 && !popupOverlay.classList.contains("open")) miniBar.classList.add("show");
  }

  function getNextIndex() {
    if (repeatMode === 2) return currentIndex;
    const pool = getPlaylistTrackIndexes(activePlaylistId);
    if (!pool.length) return -1;
    if (isShuffle) {
      if (!playOrder.length) {
        playOrder = pool.filter(i => i !== currentIndex);
        for (let i = playOrder.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [playOrder[i], playOrder[j]] = [playOrder[j], playOrder[i]];
        }
      }
      return playOrder.length ? playOrder.shift() : (repeatMode === 1 ? pool[0] : -1);
    }
    const pos = pool.indexOf(currentIndex);
    if (pos < 0) return pool[0];
    const nextPos = pos + 1;
    if (nextPos >= pool.length) return repeatMode === 1 ? pool[0] : -1;
    return pool[nextPos];
  }
  function playNext() {
    if (currentIndex === -1) { playTrack(0); openPopup(); return; }
    const next = getNextIndex();
    if (next === -1) { isPlaying = false; updatePlayUI(); return; }
    playTrack(next);
  }
  function playPrev() {
    if (currentIndex === -1) { playTrack(0); openPopup(); return; }
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    const pool = getPlaylistTrackIndexes(activePlaylistId);
    if (!pool.length) return;
    const pos = pool.indexOf(currentIndex);
    const prevPos = pos <= 0 ? pool.length - 1 : pos - 1;
    playTrack(pool[prevPos]);
  }

  playBtn.addEventListener("click", togglePlay);
  miniPlayBtn.addEventListener("click", e => { e.stopPropagation(); togglePlay(); });
  nextBtn.addEventListener("click", playNext);
  prevBtn.addEventListener("click", playPrev);
  shuffleBtn.addEventListener("click", () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle("active", isShuffle);
    playOrder = [];
  });
  repeatBtn.addEventListener("click", () => {
    repeatMode = (repeatMode + 1) % 3;
    repeatBtn.classList.toggle("active", repeatMode > 0);
    repeatBtn.title = repeatMode === 2 ? "1曲リピート" : repeatMode === 1 ? "全曲リピート" : "リピート";
  });
  volumeSlider.addEventListener("input", () => { audio.volume = volumeSlider.value; });

  function seekFromEvent(e) {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    audio.currentTime = ratio * audio.duration;
    progressFill.style.width = (ratio * 100) + "%";
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }
  progressBar.addEventListener("mousedown", e => { isDragging = true; progressBar.classList.add("dragging"); seekFromEvent(e); });
  progressBar.addEventListener("touchstart", e => { isDragging = true; progressBar.classList.add("dragging"); seekFromEvent(e); }, { passive: true });
  document.addEventListener("mousemove", e => { if (isDragging) seekFromEvent(e); });
  document.addEventListener("touchmove", e => { if (isDragging) seekFromEvent(e); }, { passive: true });
  document.addEventListener("mouseup", () => { isDragging = false; progressBar.classList.remove("dragging"); });
  document.addEventListener("touchend", () => { isDragging = false; progressBar.classList.remove("dragging"); });

  audio.addEventListener("timeupdate", () => {
    if (!audio.duration || isDragging) return;
    progressFill.style.width = ((audio.currentTime / audio.duration) * 100) + "%";
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });
  audio.addEventListener("loadedmetadata", () => { durationEl.textContent = formatTime(audio.duration); });
  audio.addEventListener("ended", () => {
    if (repeatMode === 2) { audio.currentTime = 0; audio.play(); }
    else playNext();
  });
  audio.addEventListener("play", () => { isPlaying = true; updatePlayUI(); });
  audio.addEventListener("pause", () => { isPlaying = false; updatePlayUI(); });

  searchBox.addEventListener("input", () => {
    applyActivePlaylist();
  });

  // Playlist controls
  refreshPlaylistSelect();
  applyActivePlaylist();

  playlistSelect.addEventListener("change", () => {
    activePlaylistId = playlistSelect.value;
    applyActivePlaylist();
  });

  newPlaylistBtn.addEventListener("click", () => {
    const name = prompt("新しいプレイリスト名");
    if (!name || !name.trim()) return;
    const key = name.trim();
    const pls = loadPlaylists();
    if (pls[key] || key === "all") {
      alert("同じ名前のプレイリストがあります");
      return;
    }
    pls[key] = [];
    savePlaylists(pls);
    activePlaylistId = key;
    refreshPlaylistSelect();
    applyActivePlaylist();
  });

  addToPlaylistBtn.addEventListener("click", () => {
    if (currentIndex < 0) { alert("先に曲を再生してください"); return; }
    if (activePlaylistId === "all") {
      const name = prompt("追加先のプレイリスト名（新規可）");
      if (!name || !name.trim()) return;
      const key = name.trim();
      const pls = loadPlaylists();
      if (!pls[key]) pls[key] = [];
      if (!pls[key].includes(currentIndex)) pls[key].push(currentIndex);
      savePlaylists(pls);
      activePlaylistId = key;
      refreshPlaylistSelect();
      applyActivePlaylist();
      return;
    }
    const pls = loadPlaylists();
    if (!pls[activePlaylistId]) pls[activePlaylistId] = [];
    if (!pls[activePlaylistId].includes(currentIndex)) {
      pls[activePlaylistId].push(currentIndex);
      savePlaylists(pls);
      refreshPlaylistSelect();
      applyActivePlaylist();
    }
  });

  removeFromPlaylistBtn.addEventListener("click", () => {
    if (activePlaylistId === "all") {
      alert("「すべて」からは削除できません");
      return;
    }
    if (currentIndex < 0) return;
    const pls = loadPlaylists();
    if (!pls[activePlaylistId]) return;
    pls[activePlaylistId] = pls[activePlaylistId].filter(i => i !== currentIndex);
    savePlaylists(pls);
    refreshPlaylistSelect();
    applyActivePlaylist();
  });

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); playNext(); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); playPrev(); }
    else if (e.code === "ArrowUp") {
      e.preventDefault();
      volumeSlider.value = Math.min(1, +volumeSlider.value + 0.05);
      audio.volume = volumeSlider.value;
    } else if (e.code === "ArrowDown") {
      e.preventDefault();
      volumeSlider.value = Math.max(0, +volumeSlider.value - 0.05);
      audio.volume = volumeSlider.value;
    } else if (e.code === "Escape") {
      settingsPanel.classList.remove("open");
      closePopup();
    }
  });

  function formatTime(sec) {
    if (isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ":" + String(s).padStart(2, "0");
  }
})();
</script>
</body>
</html>
