    <title>おいじぃ魔女の猛追 最強DX版 - UI配置変更＆アニメーション強化</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #1e293b; color: #fff;
            font-family: 'Helvetica Neue', Arial, 'Segoe UI', sans-serif;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
        }
        
        /* 統合レイヤー */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%;
            pointer-events: none; padding: 15px 20px; box-sizing: border-box;
            z-index: 10; display: flex; justify-content: space-between; align-items: flex-start;
        }

        /* レーダーミニマップ (公式) */
        #minimap-container {
            width: 150px; height: 150px; border: 3px solid rgba(255,255,255,0.3);
            border-radius: 10px; background: rgba(0,0,0,0.6); overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none;
        }
        #minimap { width: 100%; height: 100%; display: block; }

        /* タイマー (中央に配置) */
        #timer {
            font-size: 3rem; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.8); padding: 5px 30px; border-radius: 15px;
            border: 2px solid #333; color: #333; height: max-content;
        }

        /* 順位表示エリア (右側に配置) */
        #leaderboard {
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
            pointer-events: none;
        }
        
        /* ランキングのバウンドスライドインアニメーション */
        @keyframes rankSlideIn {
            0% { opacity: 0; transform: translateX(100px) scale(0.7); }
            70% { transform: translateX(-10px) scale(1.05); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        
        .rank-box {
            background: rgba(0, 0, 0, 0.85); border: 2px solid #fff;
            padding: 8px 20px; border-radius: 10px; font-size: 1.3rem;
            min-width: 200px; text-align: center; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            animation: rankSlideIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .rank-4 { border-color: #ff4444; color: #ff8888; }
        .rank-3 { border-color: #ffaa00; color: #ffcc66; }
        .rank-2 { border-color: #cccccc; color: #ffffff; }
        .rank-1 { border-color: #00ffcc; color: #66ffea; box-shadow: 0 0 25px #00ffcc; transform: scale(1.1); }

        /* 魔女のおしゃべり字幕窓 */
        #witch-dialogue {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); border: 3px solid #ff00ff;
            color: #333; font-weight: bold; padding: 20px 40px; border-radius: 20px;
            font-size: 1.5rem; max-width: 80%; text-align: center; display: none;
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.3); z-index: 11; pointer-events: none;
        }

        /* アクションログ通知 */
        #notification {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(59, 130, 246, 0.9); color: white; padding: 12px 24px;
            border-radius: 30px; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 2px #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s ease;
            z-index: 20; pointer-events: none;
        }

        /* キャラクター名ラベル */
        .name-label {
            position: absolute; color: #fff; font-weight: bold; font-size: 14px;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transform: translate(-50%, -120%); pointer-events: none; display: none; z-index: 5;
        }

        /* メニュー画面 */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 30; transition: opacity 0.3s ease;
        }
        .overlay-screen h2 { font-size: 46px; margin-bottom: 10px; color: #f59e0b; text-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        .overlay-screen p { font-size: 18px; color: #cbd5e1; margin-bottom: 40px; text-align: center; }
        
        .action-btn {
            padding: 16px 48px; font-size: 22px; font-weight: bold; color: #fff;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4); pointer-events: auto; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .action-btn:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 12px 25px rgba(239, 68, 68, 0.6); }
        .action-btn:active { transform: scale(0.95); }

        #center-message {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; font-size: 70px; font-weight: bold;
            text-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 20; pointer-events: none; color: #fff;
        }

        /* 十字キー */
        #dpad {
            position: absolute; bottom: 30px; right: 30px; width: 150px; height: 150px;
            display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 5px; z-index: 25; opacity: 0.8;
        }
        .dpad-btn {
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px; color: #fff; font-size: 24px; font-weight: bold;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.1s;
        }
        .dpad-btn:active, .dpad-btn.active { background: rgba(239, 68, 68, 0.6); border-color: rgba(239, 68, 68, 1); transform: scale(0.9); }
        #btn-up { grid-column: 2; grid-row: 1; border-radius: 12px 12px 4px 4px;}
        #btn-left { grid-column: 1; grid-row: 2; border-radius: 12px 4px 4px 12px;}
        #btn-right { grid-column: 3; grid-row: 2; border-radius: 4px 12px 12px 4px;}
        #btn-down { grid-column: 2; grid-row: 3; border-radius: 4px 4px 12px 12px;}

        @media (max-width: 600px) {
            #minimap-container { width: 100px; height: 100px; }
            #timer { font-size: 2rem; padding: 5px 15px; }
            #dpad { bottom: 20px; right: 20px; width: 130px; height: 130px; }
            #witch-dialogue { bottom: 180px; font-size: 1.2rem; }
        }
    </style>

                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
                    gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'item') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'beat') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(65, now);
                    gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                }
            } catch (error) { console.warn("音声エラー", error); }
        }

        function witchSpeak(text, onComplete) {
            try {
                const dialogueDiv = document.getElementById('witch-dialogue');
                dialogueDiv.innerHTML = '<span class="witch-img" role="img" aria-label="魔女"></span>「' + text + '」';
                dialogueDiv.style.display = 'block';

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ja-JP'; utterance.pitch = 0.3; utterance.rate = 0.9;
                    
                    let finished = false;
                    const finishAction = () => {
                        if(finished) return; finished = true;
                        setTimeout(() => { if(gameState === 'PLAYING') dialogueDiv.style.display = 'none'; }, 2000);
                        if(onComplete) onComplete();
                    };
                    utterance.onend = finishAction; utterance.onerror = finishAction;
                    window.speechSynthesis.speak(utterance);
                    setTimeout(finishAction, text.length * 400 + 2000);
                } else {
                    setTimeout(() => {
                        setTimeout(() => { if(gameState === 'PLAYING') dialogueDiv.style.display = 'none'; }, 2000);
                        if(onComplete) onComplete();
                    }, 3000);
                }
            } catch (error) { console.warn("音声合成エラー", error); if(onComplete) onComplete(); }
        }

        let notifTimeout;

        // -------------------------
        // 2. Three.js & 迷路生成
        // -------------------------
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1e293b); 
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75); scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.55); dirLight.position.set(30, 60, 15); scene.add(dirLight);

        function createEmojiSprite(emoji, size=3.8) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d'); ctx.font = '100px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

        function createHumanMesh(clothingColor) {
            const humanGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
            const clothMat = new THREE.MeshStandardMaterial({ color: clothingColor, roughness: 0.6 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.8), clothMat); body.position.y = 1.0; humanGroup.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), skinMat); head.position.y = 2.0; humanGroup.add(head);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.4), pantsMat); leftLeg.position.set(-0.35, 0.3, 0);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.4), pantsMat); rightLeg.position.set(0.35, 0.3, 0);

            humanGroup.add(leftArm, rightArm);
            return humanGroup;
        }

        const COLS = 25, ROWS = 25, TILE_SIZE = 4;
        let map = Array(ROWS).fill().map(() => Array(COLS).fill(1));

        function carve(x, y) {
            map[y][x] = 0;
            let dirs = [[0,-2], [0,2], [-2,0], [2,0]].sort(() => Math.random() - 0.5);
            for(let d of dirs) {
                let nx = x + d[0], ny = y + d[1];
                if(ny > 0 && ny < ROWS-1 && nx > 0 && nx < COLS-1 && map[ny][nx] === 1) { map[y + d[1]/2][x + d[0]/2] = 0; carve(nx, ny); }
            }
        }
        carve(1, 1);

        for(let y=1; y<ROWS-1; y++) {
            for(let x=1; x<COLS-1; x++) {
                if(map[y][x] === 0) {
                    let walls = 0; let adj = [];
                    if(map[y-1][x] === 1) { walls++; adj.push({x:x, y:y-1}); }
                    if(map[y+1][x] === 1) { walls++; adj.push({x:x, y:y+1}); }
                    if(map[y][x-1] === 1) { walls++; adj.push({x:x-1, y:y}); }
                    if(map[y][x+1] === 1) { walls++; adj.push({x:x+1, y:y}); }
                    if(walls >= 3) { 
                        let w = adj[Math.floor(Math.random() * adj.length)];
                        if(w.x > 0 && w.x < COLS-1 && w.y > 0 && w.y < ROWS-1) map[w.y][w.x] = 0;
                    }
                }
            }
        }

        const wallGeo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE * 2.0, TILE_SIZE);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 }); 
        const floorGeo = new THREE.PlaneGeometry(COLS * TILE_SIZE, ROWS * TILE_SIZE);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9 }); 
        
        const floor = new THREE.Mesh(floorGeo, floorMat); floor.rotation.x = -Math.PI / 2;
        floor.position.set((COLS*TILE_SIZE)/2 - TILE_SIZE/2, 0, (ROWS*TILE_SIZE)/2 - TILE_SIZE/2); scene.add(floor);

        let wallMeshes = [];
        function rebuildWallsFromMap() {
            wallMeshes.forEach(function(w){ try { scene.remove(w); } catch(e){} });
            wallMeshes = [];
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (map[y][x] === 1) {
                        let wall = new THREE.Mesh(wallGeo, wallMat);
                        wall.position.set(x * TILE_SIZE, TILE_SIZE * 1.0, y * TILE_SIZE);
                        scene.add(wall);
                        wallMeshes.push(wall);
                    }
                }
            }
        }
        rebuildWallsFromMap();

        // オンライン用: ホストの地図を適用
        window._chaseApplyMap = function(mapData) {
            if (!mapData || !mapData.length) return;
            for (let y = 0; y < ROWS && y < mapData.length; y++) {
                for (let x = 0; x < COLS && x < mapData[y].length; x++) {
                    map[y][x] = mapData[y][x] ? 1 : 0;
                }
            }
            rebuildWallsFromMap();
        };
        window._chaseExportMap = function() {
            return map.map(function(row){ return row.slice(); });
        };

        // アイテム
        let itemsList = [];
        const itemGeo = new THREE.OctahedronGeometry(0.8);
        const speedMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8 });
        const freezeMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04 });

        function spawnItems() {
            itemsList.forEach(i => scene.remove(i.mesh)); itemsList = [];
            let types = ['speed', 'speed', 'speed', 'freeze', 'freeze'];
            types.forEach(t => {
                let rx, ry;
                do {
                    rx = Math.floor(Math.random() * COLS); ry = Math.floor(Math.random() * ROWS);
                } while (map[ry][rx] !== 0 || (rx===1&&ry===1) || (rx===Math.floor(COLS/2)&&ry===Math.floor(ROWS/2)));
                
                let mesh = new THREE.Mesh(itemGeo, t === 'speed' ? speedMat : freezeMat);
                mesh.position.set(rx * TILE_SIZE, 1.5, ry * TILE_SIZE);
                scene.add(mesh);
                itemsList.push({x: rx, y: ry, type: t, mesh: mesh});
            });
        }

        // ミニマップ
        const mmCanvas = document.getElementById('minimap');
        const mmCtx = mmCanvas.getContext('2d');
        const cw = mmCanvas.width / COLS; const ch = mmCanvas.height / ROWS;

        const bgCanvas = document.createElement('canvas'); bgCanvas.width = 150; bgCanvas.height = 150;
        const bgCtx = bgCanvas.getContext('2d');
        bgCtx.fillStyle = '#0f172a'; bgCtx.fillRect(0,0,150,150);
        bgCtx.fillStyle = '#f1f5f9';
        for(let y=0; y<ROWS; y++) {
            for(let x=0; x<COLS; x++) { if(map[y][x] === 0) bgCtx.fillRect(x*cw, y*ch, cw, ch); }
        }

        function updateMinimap() {
            mmCtx.clearRect(0,0,150,150);
            mmCtx.drawImage(bgCanvas, 0, 0); 
            
            itemsList.forEach(i => {
                mmCtx.fillStyle = i.type === 'speed' ? '#3b82f6' : '#facc15';
                mmCtx.fillRect(i.x*cw, i.y*ch, cw, ch);
            });

            allChars.forEach(c => {
                if(c.isDizzy) return;
                mmCtx.fillStyle = c.isPlayer ? '#ef4444' : (c.name==='CPU1'?'#22c55e':c.name==='CPU2'?'#eab308':'#06b6d4');
                mmCtx.beginPath(); mmCtx.arc(c.group.position.x/TILE_SIZE*cw, c.group.position.z/TILE_SIZE*ch, cw/1.5, 0, Math.PI*2); mmCtx.fill();
            });

            if(!witch.isDizzy) {
                mmCtx.fillStyle = witch.freezeTimer > 0 ? '#9ca3af' : '#a855f7'; 
                mmCtx.beginPath(); mmCtx.arc(witch.group.position.x/TILE_SIZE*cw, witch.group.position.z/TILE_SIZE*ch, cw, 0, Math.PI*2); mmCtx.fill();
            }
        }

        // -------------------------
        // 3. キャラクタークラス
        // -------------------------
        class Character {
            constructor(x, y, name, color, isPlayer = false, isWitch = false) {
                this.name = name; this.isPlayer = isPlayer; this.isWitch = isWitch;
                this.group = new THREE.Group(); scene.add(this.group);
                
                if (this.isWitch) {
                    this.model = createEmojiSprite('__WITCH__', 3.8); this.model.position.y = TILE_SIZE * 0.5; this.group.add(this.model);
                    this.freezeIcon = createEmojiSprite('❄️', 2.0); this.freezeIcon.position.y = 3; this.freezeIcon.visible = false;
                    this.group.add(this.freezeIcon);
                } else {
                    this.model = createHumanMesh(color); this.group.add(this.model);
                    this.speedAura = createEmojiSprite('⚡', 1.5); this.speedAura.position.y = 3; this.speedAura.visible = false;
                    this.group.add(this.speedAura);
                }

                this.stars = new THREE.Group();
                for(let i=0; i<3; i++){
                    let star = createEmojiSprite('⭐', 1.2); star.position.set(Math.cos(i*2.1)*1.2, 2.8, Math.sin(i*2.1)*1.2); this.stars.add(star);
                }
                this.group.add(this.stars);

                this.label = document.createElement('div'); this.label.className = 'name-label'; this.label.innerText = name;
                if(isPlayer) this.label.style.color = "#ef4444"; document.body.appendChild(this.label);
                
                this.resetTo(x, y);
            }

            resetTo(x, y) {
                this.gridX = x; this.gridY = y;
                this.group.position.set(x * TILE_SIZE, 0, y * TILE_SIZE);
                this.targetX = this.group.position.x; this.targetZ = this.group.position.z;
                this.isDizzy = false; this.stars.visible = false;
                this.currentSpeed = 0.13; this.lastDir = {x: 0, y: 0};
                this.buffTimer = 0; this.freezeTimer = 0;
                this.rank = null;
                if (!this.isWitch) { this.model.rotation.y = 0; this.speedAura.visible = false; }
                else { this.freezeIcon.visible = false; }
            }

            canMove(x, y) {
                if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
                return map[y][x] === 0;
            }

            rotateTowards(dx, dz) {
                if (this.isWitch || (dx === 0 && dz === 0)) return;
                this.model.rotation.y = Math.atan2(dx, dz);
            }

            update() {
                if (this.isDizzy) { this.stars.rotation.y += 0.1; return; }
                // 終了後は全員その場で停止（俯瞰演出用）
                if (gameState === 'ENDED') return;
                
                if (this.isWitch && this.freezeTimer > 0) {
                    this.freezeIcon.visible = true; this.freezeIcon.rotation.z = Math.sin(Date.now()*0.01)*0.2;
                    return; 
                } else if (this.isWitch) { this.freezeIcon.visible = false; }

                if (!this.isWitch && this.buffTimer > 0) {
                    this.speedAura.visible = true; this.speedAura.position.y = 3 + Math.sin(Date.now()*0.02)*0.3;
                } else if (!this.isWitch) { this.speedAura.visible = false; }

                let dx = this.targetX - this.group.position.x; let dz = this.targetZ - this.group.position.z;

                if (Math.abs(dx) > 0.01 || Math.abs(dz) > 0.01) {
                    this.group.position.x += Math.sign(dx) * this.currentSpeed * TILE_SIZE;
                    this.group.position.z += Math.sign(dz) * this.currentSpeed * TILE_SIZE;
                    this.rotateTowards(Math.sign(dx), Math.sign(dz));

                    if (Math.abs(this.targetX - this.group.position.x) < this.currentSpeed * TILE_SIZE) this.group.position.x = this.targetX;
                    if (Math.abs(this.targetZ - this.group.position.z) < this.currentSpeed * TILE_SIZE) this.group.position.z = this.targetZ;
                } else {
                    this.gridX = Math.round(this.group.position.x / TILE_SIZE); this.gridY = Math.round(this.group.position.z / TILE_SIZE);
                    if (gameState === 'PLAYING') this.decideNextMove();
                }
            }

            decideNextMove() {
                if (this.isPlayer) {
                    let dx = 0; let dy = 0;
                    if (keys['ArrowUp'] || keys['KeyW']) { dx = 0; dy = -1; }
                    else if (keys['ArrowDown'] || keys['KeyS']) { dx = 0; dy = 1; }
                    else if (keys['ArrowLeft'] || keys['KeyA']) { dx = -1; dy = 0; }
                    else if (keys['ArrowRight'] || keys['KeyD']) { dx = 1; dy = 0; }

                    if ((dx !== 0 || dy !== 0) && this.canMove(this.gridX + dx, this.gridY + dy)) {
                        this.targetX += dx * TILE_SIZE; this.targetZ += dy * TILE_SIZE;
                    }
                } 
                else if (this.isWitch) {
                    let target = getClosestAlive(this);
                    if (target) {
                        let nextStep = findNextStepBFS(this.gridX, this.gridY, target.gridX, target.gridY);
                        if (nextStep) { this.targetX = nextStep.x * TILE_SIZE; this.targetZ = nextStep.y * TILE_SIZE; }
                    }
                }
                else {
                    let distToWitch = Math.hypot(this.gridX - witch.gridX, this.gridY - witch.gridY);
                    let dirs = [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}].filter(d => this.canMove(this.gridX + d.x, this.gridY + d.y));
                    
                    if (dirs.length > 0) {
                        if (distToWitch < 8) {
                            dirs.sort((a, b) => Math.hypot((this.gridX + b.x) - witch.gridX, (this.gridY + b.y) - witch.gridY) - Math.hypot((this.gridX + a.x) - witch.gridX, (this.gridY + a.y) - witch.gridY));
                            this.targetX += dirs[0].x * TILE_SIZE; this.targetZ += dirs[0].y * TILE_SIZE; this.lastDir = dirs[0];
                        } else {
                            let keepDir = dirs.find(d => d.x === this.lastDir.x && d.y === this.lastDir.y);
                            let chosen = keepDir && Math.random() < 0.7 ? keepDir : dirs[Math.floor(Math.random() * dirs.length)];
                            this.targetX += chosen.x * TILE_SIZE; this.targetZ += chosen.y * TILE_SIZE; this.lastDir = chosen;
                        }
                    }
                }
            }

            updateLabel() {
                let pos = this.group.position.clone(); pos.y += 2.5; pos.project(camera);
                if (pos.z < 1 && pos.x > -1 && pos.x < 1 && pos.y > -1 && pos.y < 1) {
                    this.label.style.left = (pos.x * 0.5 + 0.5) * window.innerWidth + 'px';
                    this.label.style.top = (pos.y * -0.5 + 0.5) * window.innerHeight + 'px';
                    this.label.style.display = 'block';
                } else { this.label.style.display = 'none'; }
            }
        }

        function findNextStepBFS(sx, sy, tx, ty) {
            let queue = [[{x: sx, y: sy}]];
            let visited = Array(ROWS).fill().map(() => Array(COLS).fill(false)); visited[sy][sx] = true;
            while (queue.length > 0) {
                let path = queue.shift(); let curr = path[path.length - 1];
                if (curr.x === tx && curr.y === ty) return path[1] || path[0];
                for (let d of [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}]) {
                    let nx = curr.x + d.x, ny = curr.y + d.y;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] === 0 && !visited[ny][nx]) {
                        visited[ny][nx] = true; queue.push([...path, {x: nx, y: ny}]);
                    }
                }
            }
            return null;
        }

        // キー＆タッチ入力
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function bindDpad(id, code) {
            const el = document.getElementById(id);
            const startEvent = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('active'); };
            const endEvent = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('active'); };
            el.addEventListener('touchstart', startEvent, {passive: false}); el.addEventListener('touchend', endEvent, {passive: false});
            el.addEventListener('mousedown', startEvent); el.addEventListener('mouseup', endEvent); el.addEventListener('mouseleave', endEvent);
        }
        bindDpad('btn-up', 'ArrowUp'); bindDpad('btn-down', 'ArrowDown'); bindDpad('btn-left', 'ArrowLeft'); bindDpad('btn-right', 'ArrowRight');

        // -------------------------
        // 4. ゲームループと進行管理
        // -------------------------
        let player = new Character(1, 1, (window._playerName||'あなた'), 0xef4444, true);
        let cpus = [
            new Character(COLS-2, 1, 'CPU1', 0x22c55e), new Character(1, ROWS-2, 'CPU2', 0xeab308), new Character(COLS-2, ROWS-2, 'CPU3', 0x06b6d4) 
        ];
        let witch = new Character(Math.floor(COLS/2), Math.floor(ROWS/2), 'おいじぃ魔女', null, false, true);
        let allChars = [player, ...cpus];
        
        let gameState = 'INIT'; 
        let timeLeft = 60; 
        let lastTime = 0;
        let aliveCount = 4;
        let beatTimerId;

        function heartBeatLoop() {
            if(gameState !== 'PLAYING') return;
            playSound('beat');
            let delay = Math.max(250, 1000 - ((60 - timeLeft) * 15));
            beatTimerId = setTimeout(heartBeatLoop, delay);
        }

        function startGameSequence() {
            playSound('click');
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            clearTimeout(beatTimerId);
            document.getElementById('start-screen').style.display = 'none'; 
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('witch-dialogue').style.display = 'none';
            document.getElementById('leaderboard').innerHTML = '';
            
            player.resetTo(1, 1); cpus[0].resetTo(COLS-2, 1); cpus[1].resetTo(1, ROWS-2); cpus[2].resetTo(COLS-2, ROWS-2);
            witch.resetTo(Math.floor(COLS/2), Math.floor(ROWS/2));
            spawnItems();

            timeLeft = 60; 
            aliveCount = 4;
            document.getElementById('timer').innerText = timeLeft;
            gameState = 'STARTING';
            
            camera.position.set(player.group.position.x, TILE_SIZE * 13, player.group.position.z);
            camera.lookAt(new THREE.Vector3(camera.position.x, 0, camera.position.z));

            const msg = document.getElementById('center-message');
            
            witchSpeak("逃げなさい。5、4、3、2、1、スタートじゃ。", () => {
                msg.innerText = "START!!";
                gameState = 'PLAYING'; lastTime = Date.now();
                heartBeatLoop();
                setTimeout(() => { if(gameState === 'PLAYING') msg.innerText = ""; }, 1000);
            });
        }

        document.getElementById('start-btn').addEventListener('click', startGameSequence);
        document.getElementById('restart-btn').addEventListener('click', startGameSequence);

        if (location.search.includes('challenge=1')) {
            setTimeout(() => { startGameSequence(); }, 300);
        }

        function getClosestAlive(source) {
            let closest = null; let minDist = Infinity;
            allChars.forEach(char => {
                if (!char.isDizzy) { let d = Math.hypot(char.gridX - source.gridX, char.gridY - source.gridY); if (d < minDist) { minDist = d; closest = char; } }
            });
            return closest;
        }

        // 脱落時のランキング追加＆アニメーション
        function eliminatePlayer(char) {
            if (!char || char.isDizzy) return;
            char.isDizzy = true;
            if (char.stars) char.stars.visible = true;
            char.rank = aliveCount;
            aliveCount--;

            if (char.isPlayer && window.parent) {
                window.parent.postMessage({ type: 'gameEnd', rank: char.rank }, '*');
            }

            const leaderboard = document.getElementById('leaderboard');
            const rankBox = document.createElement('div');
            rankBox.className = `rank-box rank-${char.rank}`;
            rankBox.innerText = `□ ${char.rank}位: ${char.name}`;
            leaderboard.appendChild(rankBox);

            witchSpeak(`ほっほっほ！${char.name}は${char.rank}位確定じゃ！`);

            if (aliveCount <= 1) {
                setTimeout(endGameByLastOne, 1500);
            }
        }

        function checkCollisionsAndItems() {
            if(gameState !== 'PLAYING') return;

            for (let i = itemsList.length - 1; i >= 0; i--) {
                let item = itemsList[i];
                allChars.forEach(char => {
                    if (char.isDizzy) return;
                    let dist = Math.hypot(char.group.position.x - item.mesh.position.x, char.group.position.z - item.mesh.position.z);
                    if (dist < TILE_SIZE * 0.8) {
                        playSound('item');
                        if (item.type === 'speed') {
                            char.buffTimer = 4;
                            showNotification(`${char.name} が猛ダッシュ！⚡`, "rgba(59,130,246,0.9)");
                        } else if (item.type === 'freeze') {
                            witch.freezeTimer = 3;
                            showNotification(`${char.name} が魔女を氷結させた！❄️`, "rgba(234,179,8,0.9)");
                        }
                        scene.remove(item.mesh); itemsList.splice(i, 1);
                    }
                });
            }

            allChars.forEach(char => {
                if (!char.isDizzy && witch.freezeTimer <= 0) { 
                    let d = Math.hypot(char.group.position.x - witch.group.position.x, char.group.position.z - witch.group.position.z);
                    if (d < TILE_SIZE * 0.65) { 
                        playSound('hit'); 
                        showNotification(`${char.name} が捕まった！💀`, "rgba(239,68,68,0.9)");
                        eliminatePlayer(char);
                    }
                }
            });
        }

        function updateCamera() {
            if (gameState === 'INIT' || gameState === 'STARTING') return;

            let idealX, idealY, idealZ;
            if (gameState === 'ENDED') {
                // 勝ち演出：自分視点ではなく全体俯瞰を表示
                idealX = (COLS * TILE_SIZE) / 2 - TILE_SIZE / 2;
                idealY = TILE_SIZE * 30;
                idealZ = (ROWS * TILE_SIZE) / 2 - TILE_SIZE / 2;
            } else {
                let camTarget;
                if (!player.isDizzy) camTarget = player;
                else { let aliveCPUs = cpus.filter(c => !c.isDizzy); camTarget = aliveCPUs.length > 0 ? aliveCPUs[0] : witch; }
                idealX = camTarget.group.position.x;
                idealY = TILE_SIZE * 13;
                idealZ = camTarget.group.position.z;
            }

            camera.position.x += (idealX - camera.position.x) * 0.08;
            camera.position.y += (idealY - camera.position.y) * 0.08;
            camera.position.z += (idealZ - camera.position.z) * 0.08;
            camera.lookAt(new THREE.Vector3(camera.position.x, 0, camera.position.z));
        }

        function endGameByLastOne() {
            if(gameState !== 'PLAYING') return;
            gameState = 'ENDED'; clearTimeout(beatTimerId);
            witch.isDizzy = true; if (witch.stars) witch.stars.visible = true; 
            document.getElementById('center-message').innerText = ""; 
            
            const winner = allChars.find(p => !p.isDizzy);
            if (winner) {
                winner.rank = 1;
                if (winner.isPlayer && window.parent) {
                    window.parent.postMessage({ type: 'gameEnd', rank: 1 }, '*');
                }
                const leaderboard = document.getElementById('leaderboard');
                const rankBox = document.createElement('div');
                rankBox.className = `rank-box rank-1`;
                rankBox.innerText = `👑 1位: ${winner.name} 👑`;
                leaderboard.appendChild(rankBox);
                
                witchSpeak(`勝ちは ${winner.name} じゃ！素晴らしい生き残りじゃて。`, showResultScreen);
            } else {
                showResultScreen();
            }
        }

        function endGameByTimeout() {
            if(gameState !== 'PLAYING') return;
            gameState = 'ENDED'; clearTimeout(beatTimerId);
            witch.isDizzy = true; if (witch.stars) witch.stars.visible = true; 
            document.getElementById('center-message').innerText = ""; 

            const survivors = allChars.filter(p => !p.isDizzy);
            survivors.forEach(p => {
                p.rank = 1;
                if (p.isPlayer && window.parent) {
                    window.parent.postMessage({ type: 'gameEnd', rank: 1 }, '*');
                }
                const leaderboard = document.getElementById('leaderboard');
                const rankBox = document.createElement('div');
                rankBox.className = `rank-box rank-1`;
                rankBox.innerText = `👑 1位タイ: ${p.name}`;
                leaderboard.appendChild(rankBox);
            });
            witchSpeak("そこまでじゃ！時間切れぃ！", showResultScreen);
        }

        function showResultScreen() {
            setTimeout(() => {
                const screen = document.getElementById('result-screen'); 
                const title = document.getElementById('result-title'); 
                const desc = document.getElementById('result-desc');
                
                if(timeLeft <= 0) {
                    title.innerText = "TIME UP!"; title.style.color = "#f59e0b"; 
                    desc.innerText = "生存者の勝利！逃げ切ったぞ！"; 
                } else {
                    let winner = allChars.find(c => !c.isDizzy);
                    title.innerText = winner ? `${winner.name} の勝利！` : "全滅じゃ！"; 
                    title.style.color = "#ef4444"; 
                    desc.innerText = "おいじぃ魔女の恐怖は終わらない..."; 
                }
                screen.style.display = 'flex'; 
            }, 1000);
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (gameState === 'PLAYING') {
                let now = Date.now();
                if (now - lastTime >= 1000) { 
                    timeLeft--; 
                    document.getElementById('timer').innerText = timeLeft; 
                    lastTime = now; 
                    allChars.forEach(c => { if(c.buffTimer > 0) c.buffTimer--; });
                    if(witch.freezeTimer > 0) witch.freezeTimer--;
                }

                let elapsedTime = 60 - timeLeft;
                const BASE_SPEED = 0.13;
                allChars.forEach(c => { c.currentSpeed = c.buffTimer > 0 ? 0.22 : BASE_SPEED; });
                
                if (witch.freezeTimer > 0) { witch.currentSpeed = 0; } 
                else { witch.currentSpeed = 0.09 + (elapsedTime * 0.0045); }

                witch.update(); allChars.forEach(c => c.update()); checkCollisionsAndItems();
                itemsList.forEach(i => { i.mesh.rotation.y += 0.05; i.mesh.position.y = 1.5 + Math.sin(now * 0.005) * 0.3; });

                if (timeLeft <= 0) endGameByTimeout();
            } else if (gameState === 'ENDED') { 
                // 目が回る演出を魔女以外も含めて継続
                witch.update();
                allChars.forEach(c => c.update());
            }

            updateCamera(); updateMinimap(); 
            allChars.forEach(c => c.updateLabel()); witch.updateLabel();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        gameLoop();
    </script>
