<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オンラインおいじぃ魔女会話AI</title>
<style>
    body {
        font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
        background-color: #1a0033;
        color: #f1f1f1;
        text-align: center;
        margin: 0;
        padding: 20px;
    }
    h1 {
        color: #f1c40f;
        text-shadow: 2px 2px 4px #000000;
        margin-bottom: 10px;
    }
    #chat-box {
        width: 90%;
        max-width: 600px;
        height: 500px;
        background-color: #3b1059;
        margin: 20px auto;
        border-radius: 15px;
        padding: 15px;
        overflow-y: auto;
        border: 4px solid #9b59b6;
        box-shadow: 0 0 15px #9b59b6;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }
    .message {
        margin: 8px 0;
        padding: 12px 18px;
        border-radius: 20px;
        max-width: 75%;
        word-wrap: break-word;
        font-size: 16px;
        line-height: 1.4;
    }
    .user-msg {
        background-color: #3498db;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
    }
    .majo-msg {
        background-color: #f39c12;
        color: #1a0033;
        align-self: flex-start;
        text-align: left;
        border-bottom-left-radius: 2px;
        font-weight: bold;
    }
    #input-area {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 10px;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
    }
    input[type="text"] {
        flex-grow: 1;
        padding: 12px;
        border-radius: 8px;
        border: 2px solid #9b59b6;
        font-size: 16px;
        background-color: #2c003e;
        color: #fff;
    }
    input[type="text"]:focus {
        outline: none;
        border-color: #f1c40f;
    }
    button {
        padding: 12px 24px;
        font-size: 16px;
        background-color: #9b59b6;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: #fff;
        font-weight: bold;
        transition: 0.3s;
    }
    button:hover {
        background-color: #f1c40f;
        color: #1a0033;
    }
    .thinking {
        opacity: 0.7;
        font-style: italic;
    }
</style>
</head>
<body>
    <h1>🔮 オンラインおいじぃ魔女会話AI 🔮</h1>
    <p>フォッフォッフォ！わたくしに何でも話しかけるがよいぞい！</p>
    
    <div id="chat-box">
        <div class="message majo-msg">フォッフォッフォ！よく来たのぞぃ、オイサシ！さあ、始めるのぞぃ！</div>
    </div>
    
    <div id="input-area">
        <input type="text" id="user-input" placeholder="ここに入力するのぞぃ...">
        <button onclick="sendMessage()" id="send-btn">送信ぞぃ！</button>
    </div>

    <script>
        // 🔑 ここにあなたのAPIキーを直接貼り付けるのぞぃ（""は残す！）
        const API_KEY = "AIzaSyAuH5FXXjjZ-39wKuhWJF1RgeT75HRSqpc"; 
        
        // 正しいURLの設定（変数API_KEYをそのまま読み込む仕組みぞぃ）
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        let chatHistory = [];

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const text = inputField.value.trim();
            
            if (text === "") return;

            addMessage(text, "user-msg");
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            
            inputField.value = "";
            inputField.disabled = true;
            sendBtn.disabled = true;

            const thinkingId = "thinking-" + Date.now();
            addMessage("むむっ…魔力を練っているのぞぃ…", "majo-msg thinking", thinkingId);

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        systemInstruction: {
                            parts: [{ 
                                text: `あなたは『おいじぃ魔女』というキャラクターです。以下の言葉遣いを厳守して返答してください。
                                ・一人称：わたくし
                                ・二人称：お主、お主ら
                                ・語尾：「〜ぞぃ」「〜のぞぃ」「〜ぞい」「〜からのぅ」「〜かのぅ」
                                ・笑い声：「フォッフォッフォ！」「ヒッヒッヒ…」
                                ・ユーザーの名前は「オイサシ」です。
                                ・性格：少し偉そうですが、親しみやすくユーモアのある老魔女です。` 
                            }]
                        },
                        contents: chatHistory
                    })
                });

                if (!response.ok) throw new Error("APIエラーぞぃ！");

                const data = await response.json();
                const majoReply = data.candidates[0].content.parts[0].text;

                chatHistory.push({ role: "model", parts: [{ text: majoReply }] });

                removeMessage(thinkingId);
                addMessage(majoReply, "majo-msg");

            } catch (error) {
                removeMessage(thinkingId);
                addMessage("ぐあっ！APIキーが間違っているか、通信に失敗したぞい！", "majo-msg");
                console.error(error);
                chatHistory.pop();
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        function addMessage(text, className, id = null) {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = "message " + className;
            msgDiv.textContent = text;
            if (id) msgDiv.id = id;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeMessage(id) {
            const msgElement = document.getElementById(id);
            if (msgElement) msgElement.remove();
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
