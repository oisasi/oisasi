<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おいさしAI | おいさし公式</title>

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">

<style>
:root, [data-theme="dark"] {
  --bg: #07070f;
  --bg-elevated: #0e0e1a;
  --surface: rgba(255,255,255,0.055);
  --surface-hover: rgba(255,255,255,0.11);
  --border: rgba(255,255,255,0.12);
  --text: #f4f4fc;
  --muted: #9b9bb8;
  --pink: #ff6bcb;
  --purple: #8b6cff;
  --cyan: #00e5ff;
  --gold: #ffd166;
  --header-bg: rgba(7,7,15,0.78);
  --header-bg-scrolled: rgba(7,7,15,0.94);
  --menu-bg: rgba(7,7,15,0.97);
  --shadow: 0 22px 55px rgba(0,0,0,0.5);
  --header-h: 64px;
  --nav-max: 1100px;
}
[data-theme="light"] {
  --bg: #f3f0f8;
  --bg-elevated: #ffffff;
  --surface: rgba(0,0,0,0.04);
  --surface-hover: rgba(0,0,0,0.075);
  --border: rgba(0,0,0,0.09);
  --text: #1a1a2e;
  --muted: #5c5c78;
  --pink: #e84a9a;
  --purple: #6b4ce0;
  --cyan: #0099b8;
  --gold: #c99200;
  --header-bg: rgba(255,255,255,0.82);
  --header-bg-scrolled: rgba(255,255,255,0.96);
  --menu-bg: rgba(255,255,255,0.97);
  --shadow: 0 18px 45px rgba(0,0,0,0.13);
}
@media (prefers-color-scheme: light) {
  [data-theme="auto"] {
    --bg: #f3f0f8; --bg-elevated: #ffffff; --surface: rgba(0,0,0,0.04);
    --surface-hover: rgba(0,0,0,0.075); --border: rgba(0,0,0,0.09);
    --text: #1a1a2e; --muted: #5c5c78; --pink: #e84a9a; --purple: #6b4ce0;
    --cyan: #0099b8; --gold: #c99200; --header-bg: rgba(255,255,255,0.82);
    --header-bg-scrolled: rgba(255,255,255,0.96); --menu-bg: rgba(255,255,255,0.97);
    --shadow: 0 18px 45px rgba(0,0,0,0.13);
  }
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    --bg: #07070f; --bg-elevated: #0e0e1a; --surface: rgba(255,255,255,0.055);
    --surface-hover: rgba(255,255,255,0.11); --border: rgba(255,255,255,0.12);
    --text: #f4f4fc; --muted: #9b9bb8; --pink: #ff6bcb; --purple: #8b6cff;
    --cyan: #00e5ff; --gold: #ffd166; --header-bg: rgba(7,7,15,0.78);
    --header-bg-scrolled: rgba(7,7,15,0.94); --menu-bg: rgba(7,7,15,0.97);
    --shadow: 0 22px 55px rgba(0,0,0,0.5);
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  font-size: 15px; line-height: 1.7; color: var(--text); background: var(--bg);
  min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  padding-top: var(--header-h); transition: background 0.45s, color 0.35s;
}
.bg {
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(ellipse 90% 60% at 15% -10%, color-mix(in srgb, var(--purple) 40%, transparent), transparent 55%),
    radial-gradient(ellipse 70% 50% at 90% 5%, color-mix(in srgb, var(--pink) 30%, transparent), transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 110%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 50%),
    var(--bg);
}
.orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.28; pointer-events: none; z-index: -1; }
[data-theme="light"] .orb, [data-theme="auto"] .orb { opacity: 0.14; }
@media (prefers-color-scheme: dark) { [data-theme="auto"] .orb { opacity: 0.28; } }
.orb-1 { width: 300px; height: 300px; background: var(--pink); top: -90px; left: -70px; }
.orb-2 { width: 240px; height: 240px; background: var(--purple); bottom: 8%; right: -50px; }
.orb-3 { width: 180px; height: 180px; background: var(--cyan); top: 42%; left: 58%; opacity: 0.18; }

/* HEADER */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); z-index: 1000;
  background: var(--header-bg); backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6); border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: var(--nav-max); height: 100%; margin: 0 auto;
  padding: 0 16px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.logo {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
  font-weight: 900; font-size: 17px; flex-shrink: 0; z-index: 1001;
}
.logo-img {
  width: 38px; height: 38px; border-radius: 11px; object-fit: contain; background: var(--surface);
  box-shadow: 0 4px 16px color-mix(in srgb, var(--pink) 35%, transparent);
}
.logo-text span {
  background: linear-gradient(120deg, var(--text), var(--pink) 60%, var(--purple));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.nav-desktop { display: none; align-items: center; gap: 4px; }
.nav-desktop a {
  padding: 8px 14px; border-radius: 11px; color: var(--muted); text-decoration: none;
  font-size: 14px; font-weight: 700; transition: all 0.25s; white-space: nowrap;
}
.nav-desktop a:hover { color: var(--text); background: var(--surface); }
.nav-desktop a.accent {
  background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff;
  box-shadow: 0 4px 18px color-mix(in srgb, var(--pink) 35%, transparent);
}
.header-actions { display: flex; align-items: center; gap: 8px; z-index: 1001; }
.icon-btn {
  width: 40px; height: 40px; border: none; border-radius: 12px; background: var(--surface);
  color: var(--text); display: grid; place-items: center; cursor: pointer; transition: all 0.25s;
}
.icon-btn:hover { background: var(--surface-hover); }
.icon-btn svg { width: 20px; height: 20px; }
.hamburger {
  display: flex; flex-direction: column; justify-content: center; gap: 5px;
  width: 40px; height: 40px; padding: 10px; border: none; background: var(--surface);
  border-radius: 12px; cursor: pointer;
}
.hamburger span { display: block; height: 2px; width: 100%; background: var(--text); border-radius: 2px; transition: all 0.3s; }
.hamburger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* SETTINGS */
.settings-panel {
  position: fixed; top: calc(var(--header-h) + 12px); right: 16px;
  width: min(300px, calc(100vw - 32px));
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px;
  box-shadow: var(--shadow); z-index: 1100; padding: 20px;
  opacity: 0; visibility: hidden; transform: translateY(-12px) scale(0.96);
  transition: all 0.3s; pointer-events: none;
}
.settings-panel.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); pointer-events: auto; }
.settings-title {
  font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;
}
.settings-close {
  width: 28px; height: 28px; border: none; border-radius: 8px; background: var(--surface);
  color: var(--muted); display: grid; place-items: center; cursor: pointer; font-size: 16px;
}
.settings-close:hover { background: var(--surface-hover); color: var(--text); }
.settings-group { margin-bottom: 18px; }
.settings-group:last-child { margin-bottom: 0; }
.settings-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; display: block; }
.settings-options { display: flex; flex-wrap: wrap; gap: 8px; }
.settings-options button {
  flex: 1; min-width: 72px; padding: 11px 8px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 13px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: all 0.25s;
}
.settings-options button:hover { background: var(--surface-hover); }
.settings-options button.active {
  background: linear-gradient(135deg, var(--pink), var(--purple)); border-color: transparent; color: #fff;
}

/* MOBILE MENU */
.nav-mobile {
  position: fixed; inset: 0; z-index: 999; background: var(--menu-bg);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  opacity: 0; visibility: hidden; pointer-events: none; transition: all 0.35s;
}
.nav-mobile.open { opacity: 1; visibility: visible; pointer-events: auto; }
.nav-mobile a {
  display: flex; align-items: center; gap: 14px; padding: 17px 28px; min-width: 270px;
  border-radius: 16px; color: var(--text); text-decoration: none; font-size: 18px; font-weight: 700;
  background: var(--surface); border: 1px solid var(--border);
}
.nav-mobile .icon {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 19px;
  background: linear-gradient(145deg, color-mix(in srgb, var(--pink) 28%, transparent), color-mix(in srgb, var(--purple) 22%, transparent));
}
.nav-mobile-footer { margin-top: 36px; font-size: 13px; color: var(--muted); }

/* START SCREEN - true center, never bottom */
.start-view {
  position: fixed;
  top: var(--header-h);
  left: 0; right: 0; bottom: 0;
  display: flex !important;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  z-index: 15;
  text-align: center;
}
.start-view[hidden] {
  display: none !important;
}
.start-title {
  font-size: clamp(26px, 6.5vw, 38px);
  font-weight: 900;
  line-height: 1.4;
  letter-spacing: -0.03em;
  margin: 0 0 36px;
  max-width: 540px;
  color: #c44b9a !important;
  opacity: 1 !important;
  visibility: visible !important;
}
.start-title #greetingText {
  color: #c44b9a !important;
  display: inline !important;
  opacity: 1 !important;
  visibility: visible !important;
}
.start-title .start-sub {
  color: #7b5cff !important;
  font-size: 0.92em;
  font-weight: 800;
  opacity: 1 !important;
  visibility: visible !important;
}

/* Input bar */
.ask-bar {
  display: flex; align-items: center; gap: 8px;
  width: 100%; max-width: 520px;
  padding: 10px 10px 10px 22px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
}
[data-theme="dark"] .ask-bar {
  background: var(--bg-elevated); border-color: var(--border); box-shadow: var(--shadow);
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] .ask-bar {
    background: var(--bg-elevated); border-color: var(--border); box-shadow: var(--shadow);
  }
}
.ask-bar:focus-within {
  border-color: color-mix(in srgb, var(--pink) 40%, transparent);
  box-shadow: 0 4px 28px color-mix(in srgb, var(--pink) 18%, transparent);
}
.ask-bar input {
  flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  color: var(--text); font-size: 15px; font-family: inherit; padding: 10px 4px;
}
.ask-bar input::placeholder { color: var(--muted); }
.ask-icon-btn {
  flex-shrink: 0; width: 42px; height: 42px; border: none; border-radius: 50%;
  background: transparent; color: var(--muted); display: grid; place-items: center;
  cursor: pointer; transition: all 0.2s;
}
.ask-icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.ask-icon-btn svg { width: 20px; height: 20px; }
.ask-icon-btn.send {
  background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff;
}
.ask-icon-btn.send:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 16px color-mix(in srgb, var(--pink) 40%, transparent);
}

/* CHAT VIEW */
.chat-view {
  position: fixed;
  top: var(--header-h); left: 0; right: 0; bottom: 0;
  z-index: 20;
  display: flex; flex-direction: column;
  background: var(--bg);
}
/* critical: author CSS display:flex must not override the hidden attribute */
.chat-view[hidden] {
  display: none !important;
}
.start-view[hidden] {
  display: none !important;
}
.chat-view::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 90% 55% at 20% -5%, color-mix(in srgb, var(--pink) 20%, transparent), transparent 55%),
    radial-gradient(ellipse 80% 50% at 85% 0%, color-mix(in srgb, var(--purple) 16%, transparent), transparent 50%),
    var(--bg);
  pointer-events: none;
}
.chat-panel {
  display: flex; flex-direction: column; flex: 1; min-height: 0;
  max-width: 720px; width: 100%; margin: 0 auto;
}
.chat-box {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 28px;
  padding: 28px 20px 16px; -webkit-overflow-scrolling: touch;
}
.chat-msg {
  display: flex; flex-direction: column; max-width: 90%;
  animation: msgIn 0.3s ease both;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.chat-msg.user { align-self: flex-end; align-items: flex-end; }
.chat-msg.ai { align-self: flex-start; align-items: flex-start; max-width: 100%; }
.msg-row { display: flex; gap: 12px; align-items: flex-start; }
.chat-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 15px;
  background: linear-gradient(145deg, color-mix(in srgb, var(--pink) 35%, transparent), color-mix(in srgb, var(--purple) 25%, transparent));
  margin-top: 2px;
}
.chat-bubble {
  padding: 12px 18px; border-radius: 22px; font-size: 15.5px;
  line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.chat-msg.user .chat-bubble { background: #f0eef5; color: #1a1a2e; border: none; }
[data-theme="dark"] .chat-msg.user .chat-bubble { background: rgba(255,255,255,0.12); color: var(--text); }
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] .chat-msg.user .chat-bubble { background: rgba(255,255,255,0.12); color: var(--text); }
}
.chat-msg.ai .chat-bubble {
  background: transparent; border: none; padding: 2px 0; color: var(--text); border-radius: 0;
}
.chat-msg.ai .chat-bubble a { color: var(--cyan); font-weight: 700; text-decoration: underline; word-break: break-all; }
.chat-msg.error .chat-bubble {
  background: color-mix(in srgb, #e74c3c 12%, transparent);
  border: 1px solid rgba(231,76,60,0.35); border-radius: 16px; padding: 12px 16px;
  color: color-mix(in srgb, #e74c3c 55%, var(--text)); font-size: 13px;
}
.msg-actions {
  display: flex; align-items: center; gap: 4px; margin-top: 10px; padding-left: 44px; opacity: 0.75;
}
.chat-msg:hover .msg-actions { opacity: 1; }
.msg-action-btn {
  width: 32px; height: 32px; border: none; border-radius: 50%; background: transparent;
  color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: all 0.2s;
}
.msg-action-btn:hover { background: var(--surface-hover); color: var(--text); }
.msg-action-btn svg {
  width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
.msg-action-btn.copied { color: var(--pink); }
.msg-action-btn.copied svg { stroke: var(--pink); }
.chat-hint {
  text-align: center; font-size: 11.5px; color: var(--muted);
  padding: 2px 12px 10px; flex-shrink: 0;
}
.chat-view .ask-bar {
  flex-shrink: 0; margin: 0 16px 14px; max-width: calc(100% - 32px);
}
@media (min-width: 768px) {
  .chat-view .ask-bar { margin: 0 auto 18px; max-width: 640px; }
  .nav-desktop { display: flex; }
  .hamburger { display: none; }
  .nav-mobile { display: none !important; }
  .start-title { font-size: 40px; }
  .ask-bar { max-width: 560px; }
}
</style>
</head>

</nav>

<!-- START: title + input dead center -->
<div class="start-view" id="startView">
  <h1 class="start-title">
    <span id="greetingText">こんにちは、おいさしAIです</span><br>
    <span class="start-sub" data-i18n-html="start_help">何かお手伝いできることはありますか？</span>
  </h1>
  <div class="ask-bar" id="startAskBar">
    <input type="text" id="start-input" data-i18n-placeholder="ask_placeholder" placeholder="おいさしAI に相談">
    <button class="ask-icon-btn send" id="startSendBtn" aria-label="送信">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<!-- CHAT -->
<div class="chat-view" id="chatView" hidden>
  <div class="chat-panel">
    <div class="chat-box" id="chat-box"></div>
    <div class="ask-bar" id="chatAskBar">
      <button class="ask-icon-btn" id="chatNewBtn" aria-label="新しい会話" title="新しい会話">＋</button>
      <input type="text" id="user-input" data-i18n-placeholder="ask_placeholder" placeholder="おいさしAI に相談">
      <button class="ask-icon-btn send" id="send-btn" aria-label="送信">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>
  <p class="chat-hint" data-i18n="ask_hint">※ AIによる自動応答です。内容は誤りを含む場合があります。</p>
</div>

<script>
(function () {
  const html = document.documentElement;
  const hamburger = document.getElementById('hamburger');
  const navMobile = document.getElementById('navMobile');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const settingsClose = document.getElementById('settingsClose');

  const i18n = {
    ja: {
      settings: '設定', theme: 'テーマ', language: '言語',
      auto: '自動', dark: 'ダーク', light: 'ライト',
      nav_oijiiw: 'おいじぃ魔女のホームページ', nav_logo: 'おいさしのロゴページ',
      nav_ai: 'おいさしAIページ', nav_character: 'キャラクターページ', nav_faq: 'FAQページ',
      start_help: '何かお手伝いできることはありますか？',
      greet_morning: 'おはようございます、おいさしAIです',
      greet_day: 'こんにちは、おいさしAIです',
      greet_evening: 'こんばんは、おいさしAIです',
      ask_placeholder: 'おいさしAI に相談',
      ask_hint: '※ AIによる自動応答です。内容は誤りを含む場合があります。',
      chat_error: '通信エラーが発生しました。'
    },
    en: {
      settings: 'Settings', theme: 'Theme', language: 'Language',
      auto: 'Auto', dark: 'Dark', light: 'Light',
      nav_oijiiw: 'Oijii Witch Homepage', nav_logo: 'Oisasi Logo Page',
      nav_ai: 'Oisasi AI Page', nav_character: 'Character Page', nav_faq: 'FAQ Page',
      start_help: 'How can I help you today?',
      greet_morning: 'Good morning, I\'m OisasiAI',
      greet_day: 'Hello, I\'m OisasiAI',
      greet_evening: 'Good evening, I\'m OisasiAI',
      ask_placeholder: 'Ask OisasiAI',
      ask_hint: '※ This is an automated AI response and may contain errors.',
      chat_error: 'A connection error occurred.'
    }
  };

  function resolveLang(pref) {
    if (pref === 'ja' || pref === 'en') return pref;
    return (navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  }
  function applyLang(pref) {
    localStorage.setItem('oisasi-lang', pref);
    const lang = resolveLang(pref);
    html.setAttribute('lang', lang);
    document.querySelectorAll('#langOptions button').forEach(btn => btn.classList.toggle('active', btn.dataset.value === pref));
    const t = i18n[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (t[k] != null) el.textContent = t[k]; });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { const k = el.getAttribute('data-i18n-html'); if (t[k] != null) el.innerHTML = t[k]; });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if (t[k] != null) el.placeholder = t[k]; });
    window.__oisasiChatI18n = t;
    if (typeof updateGreeting === 'function') updateGreeting();
  }
  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    localStorage.setItem('oisasi-theme', theme);
    document.querySelectorAll('#themeOptions button').forEach(btn => btn.classList.toggle('active', btn.dataset.value === theme));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      if (theme === 'light') meta.content = '#f3f0f8';
      else if (theme === 'dark') meta.content = '#0a0a12';
      else meta.content = window.matchMedia('(prefers-color-scheme: light)').matches ? '#f3f0f8' : '#0a0a12';
    }
  }

  function updateGreeting() {
    const dict = window.__oisasiChatI18n || {};
    // Use Japan time (JST)
    const hour = Number(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo', hour: 'numeric', hour12: false }));
    let key = 'greet_day';
    if (hour >= 5 && hour < 11) key = 'greet_morning';
    else if (hour >= 18 || hour < 5) key = 'greet_evening';
    const el = document.getElementById('greetingText');
    if (el) {
      el.textContent = dict[key] || (
        key === 'greet_morning' ? 'おはようございます、おいさしAIです' :
        key === 'greet_evening' ? 'こんばんは、おいさしAIです' :
        'こんにちは、おいさしAIです'
      );
    }
  }

  applyTheme(localStorage.getItem('oisasi-theme') || 'auto');
  applyLang(localStorage.getItem('oisasi-lang') || 'auto');
  updateGreeting();


  function closeMenu() {
    navMobile.classList.remove('open');
    hamburger.classList.remove('active');
    hamburger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }
  function closeSettings() { settingsPanel.classList.remove('open'); }
  function closeAll() { closeMenu(); closeSettings(); }

  settingsBtn.addEventListener('click', e => { e.stopPropagation(); settingsPanel.classList.toggle('open'); closeMenu(); });
  settingsClose.addEventListener('click', closeSettings);
  document.getElementById('themeOptions').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyTheme(b.dataset.value); });
  document.getElementById('langOptions').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyLang(b.dataset.value); });
  hamburger.addEventListener('click', () => {
    const isOpen = navMobile.classList.toggle('open');
    hamburger.classList.toggle('active', isOpen);
    hamburger.setAttribute('aria-expanded', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
    if (isOpen) closeSettings();
  });
  document.addEventListener('click', e => {
    if (settingsPanel.classList.contains('open') && !settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) closeSettings();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
  window.closeAll = closeAll;
})();
</script>

<script>
(function () {
  const API_SERVER_URL = "https://oijii-majo-api.oisasioisasi.workers.dev";
  const SYSTEM_PROMPT = `あなたは「おいさしAI」という、おいさし公式サイトのAIアシスタントです。
・丁寧で親しみやすい、自然な日本語（敬体）で簡潔に答えてください。特定のキャラクター口調や方言は使わないでください。
・おいさし関連のSNSやサイトについて聞かれたら、以下の情報をもとに正確に案内してください。
・おいじぃ魔女のSNS
  https://www.instagram.com/oijiiw （Instagram）
  https://www.youtube.com/@oijiiw （YouTube）
  https://www.facebook.com/oijiiw （Facebook）
  https://x.com/oijiiw （X）
  https://www.tiktok.com/@oijiiw （TikTok）
  おいじぃ魔女のホームページ： https://oisasi.f5.si/oijiiw
・おいじぃ魔女雑学のSNS
  https://www.instagram.com/oijiizatu （Instagram）
  https://www.youtube.com/@oijiizatu （YouTube）
  https://www.facebook.com/oijiizatu （Facebook）
  https://x.com/oijiizatu （X）
  https://www.tiktok.com/@oijiizatu （TikTok）
  雑学ホームページ： https://oisasi.f5.si/oijiizatu
・おいさしのSNS
  https://www.youtube.com/@oisasiofficial （YouTube）
  https://www.facebook.com/oisasiofficial （Facebook）
  https://x.com/oisasiofficial （X）
  https://www.tiktok.com/@oisasiofficial （TikTok）
・おいさし公式ホームページ： https://oisasi.f5.si`;

  let conversationMessages = [{ role: "system", content: SYSTEM_PROMPT }];
  let started = false;

  function t(key, fallback) {
    const dict = window.__oisasiChatI18n;
    return (dict && dict[key] != null) ? dict[key] : fallback;
  }

  const startView = document.getElementById('startView');
  const chatView = document.getElementById('chatView');
  const startInput = document.getElementById('start-input');
  const startSendBtn = document.getElementById('startSendBtn');
  const chatNewBtn = document.getElementById('chatNewBtn');
  const inputField = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const chatBox = document.getElementById('chat-box');

  function showChatView() {
    if (started) return;
    started = true;
    startView.hidden = true;
    chatView.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function resetChat() {
    conversationMessages = [{ role: "system", content: SYSTEM_PROMPT }];
    chatBox.innerHTML = '';
    started = false;
    chatView.hidden = true;
    startView.hidden = false;
    document.body.style.overflow = '';
    startInput.value = '';
    startInput.focus();
  }

  async function sendMessage(text) {
    if (!text) return;
    if (!started) showChatView();
    addMessage(text, "user");
    conversationMessages.push({ role: "user", content: text });
    inputField.disabled = true;
    sendBtn.disabled = true;
    try {
      const response = await fetch(API_SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversationMessages })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(`[HTTP ${response.status}] ${data.error || response.statusText}`);
      const reply = data.choices[0].message.content;
      conversationMessages.push({ role: "assistant", content: reply });
      addMessage(reply, "ai");
    } catch (error) {
      addMessage(`${t('chat_error', '通信エラーが発生しました。')}\n${error.message}`, "error");
      conversationMessages.pop();
    } finally {
      inputField.disabled = false;
      sendBtn.disabled = false;
      inputField.focus();
    }
  }

  function linkify(text) {
    return text.replace(/(https?:\/\/[^\s\(\)\<\>]+)/g, function (url) {
      const clean = url.replace(/[\.\,\;\:]$/, '');
      return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>`;
    });
  }
  function escapeHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
  function createActionButton(svgPath, title, onClick) {
    const btn = document.createElement("button");
    btn.className = "msg-action-btn";
    btn.type = "button";
    btn.title = title;
    btn.setAttribute("aria-label", title);
    btn.innerHTML = `<svg viewBox="0 0 24 24">${svgPath}</svg>`;
    btn.addEventListener("click", onClick);
    return btn;
  }

  function addMessage(text, type) {
    const wrap = document.createElement("div");
    wrap.className = "chat-msg " + type;
    const isUser = type.indexOf("user") === 0;
    const isAi = type.indexOf("ai") === 0;
    const isError = type.indexOf("error") === 0;
    const bubble = document.createElement("div");
    bubble.className = "chat-bubble";
    if (isAi || isError) bubble.innerHTML = linkify(escapeHTML(text));
    else bubble.textContent = text;

    if (isUser) {
      wrap.appendChild(bubble);
    } else {
      const row = document.createElement("div");
      row.className = "msg-row";
      const avatar = document.createElement("div");
      avatar.className = "chat-avatar";
      avatar.textContent = isError ? "⚠️" : "✨";
      row.appendChild(avatar);
      row.appendChild(bubble);
      wrap.appendChild(row);
      if (isAi) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";
        const copyBtn = createActionButton(
          '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
          "コピー",
          async () => {
            try {
              await navigator.clipboard.writeText(text);
              copyBtn.classList.add("copied");
              setTimeout(() => copyBtn.classList.remove("copied"), 1800);
            } catch (e) {
              const ta = document.createElement("textarea");
              ta.value = text; document.body.appendChild(ta); ta.select();
              document.execCommand("copy"); document.body.removeChild(ta);
              copyBtn.classList.add("copied");
              setTimeout(() => copyBtn.classList.remove("copied"), 1800);
            }
          }
        );
        actions.appendChild(copyBtn);
        actions.appendChild(createActionButton(
          '<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>',
          "良い回答", function () { this.classList.toggle("copied"); }
        ));
        actions.appendChild(createActionButton(
          '<path d="M10 15V19a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>',
          "改善が必要", function () { this.classList.toggle("copied"); }
        ));
        actions.appendChild(createActionButton(
          '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
          "再生成", () => {}
        ));
        wrap.appendChild(actions);
      }
    }
    chatBox.appendChild(wrap);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  startSendBtn.addEventListener('click', () => {
    const text = startInput.value.trim();
    startInput.value = '';
    sendMessage(text);
  });
  startInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') {
      const text = startInput.value.trim();
      startInput.value = '';
      sendMessage(text);
    }
  });
  if (chatNewBtn) chatNewBtn.addEventListener('click', resetChat);
  sendBtn.addEventListener('click', () => {
    const text = inputField.value.trim();
    inputField.value = '';
    sendMessage(text);
  });
  inputField.addEventListener('keypress', e => {
    if (e.key === 'Enter') {
      const text = inputField.value.trim();
      inputField.value = '';
      sendMessage(text);
    }
  });
})();
</script>
