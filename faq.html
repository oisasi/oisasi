<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAQ - おいさし</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
body{font:15px/1.6 system-ui,sans-serif;max-width:520px;margin:auto;padding:20px;color:#222;background:#f7f9fa}
h1{font-size:22px;margin-bottom:20px}
details{background:#fff;border:1px solid #dde;border-radius:8px;padding:12px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ ";color:#0aa}
details[open] summary::before{content:"− "}
details p{margin:10px 0 0;color:#444}
.btn{display:block;margin:24px 0 0;padding:10px;border:1px solid #ccc;border-radius:8px;text-align:center;text-decoration:none;color:#333;background:#fff}
footer{margin-top:28px;font-size:12px;color:#888;text-align:center}
</style>
</head>
<body>
<h1>FAQ</h1>
<details>
<summary>「おいさし」は以前から？</summary>
<p>旧名「おじさんとオジィ」。2025年6月13日20時に改名。</p>
</details>
<details>
<summary>このホームページの特徴は？</summary>
<p>超軽量設計（128kbpsの通信制限下でも爆速表示）。</p>
</details>
<details>
<summary>名前の由来は？</summary>
<p>「美味しさ」より。お：美味しい／い：いつでも／さ：最後まで／し：しっかり。「おいさ」と「し」の入れ替え＝美味しさ。</p>
</details>
<a class="btn" href="index.html">トップに戻る</a>
<footer>超軽量設計（128kbpsの通信制限下でも爆速表示）。</footer>
</body>
</html>
