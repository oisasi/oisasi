<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おいさしのロゴ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1a3a2a;
      color: #e8f0e8;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.7;
      padding: 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 560px;
      text-align: center;
    }
    img {
      width: min(70vw, 320px);
      height: auto;
      margin-bottom: 1.5rem;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }
    p {
      font-size: 0.95rem;
      text-align: left;
      margin-bottom: 1rem;
      opacity: 0.9;
    }
    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin: 1.8rem 0 0.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.55rem 1.1rem;
      font-size: 0.88rem;
      border: 1px solid #5a8a5a;
      border-radius: 6px;
      background: transparent;
      color: #c8e0c8;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover {
      background: #2a4a2a;
      color: #fff;
    }
    #msg {
      font-size: 0.85rem;
      height: 1.4em;
      color: #8fd48f;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="logo" src="おいさしロゴ.png" alt="おいさし">
    <h1>おいさし ロゴ</h1>
    <p>
      円の中に、キーボードのキーと流れるような曲線が融合したデザイン。
    </p>
    <p>
      左側のキー配列は「入力・創造」を表し、右側のS字のうねりは「流れ・進化・自由」をイメージしています。
    </p>
    <p>
      紫からピンク、オレンジへと移り変わるグラデーションは、デジタルと有機的なエネルギーの調和を表現。
    </p>
    <p>
      濃い緑の背景に映える鮮やかな色使いで、シンプルながら印象に残るマークです。
    </p>

    <div class="btns">
      <a class="btn" href="https://oisasi.f5.si">おいさし公式ホームページに戻る</a>
      <a class="btn" href="おいさしロゴ.png" download="おいさしロゴ.png">ロゴをダウンロード</a>
      <button class="btn" id="copyBtn">ロゴをコピー</button>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    document.getElementById('copyBtn').onclick = async () => {
      const msg = document.getElementById('msg');
      try {
        const res = await fetch('おいさしロゴ.png');
        const blob = await res.blob();
        await navigator.clipboard.write([
          new ClipboardItem({ [blob.type]: blob })
        ]);
        msg.textContent = 'ロゴをコピーしました';
      } catch (e) {
        msg.textContent = 'コピーに失敗しました';
      }
      setTimeout(() => msg.textContent = '', 2500);
    };
  </script>
</body>
</html>
